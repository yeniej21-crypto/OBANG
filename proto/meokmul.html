/* 먹물의 오늘 한 장 — 무료 타로 한 장(10/3 은주: 타로 진행 = 먹물). 묘당 검은 고양이가 말하는 영상으로 맞이하고, 한 장 뽑게 하고, 반응하고, 무진 카드방으로 넘긴다.
   하루 한 장(localStorage obMeok). 화면 문구: 물음표 · 느낌표 · 말줄임표 · 이모지 없음. 각진 면(동그라미만 예외). */
:root{--brush:'OBrush','Song Myung',serif;--sans:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bg:#120e0c;--ink:#f4ece0;--ink2:#cdbfac;--ink3:#8f8273;--gold:#e3b866;--line:rgba(255,236,210,.12);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#0a0807;color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;word-break:keep-all}
button{font-family:inherit;cursor:pointer}
.stage{position:relative;width:100%;max-width:460px;min-height:100%;background:var(--bg)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(#120e0c,rgba(18,14,12,0))}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.top b{font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.vw{position:relative;margin:0 16px;height:min(54vh,520px);overflow:hidden;background:#1a1512 center 30%/cover no-repeat}
.vw video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;opacity:0;transition:opacity .35s}
.vw video.on{opacity:1}
.vw:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(rgba(18,14,12,0),rgba(18,14,12,.92));pointer-events:none}
.sub{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;font-family:'Song Myung',serif;font-size:19px;line-height:1.5;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);min-height:28px;transition:opacity .3s}
.who{position:absolute;left:12px;top:12px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.08em;color:#1a1208;background:var(--gold);padding:5px 8px}
.hd{padding:14px 20px 0}
.hd small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.hd h1{margin:4px 0 0;font-family:var(--brush);font-weight:400;font-size:30px;line-height:1.15}
.hd p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.fan{position:relative;height:186px;margin:6px 0 0;overflow:hidden;perspective:900px}
.cd{position:absolute;top:18px;left:50%;width:84px;height:140px;margin-left:-42px;border:0;padding:0;background:transparent;transform-origin:50% 120%;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.cd i{position:absolute;inset:0;background:#2a211a url('img/tarot/back.jpg') center/cover;box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(227,184,102,.35)}
.cd:hover i,.cd:focus-visible i{box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(227,184,102,.9)}
.fan.done .cd{pointer-events:none}
.fan.done .cd:not(.pk){opacity:0}
.res{display:none;padding:6px 20px 0}
.res.on{display:block}
.slot{position:absolute;right:16px;bottom:84px;width:86px;height:144px;z-index:3;opacity:0;transform:translateY(60px) rotate(8deg) scale(.85);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.slot.on{opacity:1;transform:rotate(5deg)}
.slot .flip{width:100%;height:100%;margin:0}
.flip{perspective:1000px}
.res{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.res.show{opacity:1;transform:none}
.rdy{display:none;margin:12px auto 0;padding:9px 16px;border:1px solid rgba(227,184,102,.5);background:rgba(0,0,0,.35);color:var(--gold);font-size:13px;font-weight:800}
.rdy.on{display:block}
.fan.wait .cd{opacity:.55}
.fan .cd{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:center/cover no-repeat;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(227,184,102,.4)}
.flip .f{background-image:url('img/tarot/back.jpg')}
.flip .b{transform:rotateY(180deg)}
.flip .b.rv{transform:rotateY(180deg) rotate(180deg)}
.rn{margin:18px 0 0;text-align:center}
.rn small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.rn b{display:block;margin-top:6px;font-family:var(--brush);font-weight:400;font-size:32px}
.kw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.kw span{font-size:12px;color:var(--ink2);border:1px solid var(--line);padding:4px 8px}
.rd{margin:18px 0 0;padding:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;line-height:1.75;color:var(--ink)}
.rd em{display:block;margin-top:10px;font-style:normal;font-size:13.5px;color:var(--ink2)}
.cta{display:flex;flex-direction:column;gap:8px;margin:18px 0 0}
.cta button{width:100%;padding:15px;border:0;font-size:15px;font-weight:800}
.cta .p{background:var(--gold);color:#1a1208}
.cta .s{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{margin:16px 0 0;font-size:12px;color:var(--ink3);text-align:center;line-height:1.6}
.pad{height:calc(env(safe-area-inset-bottom,0px) + 40px)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top"><button class="ib" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b>FREE · 오늘 한 장</b></div>
  <div class="vw" id="vw"><span class="who">묘당 · 먹물</span><video id="va" playsinline preload="auto"></video><video id="vb" playsinline preload="auto"></video><div class="slot" id="slot"><div class="flip" id="flip"><div class="in"><div class="f"></div><div class="b" id="cb"></div></div></div></div><div class="sub" id="sub"></div></div>
  <button class="rdy" id="rdy" type="button">풀이 바로 보기</button>
  <div class="hd" id="hd"><small>묘당 뒷방 카드</small><h1>먹물의 오늘 한 장</h1><p>생각 하나만 품고, 끌리는 카드를 눌러요. 하루에 한 장이에요.</p></div>
  <div class="fan" id="fan"></div>
  <div class="res" id="res">
    <div class="rn"><small id="rDir"></small><b id="rName"></b><div class="kw" id="rKw"></div></div>
    <div class="rd" id="rTxt"></div>
    <div class="cta"><button class="p" id="goMujin" type="button">무진 카드방에서 깊게 보기</button><button class="s" id="goShare" type="button">친구한테도 한 장 보내기</button><button class="s" id="goHome" type="button">홈으로</button></div>
    <p class="note">재미로 보는 한 장이에요. 내일 다시 오면 새 카드를 뽑을 수 있어요.</p>
  </div>
  <div class="pad"></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const D2='https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/';
const POSTER='https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_073740_e14c75eb-d09a-4494-a57e-021fefdda659_min.webp';
/* 말하는 영상(대사는 meokmul_lines.js 와 같은 문장). 영상이 없으면 그림 + 자막만 */

let cur=$('va'), nxt=$('vb'), tok=0;
function say(k){ const my=++tok; return new Promise(res=>{ const c=CLIP[k]; if(!c){ res(); return; }
    $('sub').style.opacity=0; setTimeout(()=>{ if(my===tok){ $('sub').textContent=c.t||''; $('sub').style.opacity=1; } },180);
    if(!c.v){ setTimeout(res,c.t?2200:200); return; }
    const v=nxt; v.src=c.v; v.muted=muted(); let done=false; const fin=()=>{ if(done) return; done=true; v.onended=null; res(my===tok); };
    v.onended=fin; v.onerror=()=>setTimeout(fin,1500);
    const go=()=>{ if(my!==tok){ v.pause(); return; } v.classList.add('on'); cur.classList.remove('on'); const old=cur; setTimeout(()=>{ try{ old.pause(); }catch(e){} },400); cur=v; nxt=old; };
    const p=v.play(); if(p&&p.then) p.then(go).catch(()=>{ v.muted=true; v.play().then(go).catch(()=>setTimeout(fin,2200)); }); else go();
    setTimeout(fin,9000); }); }
/* 하루 한 장 */
const today=new Date(); const dk=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();
let S={}; try{ S=JSON.parse(localStorage.getItem('obMeok')||'{}'); }catch(e){}
/* 점검용: ?test=1 이면 하루 한 장 제한 없이 매번 새로 뽑기(기록도 남기지 않음) */
const TEST=/[?&]test=1\b/.test(location.search); if(TEST) S={};
const save=()=>{ try{ localStorage.setItem('obMeok',JSON.stringify(S)); }catch(e){} };
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
/* 부채꼴 7장 */
const N=7; $('fan').innerHTML=Array.from({length:N},(_,i)=>{ const a=(i-(N-1)/2)*11, x=(i-(N-1)/2)*30; return `<button class="cd" type="button" data-i="${i}" aria-label="${i+1}번째 카드" style="transform:translateX(${x}px) rotate(${a}deg)"><i></i></button>`; }).join('');
function fill(r){ const C=TAROT[r.c]; const rv=!!r.rv;
  $('cb').style.backgroundImage="url('"+C.img+"')"; $('cb').classList.toggle('rv',rv);
  $('rDir').textContent=(rv?'거꾸로 나온 ':'바로 나온 ')+C.han+' · '+C.en;
  $('rName').textContent=C.ko;
  $('rKw').innerHTML=(rv?C.kwR:C.kw).map(x=>'<span>'+x+'</span>').join('');
  $('rTxt').innerHTML=(rv?C.rv:C.up)+(C.love?'<em>연애로 보면 '+(rv?C.love.rv:C.love.up)+'</em>':''); }
let shown=false;
function reveal(){ if(shown) return; shown=true; $('rdy').classList.remove('on');
  $('res').classList.add('on'); requestAnimationFrame(()=>$('res').classList.add('show'));
  /* 마지막 한마디는 영상 없이 자막으로만(풀이를 읽는 동안 말이 겹치지 않게) */
  setTimeout(()=>{ $('sub').style.opacity=0; setTimeout(()=>{ $('sub').textContent=CLIP.more.t; $('sub').style.opacity=1; },200); },400);
  setTimeout(()=>$('res').scrollIntoView({behavior:'smooth',block:'start'}),350); }
function pick(i){ if(S.d===dk||$('fan').classList.contains('done')) return; const fan=$('fan'); fan.classList.add('done');
  const b=fan.querySelector('[data-i="'+i+'"]'); b.classList.add('pk'); b.style.transform='translateY(-40px) scale(1.06)';
  const h=hash(dk+'|'+i+'|'+(S.n||0)+(TEST?'|'+Date.now():'')); const c=h%TAROT.length, rv=((h>>>8)%100)<28;
  S={d:dk,c,rv,n:(S.n||0)+1}; if(!TEST) save(); fill(S);
  /* 고른 카드가 먹물 앞 탁자로 올라가 뒤집히고, 그 카드를 보며 반응 → 끝나면 풀이 */
  setTimeout(()=>{ fan.style.display='none'; $('hd').style.display='none'; $('vw').scrollIntoView({behavior:'smooth',block:'start'}); $('slot').classList.add('on'); },380);
  setTimeout(()=>$('flip').classList.add('on'),1000);
  setTimeout(()=>{ const tone=(TAROT[c].tone||0)*(rv?-1:1); $('rdy').classList.add('on');
    say(tone>0?'good':'care').then(()=>setTimeout(reveal,350)); },1500); }
$('fan').addEventListener('click',e=>{ const b=e.target.closest('.cd'); if(b) pick(+b.dataset.i); });
$('rdy').onclick=reveal;
/* 시작 */
const hr=today.getHours(), first=!S.n;
if(S.d===dk){ $('fan').style.display='none'; $('hd').querySelector('p').textContent='오늘 뽑은 카드예요. 내일 새 카드가 기다려요.'; fill(S); $('slot').classList.add('on'); $('flip').classList.add('on'); shown=true; $('res').classList.add('on','show'); /* 하루 한 번: 다시 들어오면 먹물이 직접 말해 줌(두 가지 중 하나) */ say(((S.rv2=(S.rv2||0)+1)%2)?'again':'again2'); save(); }
else { $('fan').classList.add('wait');
  say(first?'first':((hr>=23||hr<4)?'night':'back')).then(ok=>{ $('fan').classList.remove('wait'); if(ok&&!$('fan').classList.contains('done')) say('pick'); }); }
$('goMujin').onclick=()=>{ location.href='tarot.html'; };
$('goHome').onclick=$('back').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} location.href='./'; };
$('goShare').onclick=()=>{ const u=location.origin+location.pathname; if(window.ObShare&&ObShare.sheet){ ObShare.sheet({title:'먹물의 오늘 한 장',text:'묘당 검은 고양이가 오늘 카드 한 장 뒤집어 줘',url:u}); return; }
  if(navigator.share){ navigator.share({title:'먹물의 오늘 한 장',url:u}).catch(()=>{}); } else { try{ navigator.clipboard.writeText(u); $('goShare').textContent='링크를 복사했어요'; }catch(e){} } };
})();
</script>
<script src="obshare.js"></script>
