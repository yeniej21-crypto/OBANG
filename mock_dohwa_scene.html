:root{--bg:#0a0a0d;--b1:#1c1c21;--b2:#26262c;--ink:#f2f0ee;--ink2:#a9a6a2;--ink3:#6e6b68;--pink:#ff8fa3;--me:#f4d9de}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:#000}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.pg{position:relative;width:100%;max-width:430px;min-height:100vh;background:var(--bg);overflow:hidden}

/* 첫 장면: 태오 영상이 화면을 쥔다 */
.open{position:relative;height:min(78svh,620px);min-height:520px;overflow:hidden}
.open video,.open .po{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.open .po{background:url('img/taeo/base.jpg') center 22%/cover no-repeat}
.open:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,13,.55) 0,rgba(10,10,13,0) 16%,rgba(10,10,13,0) 52%,rgba(10,10,13,.9) 86%,var(--bg) 100%)}
.bk{position:absolute;z-index:3;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center}
.ot{position:absolute;z-index:2;left:18px;right:18px;bottom:22px}
.ot small{display:block;font-size:11px;color:rgba(255,255,255,.62)}
.ot h1{margin:6px 0 0;font-family:'OBrush',serif;font-weight:400;font-size:46px;line-height:1;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.ot p{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.86)}

/* 대화 */
.thread{padding:6px 12px 120px}
.day{text-align:center;font-size:10.5px;color:var(--ink3);margin:10px 0 14px}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:6px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.row.on{opacity:1;transform:none}
.row .av{flex:none;width:30px;height:30px;border-radius:50%;background:url('img/taeo/base.jpg') center 18%/cover;visibility:hidden}
.row.first .av{visibility:visible}
.row .col{max-width:78%;display:flex;flex-direction:column;align-items:flex-start}
.row .nm{font-size:11px;color:var(--ink2);margin:0 0 4px}
.row:not(.first) .nm{display:none}
.bub{background:var(--b1);padding:9px 12px;font-size:13.5px;line-height:1.45;letter-spacing:-.01em}
.bub b{color:#fff}
.row .tm{font-size:9.5px;color:var(--ink3);margin-left:6px;align-self:flex-end;flex:none}
.row.me{justify-content:flex-end}
.row.me .bub{background:var(--me);color:#1a1213}
.row.me .col{align-items:flex-end}
.typing{display:inline-flex;gap:4px;padding:12px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* 메모 스크린샷 */
.memo{width:236px;background:#f6f4ef;color:#1b1a18;padding:12px 14px 14px;font-size:12px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.memo .h{display:flex;justify-content:space-between;font-size:10px;color:#9a958c}
.memo b.t{display:block;margin:6px 0 8px;font-size:15px;font-weight:900;letter-spacing:-.03em}
.memo .ln{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid #e5e1d8;font-size:13px}
.memo .ln span{width:20px;color:#9a958c;font-size:11px}
.memo .ln em{font-style:normal;color:#9a958c;font-size:11px;margin-left:auto}
.memo .ln.hit{position:relative}
.memo .ln.hit svg{position:absolute;left:24px;top:-3px;width:70px;height:30px;overflow:visible}
.memo .pen{font-family:'Nanum Pen Script',cursive;color:#c23a3a;font-size:19px;line-height:1;margin-left:auto}

/* 사진 */
.photo{width:200px;height:250px;background:#222 center 20%/cover no-repeat;box-shadow:0 10px 24px rgba(0,0,0,.45)}

/* 사람 카드 두 장 */
.two{display:flex;gap:6px;width:270px}
.two div{flex:1;background:var(--b2);padding:10px}
.two small{display:block;font-size:10px;color:var(--ink3)}
.two b{display:block;margin-top:4px;font-size:15px;font-weight:900;letter-spacing:-.03em}
.two p{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--ink2)}
.two .lk{color:transparent;text-shadow:0 0 6px rgba(255,255,255,.5);user-select:none}

/* 잠긴 달력 */
.cal{position:relative;width:250px;background:#f6f4ef;color:#1b1a18;padding:10px 12px 12px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.cal .h{font-size:10px;color:#9a958c}
.cal .g{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px;filter:blur(3.5px)}
.cal .g span{height:38px;border-top:1px solid #e5e1d8;font-size:12px;padding-top:4px;position:relative}
.cal .g span.c:after{content:"";position:absolute;left:-2px;top:0;width:26px;height:22px;border:1.5px solid #c23a3a;border-radius:50%}
.cal .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(246,244,239,.35);text-align:center}
.cal .veil b{font-size:13px;font-weight:900}
.cal .veil small{font-size:10.5px;color:#6b665e;margin-top:2px}

/* 음성 */
.voice{display:flex;align-items:center;gap:10px;width:220px;background:var(--b1);padding:10px 12px}
.voice .pl{width:30px;height:30px;border-radius:50%;background:var(--pink);display:grid;place-items:center;flex:none}
.voice .wv{flex:1;height:22px;background:repeating-linear-gradient(90deg,var(--ink3) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0,#000 100%);opacity:.6;clip-path:polygon(0 40%,8% 20%,16% 55%,24% 10%,32% 45%,40% 25%,48% 60%,56% 15%,64% 50%,72% 30%,80% 55%,88% 20%,100% 45%,100% 100%,0 100%)}
.voice small{font-size:10.5px;color:var(--ink2)}

/* 왜 그렇게 봤냐면 */
.why{margin-top:4px;font-size:11px;color:var(--ink3);background:none;border:0;padding:4px 0;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
.whyT{display:none;max-width:270px;margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--ink2);border-left:2px solid var(--b2);padding-left:8px}
.whyT.on{display:block}

/* 바로 답하기 */
.qr{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;opacity:0;transition:opacity .3s}
.qr.on{opacity:1}
.qr button{border:1px solid var(--me);background:none;color:var(--me);font:inherit;font-size:13px;padding:8px 12px}
.act{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:250px}
.act button{height:44px;border:0;background:var(--pink);color:#1a1213;font:inherit;font-size:13.5px;font-weight:900}
.act button.g{background:none;border:1px solid var(--b2);color:var(--ink);font-weight:700}
.act small{font-size:10.5px;color:var(--ink3);text-align:center}

/* 아래 입력줄 */
.bar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(10,10,13,.94);border-top:1px solid #1f1f24}
.bar span{flex:1;height:40px;display:flex;align-items:center;padding:0 12px;background:var(--b1);font-size:13px;color:var(--ink3)}
.bar button{width:40px;height:40px;border-radius:50%;border:0;background:var(--pink);display:grid;place-items:center}
.foot{font-size:10px;line-height:1.5;color:var(--ink3);text-align:center;margin:26px 10px 0}
</style>
</head>
<body>
<div class="pg">
  <section class="open">
    <div class="po"></div>
    <video id="ov" muted loop playsinline autoplay preload="auto" poster="img/taeo/base.jpg" src="v/taeo/L1.mp4"></video>
    <button class="bk" type="button" aria-label="뒤로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ot">
      <small>은주 누나 사주, 태오가 펼쳐 봄</small>
      <h1>밤의 도화</h1>
      <p>대화로 빠지게 만드는 타입. 아래로 내리면 태오가 보낸 게 와 있어.</p>
    </div>
  </section>

  <div class="thread" id="th">
    <div class="day">오늘 새벽 1:12</div>
  </div>
  <p class="foot">진행자는 AI로 만든 가상의 캐릭터예요. 풀이는 만세력 계산을 바탕으로 하며, 사람의 마음이나 행동을 단정하지 않아요.<br>시안 화면이에요. 문장과 계산은 실제 도화 결과(1996년 5월 14일 오시, 여자)에서 가져왔어요.</p>
</div>
<div class="bar"><span>태오에게 답장하기</span><button type="button" aria-label="보내기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1213" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>

<script>
const th=document.getElementById('th');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let lastWho='', t=12;
const tm=()=>`1:${String(t++).padStart(2,'0')}`;
function row(who,html){ const r=document.createElement('div'); const first=who!==lastWho; lastWho=who;
  r.className='row'+(who==='me'?' me':'')+(first?' first':'');
  r.innerHTML= who==='me' ? `<span class="tm">${tm()}</span><div class="col">${html}</div>` : `<i class="av"></i><div class="col"><div class="nm">태오</div>${html}</div><span class="tm">${tm()}</span>`;
  th.appendChild(r); requestAnimationFrame(()=>r.classList.add('on')); return r; }
async function typing(ms){ const r=row('t','<div class="bub typing"><i></i><i></i><i></i></div>'); await wait(ms); r.remove(); lastWho=''; if(th.lastElementChild&&th.lastElementChild.classList.contains('row')&&!th.lastElementChild.classList.contains('me')) lastWho='t'; }
async function say(html,ms=700){ await typing(ms); return row('t',html); }
function why(text){ return `<button class="why" type="button" onclick="this.nextElementSibling.classList.toggle('on')">왜 그렇게 봤냐면</button><div class="whyT">${text}</div>`; }
function ask(opts){ return new Promise(res=>{ const q=document.createElement('div'); q.className='qr'; q.innerHTML=opts.map((o,i)=>`<button type="button" data-i="${i}">${o}</button>`).join(''); th.appendChild(q); requestAnimationFrame(()=>q.classList.add('on'));
  q.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; q.remove(); row('me',`<div class="bub">${b.textContent}</div>`); res(+b.dataset.i); }; }); }
