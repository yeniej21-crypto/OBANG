/* 도화 궁합 — 친구 초대형. 링크(?f=)로 받은 사람은 보낸 사람과의 궁합을, 직접 들어온 사람은 두 명을 입력. 도화 사주와 같은 밤 톤. */
:root{
  --brush:'OBrush','Noto Serif KR',serif; --bmj:'Song Myung','Noto Serif KR',serif;
  --stage:#18141b; --ink:#f7f1ec; --ink-2:#d6cbc4; --ink-3:#9a8f89;
  --glass:rgba(20,14,20,.55); --line:rgba(255,226,214,.16);
  --peach:#ffb9a6; --peach-2:#ffd9cc; --blush:#ff8fa6; --rose:#e9667f;
  --sans:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:'Noto Serif KR',"Nanum Myeongjo",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#07060a;color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,select,input{font-family:inherit}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:var(--stage);overflow:hidden;overflow:clip}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0;border-radius:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .5s}
.scr::-webkit-scrollbar{display:none}
.scr.on{opacity:1;pointer-events:auto}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}
.gtop{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 62px);z-index:20;pointer-events:none}
.gtop .back{pointer-events:auto}
.hero{position:relative;height:46vh;min-height:320px;max-height:420px;background:#000 center 18%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,14,.3),transparent 25%,rgba(12,10,14,.2) 55%,var(--stage) 98%)}
.hero .ht{position:absolute;left:20px;right:20px;bottom:6px;z-index:2}
.hero small{font-size:12px;letter-spacing:.24em;color:var(--peach-2)}
.hero h1{margin:6px 0 6px;font-family:var(--serif);font-size:32px;font-weight:900}
.hero p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.inv{margin:14px 16px 0;padding:14px;border-radius:0;background:linear-gradient(135deg,rgba(255,185,166,.16),rgba(233,102,127,.1));border:1px solid rgba(255,185,166,.4);font-size:14px;line-height:1.6}
.inv b{color:var(--peach)}
.who{margin:14px 16px 0;padding:16px;border-radius:0;background:#151016;border:1px solid var(--line)}
.who h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--peach-2)}
.who h3 i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,185,166,.16);font-size:12px}
.who.locked{opacity:.9}
.who .lk{font-size:14px;color:var(--ink-2)}
.field{width:100%;height:46px;border-radius:0;border:1px solid var(--line);background:#1b141a;color:var(--ink);padding:0 14px;font-size:16px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:0;padding:3px}
.seg button{flex:1;height:36px;border:0;border-radius:0;background:none;color:var(--ink-2);font-weight:700;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--peach);color:#2a0d14}
.sel3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:8px}
select{height:46px;border-radius:0;border:1px solid var(--line);background:#1b141a;color:var(--ink);font-size:15px;padding:0 8px;width:100%}
.cta{display:block;width:calc(100% - 32px);margin:16px 16px 0;height:56px;border:0;border-radius:0;background:linear-gradient(135deg,#ffc7b8,#ff8fa6);color:#2a0d14;font-size:16.5px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(255,143,166,.3)}
.fine{text-align:center;font-size:12px;color:var(--ink-3);margin:12px 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
/* loading */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.hearts{position:relative;width:170px;height:110px;margin-bottom:26px}
.hearts span{position:absolute;top:10px;width:90px;height:90px;border-radius:50%;background:center 18%/cover no-repeat;box-shadow:0 0 0 2px var(--peach);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.hearts span:first-child{left:0;transform:translateX(-24px)}
.hearts span:last-child{right:0;transform:translateX(24px);background:#2a1a24;display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:900;color:var(--peach)}
.ld.go .hearts span:first-child{transform:translateX(12px)}.ld.go .hearts span:last-child{transform:translateX(-12px)}
.ld h2{font-family:var(--serif);font-size:20px;margin:0 0 6px}.ld p{margin:0;color:var(--ink-3);font-size:13.5px;min-height:20px}
/* ===== 두 꽃의 접목 기록 — 밝은 결과 (lovebright.css 위에 이 페이지만의 장면) ===== */
#sRs.lb{--acc:#c2573f;--acc-ink:#a13f2c;background-color:var(--paper)}
body.bright .stage>.top.tsd{background:rgba(246,240,230,.96);box-shadow:0 12px 14px -6px rgba(246,240,230,.96)}
body.bright .back{background:rgba(255,250,241,.86);border-color:rgba(42,33,25,.16);color:#2a2119;box-shadow:0 6px 16px -8px rgba(60,40,20,.4)}
#sRs .rs{position:relative;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 34px)}
.gh-mast{position:relative;padding:calc(env(safe-area-inset-top,0px) + 62px) 16px 0}
.gh-graft{position:relative;margin-top:10px}
.gh-graft svg{display:block;width:100%;height:auto}
.gh-graft .st{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:3}
.gh-names{display:grid;grid-template-columns:1fr 1fr;margin-top:-6px}
.gh-names div{padding:0 6px}
.gh-names div+div{text-align:right}
.gh-names b{display:block;font-family:var(--serif);font-size:18px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:clip}
.gh-names small{display:block;margin-top:3px;font-size:12px;font-weight:700;color:var(--acc-ink)}
.gh-ttl{text-align:center;padding:22px 0 4px}
.gh-ttl small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--ink-3)}
.gh-ttl h2{margin:8px 0 0;font-family:var(--brush);font-weight:400;font-size:38px;line-height:1.12;color:var(--ink)}
.gh-ttl p{margin:8px auto 0;max-width:330px;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.gh-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 26px}
.gh-two>div{padding:12px 12px 13px;background:var(--card);border:1px solid var(--line)}
.gh-two small{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.gh-two b{display:block;margin-top:2px;font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.1;color:var(--ink)}
.gh-two em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.gh-two .t{position:relative;height:7px;margin-top:10px;background:var(--paper-2);box-shadow:inset 0 1px 2px rgba(42,33,25,.12)}
.gh-two .t i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.gh-two .t i.s{background:repeating-linear-gradient(135deg,var(--ink-2) 0 2px,rgba(107,93,79,.6) 2px 4px)}
.gh-mast:after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--line)}
.gh-graft text{font-family:var(--sans)}
.gh-lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.gh-lg span{display:inline-flex;align-items:center;gap:6px}
.gh-lg svg{width:28px;height:10px}
.gh-cards{display:grid;gap:8px;margin-top:10px}
.gh-cards .lb-card small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc-ink)}
.gh-cards .lb-card.off small{color:var(--ink-3)}
.gh-el{display:grid;gap:9px;padding:14px;background:var(--card);border:1px solid var(--line)}
.gh-el>div{display:grid;grid-template-columns:42px 1fr 48px;gap:10px;align-items:center}
.gh-el .k{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--ink)}
.gh-el .bb{display:grid;gap:3px}
.gh-el .bb i{display:block;height:7px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.gh-el .bb i.a{background:var(--acc)}
.gh-el .bb i.b{background:repeating-linear-gradient(135deg,var(--ink-2) 0 2px,rgba(107,93,79,.55) 2px 4px)}
.gh-el .bb i.z{width:2px!important;background:var(--ink-3);opacity:.5}
.gh-el .n{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35}
.gh-el .n b{color:var(--ink);font-weight:700}
.gh-el>div.fill .k:after{content:"채움";display:block;width:max-content;margin-top:2px;padding:2px 4px;font-family:var(--sans);font-size:9.5px;font-weight:700;color:#fffaf2;background:var(--acc)}
.gh-pts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.gh-pts li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.gh-pts .lb-o{width:24px;height:24px;display:grid;place-items:center;border:1.5px solid var(--ink-2);font-family:var(--serif);font-weight:900;font-size:12px;color:var(--ink);background:var(--paper)}
.gh-pts li.neg .lb-o{border-radius:0;transform:rotate(45deg) scale(.85);background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gh-pts li.neg .lb-o span{transform:rotate(-45deg)}
.gh-pts p{margin:1px 0 0;font-size:14px;line-height:1.7;color:var(--ink)}
#sRs .lb-btn.ghost{margin-top:8px}
#gprem.pkx{--pk-card:var(--card);--pk-line:var(--line);--pk-acc:var(--acc);margin-top:30px}
#gprem.pkx .pk-sec{margin-top:12px;box-shadow:0 18px 36px -30px rgba(60,40,20,.55)}
#gprem.pkx .pk-sec>h3{font-size:17px}
#gprem.pkx .pk-card,#gprem.pkx .pk-vs div,#gprem.pkx .pk-st{background:#fffdf8}
#gprem.pkx .pk-letter{background:#fffdf8;box-shadow:0 24px 40px -30px rgba(60,40,20,.6)}
#gprem.pkx .pk-letter .pk-sg i{border-radius:50%;color:#fffaf2}
#gprem.pkx .pk-row.pk-hi .pk-a,#gprem.pkx .pk-row.pk-hi .pk-c{color:var(--acc-ink)}
#gprem.pkx .pk-row .pk-tag{color:#fffaf2}
.gh-open{display:flex;align-items:center;gap:16px;padding:18px 16px;background:var(--card);border:1px solid var(--line);border-top:2px solid var(--ink)}
.gh-open small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--acc-ink)}
.gh-open b{display:block;margin-top:4px;font-family:var(--serif);font-size:18px;font-weight:900;line-height:1.4;color:var(--ink)}
.gh-open .lb-stamp b{margin:2px 0;color:var(--paper);font-size:19px}
@media (prefers-reduced-motion:reduce){.gh-two .t i,.gh-el .bb i{transition:none}}
.toast{position:absolute;left:50%;bottom:60px;transform:translate(-50%,10px);z-index:60;background:rgba(30,20,26,.95);border:1px solid var(--line);padding:12px 18px;border-radius:0;font-size:14px;opacity:0;transition:all .35s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.hero h1,#hT{font-family:var(--brush)!important;font-weight:400!important;font-size:33px!important;line-height:1.2!important}

<script>

  const y=pr(0),m=pr(2),d=pr(4),h=a[6]<0?null:pr(6); if(![y,m,d].every(ok)||(h&&!ok(h))) return null; return {y,m,d,h}; }

  return null; }
const q=new URLSearchParams(location.search); const ME=q.get('me')?dec(q.get('me')):null; let FROM=null;
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
function form(el,title,idx,pre){

   <div class="sel3"><select data-k="y"></select><select data-k="m"></select><select data-k="d"></select></div>

function read(el,def){ const g=k=>el.querySelector(`[data-k=${k}]`); const seg=k=>el.querySelector(`.seg[data-k=${k}] .on`).dataset.v;

  $('hT').textContent=`${FROM.n}님이 궁합을 신청했어`; form($('wA'),'나',1,SP); lockedCard($('wB'),'신청한 사람',2,FROM); }
else { form($('wA'),'나',1,ME||SP); form($('wB'),'그 사람',2,null); }
function toP(o){ if(o.P) return o.P; let s={y:o.y,m:o.m,d:o.d}; if(o.c==='l'){ const c=Sj.lunarToSolar(o.y,o.m,o.d,false); if(c) s=c; } return Sj.pillars(s.y,s.m,s.d,o.h>=0?o.h:null); }
/* 화면에는 한자 대신 한글 읽기 */
const {GAN_K,JI_K}=Sj, EN=['나무','불','흙','쇠','물'], ANI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const bt=w=>{ const c=w.charCodeAt(w.length-1)-0xAC00; return c>=0&&c<11172&&c%28>0; }, jo=(w,x,y)=>w+(bt(w)?x:y);
const an=b=>`${JI_K[b]}(${ANI[b]})`;
function compat(A,B,a,b){
  const ea=stEl(A.d[0]), eb=stEl(B.d[0]); const gen=(x,z)=>(x+1)%5===z, ctl=(x,z)=>(x+2)%5===z;
  const chA=[A.y,A.m,A.d,A.h].filter(Boolean).map(p=>p[1]), chB=[B.y,B.m,B.d,B.h].filter(Boolean).map(p=>p[1]);
  const tA=target(A.d[1]), tB=target(B.d[1]);
  let pull=48, stay=50; const pts=[];

  if(wB===sA){ stay+=9; pts.push([`반대로 ${b.n}에게 모자란 ${EN[wB]} 기운은 ${ga(a.n)} 채워 줘.`,`${EN[wB]} 보완`,1]); }

  pull=Math.max(35,Math.min(97,pull)); stay=Math.max(30,Math.min(97,stay));
