<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팔자에 신이 들었다 · 오방사주</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* 오방사주 세계관 책 제1권 《팔자에 신이 들었다》 — 에디토리얼 v3
   흰 종이 + 진한 글씨(#111/#333) · 한글 Gothic A1(굵은 제목, 또렷한 본문) + 영문 포인트 Instrument Serif 이탤릭
   그라데이션 · 빛 번짐 · 칩 · 금색 · 종이 질감 없음. 글자는 최소 12px. 3D로 넘기는 종이는 그대로. */
:root{
  --kr:'Gothic A1',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --en:'Instrument Serif',Georgia,serif;
  --ink:#111; --ink2:#333; --ink3:#555; --rule:#e6e6e6; --paper:#fff; --c:#111; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#0b0b0b;color:var(--ink);font-family:var(--kr);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:#0b0b0b;overflow:hidden}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0}}
.top{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.ib svg{width:18px;height:18px}
.top b{flex:1;min-width:0;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 책 */
.book{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 58px);perspective:2200px}
.book::before{content:"";position:absolute;inset:0;background:#fff;box-shadow:2px 2px 0 #d9d9d9,4px 4px 0 #f4f4f4,5px 5px 0 #cfcfcf}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.7,.2,1);will-change:transform}
.leaf.turned{transform:rotateY(-178deg)}
.leaf.drag{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.back{transform:rotateY(180deg);background:#f7f7f7}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18));opacity:0;transition:opacity .85s;z-index:10}
.leaf.moving .shade{opacity:1}

/* 공통 조판 */
.rhd{position:absolute;left:22px;right:22px;bottom:16px;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:500;color:var(--ink3);z-index:5}
.rhd b{font-family:var(--en);font-weight:400;font-size:16px;color:var(--ink)}
.plate{position:relative;height:44%;background:#111 center/cover no-repeat;overflow:hidden}
.plate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.plate video.on{opacity:1}
.cap{margin:10px 22px 0;font-size:12px;line-height:1.5;color:var(--ink3)}
.txt{position:relative;padding:18px 22px 48px}
.ch{font-family:var(--en);font-style:italic;font-size:20px;line-height:1;color:var(--ink)}
.ch span{font-family:var(--kr);font-style:normal;font-size:12px;font-weight:700;color:var(--ink3);margin-left:8px;vertical-align:2px}
.hd{margin:8px 0 12px;font-weight:800;font-size:26px;line-height:1.3;letter-spacing:-.04em;color:var(--ink)}
.bd{font-size:15.5px;line-height:1.7;letter-spacing:-.01em;color:var(--ink2)}
.bd p{margin:0 0 10px;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
.cur .bd p{opacity:1;transform:none}
.cur .bd p:nth-child(2){transition-delay:.15s}.cur .bd p:nth-child(3){transition-delay:.3s}.cur .bd p:nth-child(4){transition-delay:.45s}
.bd strong{font-weight:800;color:var(--ink)}
.hd,.pull,.nx h2,.t-cover .ttl p{text-wrap:balance}
.bd p{text-wrap:pretty}
.pull{margin-top:6px;font-weight:800;font-size:19px;line-height:1.45;letter-spacing:-.03em;color:var(--ink)}
.pull::before{content:"";display:block;width:22px;height:3px;margin-bottom:10px;background:var(--c)}

/* 표지 */
.t-cover .face{background:#000}
.t-cover .cv{position:absolute;inset:0;background:#000 center 30%/cover no-repeat}
.t-cover .cv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.88) 62%)}
.t-cover .lb{position:absolute;left:22px;right:22px;top:20px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;color:#fff}
.t-cover .lb span{font-size:12px;font-weight:800;letter-spacing:.12em}
.t-cover .lb i{font-family:var(--en);font-size:22px}
.t-cover .ttl{position:absolute;left:22px;right:22px;bottom:70px;z-index:5;color:#fff}
.t-cover .ttl h1{margin:0;font-weight:900;font-size:60px;line-height:1.02;letter-spacing:-.06em}
.t-cover .ttl p{margin:14px 0 0;font-size:16px;font-weight:500;line-height:1.5;color:rgba(255,255,255,.88)}
.t-cover .ft{position:absolute;left:22px;right:22px;bottom:24px;z-index:5;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
.t-cover .ft b{font-weight:800;color:#fff;background:#e5322d;padding:5px 9px}

/* 신 소개 */
.t-god .plate{height:54%}
.t-god .txt{padding-top:16px}
.nm{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nm b{font-weight:900;font-size:40px;line-height:1;letter-spacing:-.05em}
.nm i{font-family:var(--en);font-size:19px;color:var(--ink2)}
.spec{margin:10px 0 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.spec em{font-style:normal;color:var(--c)}
.t-god .bd{font-size:15px}

/* 여덟 글자 */
.g8{height:44%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f5f5f5}
.g8g{display:grid;grid-template-columns:repeat(4,56px);gap:6px}
.g8g i{height:64px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:30px;color:var(--gc);background:#fff;opacity:0;transform:translateY(8px)}
.cur .g8g i{animation:gin .5s var(--d) ease forwards}
@keyframes gin{to{opacity:1;transform:none}}
.g8g i.emp{color:#e5322d;background:transparent;box-shadow:inset 0 0 0 2px #e5322d;font-size:26px}
.g8l{font-size:13px;font-weight:700;color:var(--ink2)}
.g8l em{font-style:normal;color:#e5322d}
/* 다섯 · 셋 · 작은 신 */
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:44%;background:#fff}
.five div{background:#222 50% 16%/cover no-repeat}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:44%;background:#fff}
.trio div{background:#222 center 20%/cover no-repeat}
.minis{height:36%;display:flex;align-items:center;justify-content:center;gap:6px;background:#f5f5f5}
.minis i{width:17%;aspect-ratio:1;border-radius:50%;background:#fff 50% 14%/185% no-repeat;animation:bob 2.6s ease-in-out infinite}
.minis i:nth-child(2){animation-delay:.3s}.minis i:nth-child(3){animation-delay:.6s}.minis i:nth-child(4){animation-delay:.9s}.minis i:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
/* 사용법 */
.t-how .plate{height:28%}
.how{list-style:none;margin:0;padding:0}
.how li{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--rule)}
.how li i{font-family:var(--en);font-size:24px;line-height:1;color:var(--ink)}
.how li b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.how li span{display:block;margin-top:2px;font-size:13.5px;color:var(--ink3)}
.cta{display:flex;gap:6px;margin-top:14px}
.cta button{flex:1;height:48px;border:0;background:#111;color:#fff;font-size:14.5px;font-weight:800}
.cta button.gh{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #111}
/* 뒤표지 */
.t-next .face{background:#000}
.nx{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 64px}
.nx .ch{color:#fff}
.nx h2{margin:10px 0 12px;font-weight:900;font-size:32px;line-height:1.22;letter-spacing:-.05em}
.nx p{margin:0;font-size:15px;line-height:1.7;color:rgba(255,255,255,.85)}

/* 아래 막대 · 목차 */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(env(safe-area-inset-bottom,0px) + 54px);padding:0 14px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:12px;color:#fff;font-size:13px;font-weight:700}
.bar .nv{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.bar .nv:disabled{opacity:.3}
.bar .nv svg{width:17px;height:17px}
.prog{flex:1;height:3px;background:rgba(255,255,255,.18);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .6s}
.toc{position:absolute;inset:0;z-index:80;background:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px 30px;color:#111;overflow-y:auto}
.toc.on{display:flex}
.toc .x{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:36px;height:36px;border:0;border-radius:50%;background:#f2f2f2;font-size:18px}
.toc small{font-family:var(--en);font-style:italic;font-size:20px}
.toc h3{margin:6px 0 16px;font-weight:900;font-size:28px;letter-spacing:-.05em}
.toc button.it{display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--rule);background:none;color:#111;font-size:15.5px;font-weight:700;text-align:left}
.toc button.it span{color:var(--ink3);font-weight:500;font-size:13px}
.toc button.it.on{color:#e5322d}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top"><button class="ib" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b id="runT">팔자에 신이 들었다</b><button class="ib" id="tocB" aria-label="목차"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button></div>
  <div class="book" id="book"></div>
  <div class="bar"><button class="nv" id="prev" aria-label="이전 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="prog"><i id="prog"></i></div><span id="pgN">1 / 15</span><button class="nv" id="next" aria-label="다음 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div>
  <div class="toc" id="toc"><button class="x" type="button" aria-label="닫기">×</button><small>Contents</small><h3>팔자에 신이 들었다</h3><div id="tocL"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const EN=['Prologue','Chapter One','Chapter Two','Chapter Three','Chapter Four','Chapter Five','Chapter Six','Epilogue'];
const GOD=(k,n,h,el,dir,col,job,c,en,body,q)=>({t:'god',k,n,h,el,dir,col,job,c,en,body,q,img:`img/${k}.jpg`,dep:true,pos:'.5 .18',vid:`v/rv_${k}.mp4`,toc:`${n} · ${h}`});
const PAGES=[
  {t:'cover',img:'img/kv_house.jpg',pos:'.5 .3',toc:'표지'},
  {t:'text',en:0,ch:'프롤로그',hd:'지도에 없는 문',img:'img/intro0.jpg',dep:true,pos:'.5 .45',vid:'v/op_take.mp4',cap:'서울 어딘가, 골목 끝의 신당 문',body:[
    '서울 어딘가, 지도에 없는 골목 끝에 문이 하나 있다.',
    '아무에게나 보이지 않는다. 사주에 <strong>한 칸이 비어 있는 사람</strong>에게만 보인다.',
    '그리고 오늘 밤, 당신 눈에 그 문이 보였다.']},
  {t:'grid8',en:1,ch:'제1장',hd:'여덟 글자, 빈칸 하나',body:[
    '사람은 태어나는 순간 여덟 글자를 받는다. 글자마다 나무, 불, 흙, 쇠, 물 중 하나의 기운이 들어 있다.',
    '다섯 기운을 고르게 받는 사람은 거의 없다. 누구에게나 <strong>텅 빈 칸</strong>이 하나쯤 있다.',
    '옛사람들은 말했다. 운은 비어 있는 곳으로 샌다고.']},
  {t:'five',en:2,ch:'제2장',hd:'다섯 방위의 신들',cap:'왼쪽부터 하람, 이안, 도준, 시온, 재이',body:[
    '동쪽의 청룡, 남쪽의 주작, 가운데의 황룡, 서쪽의 백호, 북쪽의 현무. 옛사람들은 이들을 <strong>오방신</strong>이라 불렀다.',
    '사람들이 그 이름을 잊자, 신들은 사라지는 대신 사람의 얼굴을 하고 도시로 내려왔다.',
    '빈칸이 있는 사람을 찾아서.']},
  GOD('wood','하람','靑龍','木','동쪽','초록','새 시작과 다음 인연','#1f9d61','Blue Dragon',
    ['동쪽 문을 지키는 나무의 신. 봄보다 먼저 깨어나 새싹이 올라올 자리를 고른다.','말수는 적지만, 망설이는 발끝을 한 번은 꼭 밀어 준다.'],'늦게 피는 꽃도 봄은 봄이야'),
  GOD('fire','이안','朱雀','火','남쪽','빨강','고백과 결단','#e5322d','Vermilion Bird',
    ['남쪽 하늘을 나는 불의 신. 꺼져 가는 마음속 불씨를 귀신같이 알아챈다.','무심한 척하지만, 고백과 결단의 순간엔 누구보다 뜨겁다.'],'망설이면 불 꺼진다. 오늘은 네가 먼저 가'),
  GOD('earth','도준','黃龍','土','가운데','노랑','안정과 관계','#c98a12','Yellow Dragon',
    ['다섯 방위의 한가운데를 지키는 흙의 신. 흔들리는 것들을 붙잡아 제자리에 앉힌다.','무뚝뚝해도, 가장 오래 곁에 남는 쪽은 언제나 도준이다.'],'흔들려도 돼. 발밑은 내가 잡고 있을게'),
  GOD('metal','시온','白虎','金','서쪽','흰색','정리와 결단','#6b7280','White Tiger',
    ['서쪽 문을 지키는 쇠의 신. 끊어야 할 것과 남길 것을 한눈에 가른다.','말은 차갑지만, 그 칼끝은 언제나 사람을 살리는 쪽을 향한다.'],'안 맞는 건 끊어. 비워야 들어와'),
  GOD('water','재이','玄武','水','북쪽','남색','속마음과 지혜','#2b4c8c','Black Tortoise',
    ['북쪽 깊은 물을 지키는 물의 신. 사람이 말하지 못한 속마음이 흘러드는 곳에 산다.','조용히 듣고, 오래 기억하고, 필요할 때만 입을 연다.'],'말 안 해도 알아. 그래도 한 번은 말해 줘'),
  {t:'text',en:3,ch:'제3장',hd:'살롱의 주인',img:'img/seoha.jpg',dep:true,pos:'.5 .22',cap:'한남동 간판 없는 살롱의 주인, 서하',body:[
    '신은 사람에게 직접 말을 걸 수 없다. 그래서 문 안쪽에는 신의 말을 옮기는 사람이 있다. 살롱의 주인, <strong>서하</strong>.',
    '서하는 당신의 여덟 글자를 펼쳐 빈칸을 찾고, 그 자리에 앉을 신을 불러낸다.'],pull:'네 사주, 한 칸이 비어 있어. 그 빈자리, 신이 채워 줄게'},
  {t:'trio',en:4,ch:'제4장',hd:'문 너머의 방들',people:[['img/tarot/mujin.jpg','무진'],['img/taeo/base.jpg','태오'],['img/halmae.jpg','할매']],cap:'카드방의 무진, 도화를 보는 태오, 정통 사주의 할매',body:[
    '문 너머엔 불 켜진 방이 몇 개 더 있다.',
    '한밤의 카드방엔 타로를 읽는 <strong>무진</strong>, 펜트하우스엔 도화를 보는 <strong>태오</strong>, 오래된 한옥엔 정통 사주를 짚는 <strong>할매</strong>.',
    '어느 방부터 들를지는 당신 마음이다.']},
  {t:'mini',en:5,ch:'제5장',hd:'작아진 신들',cap:'낮의 모습. 손바닥만 해진 다섯 신',body:[
    '사람 곁에 오래 머무는 건 신에게도 힘든 일이다. 그래서 신들은 낮이 되면 손바닥만 하게 작아진다.',
    '작아진 신들은 점괘통을 흔들고, 부적 속에 살고, 하루씩 돌아가며 당번을 서서 도장을 찍어 준다.',
    '크게 보면 신이고, 작게 보면 친구다.']},
  {t:'text',en:6,ch:'제6장',hd:'뒷골목의 묘당',img:'img/cat/madam.jpg',pos:'.5 .2',vid:'v/cat/madam.mp4',cap:'묘당의 마담, 도화',body:[
    '신당 뒷골목, 촛불이 녹아내리는 작은 가게엔 고양이들이 산다. 신들의 심부름을 하다 그대로 눌러앉은 여섯 마리.',
    '고양이들은 큰 운명 대신 작은 점을 본다. 이번 달 연애, 간밤의 꿈, 그 사람의 속마음 같은 것.']},
  {t:'how',en:7,ch:'에필로그',hd:'빈칸을 채우는 법',img:'img/op_take_end.jpg',dep:true,pos:'.5 .55'},
  {t:'next',toc:'제2권 예고'}];
const N=PAGES.length;
function plate(p){ const bp=(p.pos||'.5 .3').split(' ').map(v=>v*100+'%').join(' '); return `<div class="plate" data-img="${p.img}" ${p.dep?`data-dep="1"`:''} data-pos="${p.pos||'.5 .3'}" style="background-image:url('${p.img}');background-position:${bp}">${p.vid?`<video muted loop playsinline preload="none" data-src="${p.vid}" style="object-position:${bp}"></video>`:''}</div>`; }
const para=b=>`<div class="bd">${b.map(t=>`<p>${t}</p>`).join('')}</div>`;
const chap=p=>`<div class="ch">${EN[p.en]}<span>${p.ch}</span></div><div class="hd">${p.hd}</div>`;
function front(p,i){
  const ft=`<div class="rhd"><span>${p.t==='god'?p.n+' · '+p.h:p.hd||''}</span><b>${String(i).padStart(2,'0')}</b></div>`;
  const cap=p.cap?`<div class="cap">${p.cap}</div>`:'';
  if(p.t==='cover') return `<div class="cv" style="background-image:url('${p.img}')"></div>
    <div class="lb"><span>OBANG SAJU ORIGINAL</span><i>Vol. 1</i></div>
    <div class="ttl"><h1>팔자에<br>신이<br>들었다</h1><p>빈칸 하나에, 신 다섯이 줄을 섰다</p></div>
    <div class="ft"><span>넘겨서 읽기 →</span><b>제1권 무료</b></div>`;
  if(p.t==='god') return `${plate(p)}<div class="txt"><div class="nm"><b>${p.n}</b><i>${p.en}</i></div><div class="spec"><em>${p.h} · ${p.el}</em> &nbsp;${p.dir} · ${p.col} · ${p.job}</div>${para(p.body)}<div class="pull">${p.q}</div></div>${ft}`;
  if(p.t==='grid8'){ const G=[['甲','#1f9d61'],['子','#2b4c8c'],['丙','#e5322d'],['午','#e5322d'],['庚','#6b7280'],['',''],['壬','#2b4c8c'],['申','#6b7280']];
    return `<div class="g8"><div class="g8g">${G.map(([c,col],j)=>c?`<i style="--gc:${col};--d:${j*.1}s">${c}</i>`:`<i class="emp" style="--d:${j*.1}s">?</i>`).join('')}</div><div class="g8l">木 · 火 · <em>土</em> · 金 · 水 &nbsp;흙(土)이 한 칸도 없다</div></div><div class="txt">${chap(p)}${para(p.body)}</div>${ft}`; }
  if(p.t==='five') return `<div class="five">${['wood','fire','earth','metal','water'].map(k=>`<div style="background-image:url('img/${k}.jpg')"></div>`).join('')}</div>${cap}<div class="txt">${chap(p)}${para(p.body)}</div>${ft}`;
  if(p.t==='trio') return `<div class="trio">${p.people.map(([u])=>`<div style="background-image:url('${u}')"></div>`).join('')}</div>${cap}<div class="txt">${chap(p)}${para(p.body)}</div>${ft}`;
  if(p.t==='mini') return `<div class="minis">${['wood','fire','earth','metal','water'].map(k=>`<i style="background-image:url('img/mini/${k}.jpg')"></i>`).join('')}</div>${cap}<div class="txt">${chap(p)}${para(p.body)}</div>${ft}`;
  if(p.t==='how') return `${plate(p)}<div class="txt">${chap(p)}<ul class="how">
    <li><i>1</i><div><b>문을 두드린다</b><span>생일을 알려 주면 내 빈칸이 보인다</span></div></li>
    <li><i>2</i><div><b>내 신을 만난다</b><span>빈칸을 채워 줄 수호신이 곁에 온다</span></div></li>
    <li><i>3</i><div><b>매일 조금씩 채운다</b><span>개운 미션, 당번 도장</span></div></li>
    <li><i>4</i><div><b>가끔은 가볍게 논다</b><span>오방 뽑기, 부적 카드, 묘당</span></div></li></ul>
    <div class="pull" style="--c:#e5322d">빈칸은 모자람이 아니라, 신이 앉을 자리다</div>
    <div class="cta"><button type="button" data-go="home">내 빈칸 찾으러 가기</button><button class="gh" type="button" data-go="restart">처음부터</button></div></div>`;
  if(p.t==='next') return `<div class="nx" style="background:linear-gradient(180deg,rgba(0,0,0,.1) 20%,rgba(0,0,0,.92) 62%),url('img/kv_house.jpg') center 85%/cover no-repeat"><div class="ch">Coming Next<span style="color:rgba(255,255,255,.7)">제2권</span></div><h2>오행 하우스<br>다섯 신, 빈 의자 하나</h2><p>빈칸을 채우러 온 신들이 한집에 모여 산다. 여섯 번째 의자는 아직 비어 있다. 그 주인은 당신의 여덟 글자가 알고 있다</p><div class="cta" style="margin-top:22px"><button type="button" data-go="home" style="background:#fff;color:#111">오방사주로 돌아가기</button></div></div>`;
  return `${plate(p)}${cap}<div class="txt">${chap(p)}${para(p.body)}${p.pull?`<div class="pull">${p.pull}</div>`:''}</div>${ft}`; }
/* 뒷면: 넘기는 동안 보이는 종이 뒷면(글자 비침만) */
const backFace='<div class="face back"></div>';
$('book').innerHTML=PAGES.map((p,i)=>`<div class="leaf t-${p.t} ${p.t==='cover'?'cover':''} ${p.t==='next'?'bk2':''}" data-i="${i}" style="z-index:${N-i}${p.c?`;--c:${p.c}`:''}"><div class="face front">${front(p,i)}</div>${backFace}<div class="shade"></div></div>`).join('');
const leaves=[...document.querySelectorAll('.leaf')];
$('tocL').innerHTML=PAGES.map((p,i)=>`<button class="it" type="button" data-i="${i}">${p.toc||`${p.ch} · ${p.hd}`}<span>${String(i).padStart(2,'0')}</span></button>`).join('');

/* 종이 넘기는 소리(합성) */
let AC=null; function rustle(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const d=.45, n=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate), a=n.getChannelData(0); for(let i=0;i<a.length;i++){ const t=i/a.length; a[i]=(Math.random()*2-1)*Math.pow(1-t,2.2)*(t<.08?t/.08:1)*(.6+.4*Math.sin(t*38)); }
  const s=AC.createBufferSource(); s.buffer=n; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.7; const g=AC.createGain(); g.gain.value=.16; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); }catch(e){} }

/* 현재 장: 영상 재생 · 그림 깊이 효과 켜기 */
let cur=0;
function activate(){ leaves.forEach((l,i)=>{ const on=i===cur; l.classList.toggle('cur',on);
    l.querySelectorAll('video').forEach(v=>{ if(on){ if(!v.getAttribute('src')) v.src=v.dataset.src; v.onplaying=()=>v.classList.add('on'); v.play().catch(()=>{}); } else { try{ v.pause(); }catch(e){} } });
    const pl=l.querySelector('.plate[data-dep]'); if(pl&&window.Depth3D){ if(on&&!pl._d3&&!pl.querySelector('video.on')){ const u=pl.dataset.img, d=u.replace(/\.jpg$/,'_d.jpg'); const im=new Image(); im.onload=()=>{ if(i===cur&&!pl._d3) Depth3D.mount(pl,{src:u,pos:pl.dataset.pos.split(' ').map(Number),str:.9}); }; im.src=d; } else if(!on&&pl._d3){ Depth3D.unmount(pl); } } });
  $('prev').disabled=cur===0; $('next').disabled=cur===N-1; $('pgN').textContent=`${cur+1} / ${N}`; $('prog').style.width=(cur/(N-1)*100)+'%';
  const p=PAGES[cur]; $('runT').textContent=p.t==='cover'?'팔자에 신이 들었다':(p.toc||`${p.ch} · ${p.hd}`);
  $('tocL').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
  try{ sessionStorage.setItem('obBookPg',cur); }catch(e){} }
function go(n,sound=true){ n=Math.max(0,Math.min(N-1,n)); if(n===cur) return; const fwd=n>cur;
  leaves.forEach((l,i)=>{ const t=i<n; if(l.classList.contains('turned')!==t){ l.classList.add('moving'); setTimeout(()=>l.classList.remove('moving'),900); } l.classList.toggle('turned',t); });
  cur=n; if(sound) rustle(); try{ navigator.vibrate&&navigator.vibrate(8); }catch(e){} activate(); }
$('next').onclick=()=>go(cur+1); $('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });

/* 손가락으로 끌어 넘기기 · 가장자리 탭 */
let drag=null;
$('book').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; const r=$('book').getBoundingClientRect(); drag={x:e.clientX,y:e.clientY,w:r.width,left:e.clientX-r.left<r.width*.35,moved:false,leaf:null,dir:0}; });
window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(!drag.moved&&Math.abs(dx)<8) return;
  if(!drag.moved){ drag.moved=true; drag.dir=dx<0?1:-1; drag.leaf=drag.dir>0?leaves[cur]:leaves[cur-1]; if(!drag.leaf||(drag.dir>0&&cur===N-1)){ drag.leaf=null; return; } drag.leaf.classList.add('drag','moving'); }
  if(!drag.leaf) return; const k=Math.max(0,Math.min(1,drag.dir>0?-dx/drag.w:1-dx/drag.w)); drag.k=k; drag.leaf.style.transform=`rotateY(${-178*k}deg)`; });
window.addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null;
  if(d.leaf){ d.leaf.classList.remove('drag'); d.leaf.style.transform=''; setTimeout(()=>d.leaf.classList.remove('moving'),900);
    if(d.dir>0) { if(d.k>.28) go(cur+1); } else { if(d.k<.72) go(cur-1); } return; }
  if(!d.moved){ if(e.target.closest('button')) return; if(d.left) go(cur-1); else go(cur+1); } });

/* 버튼 */
$('book').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; if(b.dataset.go==='restart'){ go(0); return; } try{ sessionStorage.setItem('toHome','1'); }catch(_){} location.href='./'; });
$('tocB').onclick=()=>$('toc').classList.toggle('on');
$('toc').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b) go(+b.dataset.i); if(b||e.target.closest('.x')) $('toc').classList.remove('on'); };
$('back').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} if(history.length>1) history.back(); else location.href='./'; };
/* 읽던 곳부터 */
(()=>{ let s=0; try{ s=+(sessionStorage.getItem('obBookPg')||0); }catch(e){} if(s>0&&s<N){ cur=0; go(s,false); } else activate(); })();
</script>
<script src="depth3d.js"></script>
<script>if(window.Depth3D&&Depth3D.enableGyro) try{ Depth3D.enableGyro(); }catch(e){}</script>
</body>
</html>
