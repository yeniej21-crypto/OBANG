<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>먹물 그림 비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Song+Myung&display=swap">
<style>body{margin:0;background:#0b0a0d;color:#f3ece3;font-family:'Noto Sans KR',sans-serif}h1{font-family:'Song Myung',serif;font-weight:400;font-size:26px;margin:24px 16px 4px}p.l{margin:0 16px 14px;font-size:14px;color:#a9a19a}.r{display:flex;gap:6px;overflow-x:auto;padding:0 16px 24px;scroll-snap-type:x mandatory}figure{margin:0;flex:none;width:78vw;max-width:360px;scroll-snap-align:start}figure img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#1a171c}figcaption{font-size:15px;margin-top:8px;color:#e3b866}.z{position:fixed;inset:0;background:#000;display:none;z-index:9}.z.on{display:block}.z img{width:100%;height:100%;object-fit:contain}</style></head><body>
<h1>먹물 · 타로 진행자</h1><p class="l">옆으로 넘겨 보고, 누르면 크게 보여요. 번호로 골라 주세요.</p><div class="r"><figure><img src="img/cat/water.jpg" alt=""><figcaption>지금(윙크 그림)</figcaption></figure><figure><img src="https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_065847_c2edcfff-d919-40ca-ac6a-73080c4b4e8d_min.webp" alt=""><figcaption>1 · 3D 애니 · 카드 누르는 앞발</figcaption></figure><figure><img src="https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_065847_2432f9de-d55e-419f-a1f3-cd2701678425_min.webp" alt=""><figcaption>2 · 지금 그림체 고급화 · 떠 있는 카드</figcaption></figure><figure><img src="https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_065847_63b5fd71-dfe5-4c31-8c17-4fd69386abaf_min.webp" alt=""><figcaption>3 · 3D 애니 · 바짝 다가온 얼굴</figcaption></figure></div>
<div class="z" id="z"><img id="zi" alt=""></div>
<script>document.addEventListener('click',e=>{const i=e.target.closest('figure img');const z=document.getElementById('z');if(i){document.getElementById('zi').src=i.src;z.classList.add('on');}else if(e.target.closest('#z'))z.classList.remove('on');});</script></body></html>
