/* 이안의 강변 정자 인트로(미리보기). 계절마다 그림 · 영상 한 벌씩: 지금은 가을 · 겨울, 봄 · 여름 · 비는 같은 틀에 추가 */
:root{--gold:#e8c48a;--ink:#f6ecdf;--ink2:rgba(246,236,223,.66);--bg:#050407}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.st{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.ly{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.ly.on{opacity:1}
.ly img,.ly video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.ly.still img{transform:scale(1.04);transition:transform 9s ease-out}
.ly.still.on img{transform:scale(1)}
.grad{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,4,7,.62) 0%,rgba(5,4,7,0) 24%,rgba(5,4,7,0) 56%,rgba(5,4,7,.88) 100%)}
.hd{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 54px);text-align:center;transition:opacity .9s}
.hd small{display:block;font-size:13px;letter-spacing:.32em;color:var(--gold);text-shadow:0 1px 10px rgba(0,0,0,.8)}
.hd h1{margin:14px 0 0;font-family:'OBrush','Song Myung',serif;font-weight:400;font-size:48px;letter-spacing:.04em;line-height:1.1;text-shadow:0 4px 26px rgba(0,0,0,.85)}
.cue{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .7s}
.cue button{width:76px;height:76px;border-radius:50%;border:1px solid rgba(232,196,138,.85);background:rgba(10,8,12,.38);display:grid;place-items:center;color:var(--gold);cursor:pointer;padding:0;animation:pulse 2.4s ease-in-out infinite}
.cue p{margin:0;font-family:'Song Myung',serif;font-size:21px;letter-spacing:.06em;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.dots{display:flex;gap:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(232,196,138,.22);transition:all .5s}
.dots i.on{background:var(--gold);box-shadow:0 0 12px rgba(232,196,138,.9)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,196,138,.3)}50%{box-shadow:0 0 0 14px rgba(232,196,138,0)}}
.sub{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);text-align:center;font-family:'Song Myung',serif;font-size:24px;line-height:1.5;text-shadow:0 2px 16px rgba(0,0,0,.95),0 0 2px #000;opacity:0;transition:opacity .45s}
.sub.on{opacity:1}
.end{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .8s}
.end.on{opacity:1;pointer-events:auto}
.end a,.end button{display:block;width:100%;padding:16px;border:0;font:700 16px/1 'Noto Sans KR',sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.end a{background:var(--gold);color:#1a130b}
.end button{background:rgba(10,8,12,.5);color:var(--ink2);border:1px solid rgba(246,236,223,.18)}
.pv{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;border:1px solid rgba(246,236,223,.22);background:rgba(5,4,7,.45);z-index:5}
.pv button{border:0;background:none;color:var(--ink2);font:500 13px/1 'Noto Sans KR',sans-serif;padding:9px 12px;cursor:pointer}
.pv button.on{color:#1a130b;background:var(--gold);font-weight:700}
.pvNote{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:12px;color:var(--ink2);z-index:5}
.hide{opacity:0!important;pointer-events:none!important}
@media (prefers-reduced-motion:reduce){.cue button{animation:none}.ly.still img{transition:none}}
</style>
</head>
<body>
<div class="st" id="st">
  <div class="ly still on" id="lyStill"><img id="still" alt=""></div>
  <div class="ly" id="lyLamp"><video id="vLamp" muted playsinline preload="auto"></video></div>
  <div class="ly" id="lyDoor"><video id="vDoor" muted playsinline preload="auto"></video></div>
  <div class="ly" id="lyIan"><video id="vIan" playsinline preload="auto" src="v/ian/t1.mp4" poster="img/ian.jpg"></video></div>
  <div class="grad"></div>
  <div class="pvNote">미리보기</div>
  <div class="pv" id="pv"><button data-s="autumn" type="button">가을</button><button data-s="winter" type="button">겨울</button></div>
  <div class="hd" id="hd"><small>서울 어느 옥상</small><h1>이름 없는 정자</h1></div>
  <div class="cue" id="cue">
    <button id="lampBtn" type="button" aria-label="등불 켜기"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M12 3v2"/><path d="M7 7h10l-1.2 10H8.2z"/><path d="M6 19h12"/><path d="M12 10.2c1.3 1.2 1.5 2.4.9 3.4-.4.6-1.4.7-1.9.1-.6-.7-.3-1.7 1-3.5z"/></svg></button>
    <p id="cueT">등불을 켜 줘</p>
    <div class="dots" id="dots"><i></i><i></i><i></i></div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="end" id="end"><a href="ian-salon.html">이안의 살롱으로 들어가기</a><button id="again" type="button">처음부터 다시</button></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
/* 계절별 한 벌: still = 등불 꺼진 첫 장면, lamp = 등불이 차례로 켜지는 영상, door = 문이 열리는 영상 */
const SEASONS={
  autumn:{still:'https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_060122_613c9030-5127-436c-8eb1-3b930b4d2a41_min.webp',lamp:'https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/7c4fdac8-cafa-44ce-b772-9d421bd6ee34.mp4',door:'https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/d0be8b20-7a4c-4994-8b88-41639c995064.mp4'},
  winter:{still:'https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_060121_aaeb0c97-67fd-4256-9dfa-8f18e6064a62_min.webp',lamp:'https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/6e07e638-e48c-4836-8c5f-e13e33ce06f3.mp4',door:'https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/22918022-ab68-4f7f-8ffc-6e204eec3129.mp4'}
};
const CUE=['등불을 켜 줘','하나 더','마지막 하나'];
const LINES=[[0,'왔네.'],[1.4,'기다리고 있었어.'],[3.0,'이리 와서 앉아.']];
function pick(){ const q=new URLSearchParams(location.search).get('s'); if(q&&SEASONS[q]) return q; const m=new Date().getMonth()+1; return (m===12||m<=2)?'winter':'autumn'; }
let season=pick(), step=0, busy=false;
/* 밤바람 · 먼 도시 소리 · 불 붙는 소리(합성) */
let ctx=null, amb=null;
function au(){ if(ctx) return ctx; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC();
  const n=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate), d=n.getChannelData(0); let l=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; l=(l+0.02*w)/1.02; d[i]=l*3.2; }
  const s=ctx.createBufferSource(); s.buffer=n; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520; amb=ctx.createGain(); amb.gain.value=0; s.connect(f); f.connect(amb); amb.connect(ctx.destination); s.start();
  amb.gain.linearRampToValueAtTime(.16,ctx.currentTime+2.5); return ctx; }
function flame(k){ const c=au(); if(!c) return; if(c.state!=='running') c.resume(); const t=c.currentTime+.02;
  const nb=c.createBuffer(1,c.sampleRate*.5,c.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,2);
  const ns=c.createBufferSource(); ns.buffer=nb; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700+k*120; bp.Q.value=.8; const g=c.createGain(); g.gain.value=.28; ns.connect(bp); bp.connect(g); g.connect(c.destination); ns.start(t);
  const o=c.createOscillator(), og=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(70,t+.5); og.gain.setValueAtTime(.0001,t); og.gain.exponentialRampToValueAtTime(.22,t+.03); og.gain.exponentialRampToValueAtTime(.0001,t+.6); o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+.7);
  /* 맑은 풍경 소리 한 번 */
  [[1568,.05,2.4],[2093,.03,1.8],[3136,.015,1.2]].forEach(([f,a,dd])=>{ const x=c.createOscillator(), xg=c.createGain(); x.type='sine'; x.frequency.value=f*(1+k*0.06); xg.gain.setValueAtTime(.0001,t+.18); xg.gain.exponentialRampToValueAtTime(a,t+.2); xg.gain.exponentialRampToValueAtTime(.0001,t+.2+dd); x.connect(xg); xg.connect(c.destination); x.start(t+.18); x.stop(t+.3+dd); }); }
function load(){ const S=SEASONS[season]; $('still').src=S.still; $('vLamp').src=S.lamp; $('vDoor').src=S.door; try{ $('vLamp').load(); $('vDoor').load(); }catch(e){}
  [...$('pv').children].forEach(b=>b.classList.toggle('on',b.dataset.s===season)); }
function reset(){ step=0; busy=false; ['lyLamp','lyDoor','lyIan'].forEach(id=>$(id).classList.remove('on')); $('lyStill').classList.add('on');
  ['vLamp','vDoor','vIan'].forEach(id=>{ const v=$(id); try{ v.pause(); v.currentTime=0; }catch(e){} });
  $('hd').classList.remove('hide'); $('cue').classList.remove('hide'); $('end').classList.remove('on'); $('sub').classList.remove('on');
  [...$('dots').children].forEach(i=>i.classList.remove('on')); $('cueT').textContent=CUE[0]; }
function playTo(v,t){ return new Promise(r=>{ const p=v.play(); if(p&&p.catch) p.catch(()=>r()); const f=()=>{ if(v.ended||v.currentTime>=t-0.03){ if(!v.ended) v.pause(); return r(); } requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
