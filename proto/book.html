<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="early.js?v=6"></script>
<title>팔자에 신이 들었다 · 오방도감</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 세계관 책 v7 (10/3 밤): 검은 몰입형이 기본 + 깔끔한 쪽 몇 장. 영상은 쪽 전체 또는 검은 무대 위 액자로, 들어오자마자 말한다.
   스크롤 없음(글은 한 화면에 맞춰 자동으로 글자 크기 조정). 넘기기는 화면 어디서든 좌우로 쓸거나 양 끝을 톡 */
:root{--kr:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--serif:'Noto Serif KR',serif;--brush:'OBrush','Noto Sans KR',serif;--red:#c8372d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#050405;color:#fff;font-family:var(--kr);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
button *{pointer-events:none}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:radial-gradient(90% 60% at 50% 45%,#1c1714,#050405 70%)}
@media (min-width:700px){.stage{height:min(100%,940px);margin:auto 0}}
.top{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.ib{position:relative;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;flex:none}
.ib svg{width:18px;height:18px}
.ib.mu.off::after{content:"";position:absolute;width:20px;height:2px;background:#fff;transform:rotate(-45deg)}
.top b{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 60px);touch-action:none}
.book{width:100%;height:100%}
.book .stf__block{filter:drop-shadow(0 26px 40px rgba(0,0,0,.6))}
.leaf{background:#0a0809;overflow:hidden}
.face{position:absolute;inset:0;overflow:hidden;background:#0a0809;color:#fff}
.face::after{content:"";position:absolute;left:0;top:0;bottom:0;width:20px;pointer-events:none;z-index:50;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(env(safe-area-inset-bottom,0px) + 58px);padding:0 14px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:12px;color:#fff;font-size:13px;font-weight:700}
.bar .nv{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.bar .nv:disabled{opacity:.3}
.bar .nv svg{width:18px;height:18px}
.prog{flex:1;height:3px;background:rgba(255,255,255,.18);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .6s}
.toc{position:absolute;inset:0;z-index:80;background:#0d0b0c;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px 30px;color:#fff;overflow-y:auto}
.toc.on{display:flex}
.toc .x{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px}
.toc small{font-size:13px;font-weight:900;color:#e8b04a}
.toc h3{margin:6px 0 16px;font-family:var(--brush);font-weight:400;font-size:32px}
.toc button.it{display:flex;justify-content:space-between;gap:12px;width:100%;padding:13px 0;border:0;border-top:1px solid rgba(255,255,255,.1);background:none;color:#fff;font-size:15px;font-weight:700;text-align:left}
.toc button.it span{color:rgba(255,255,255,.4);font-weight:500;font-size:13px}
.toc button.it.on{color:#e8b04a}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);z-index:70;background:rgba(255,255,255,.96);color:#111;font-size:13px;font-weight:700;padding:9px 14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:65;display:flex;justify-content:center;align-items:center;gap:8px;color:#fff;font-size:12.5px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .5s}
.hint.on{opacity:1}
.hint i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);position:relative;animation:sw 1.6s ease-in-out infinite}
.hint i::after{content:"";position:absolute;left:9px;top:9px;width:8px;height:8px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
@keyframes sw{0%{transform:translateX(10px);opacity:.2}50%{opacity:1}100%{transform:translateX(-14px);opacity:.2}}

/* 공통 글(어두운 쪽 기준) */
.ch{font-size:12.5px;font-weight:900;color:var(--c2,var(--c,#e8b04a));letter-spacing:.04em}
.hd{margin:6px 0 10px;font-family:var(--brush);font-weight:400;font-size:32px;line-height:1.2;text-wrap:balance}
.nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.nm b{font-family:var(--brush);font-weight:400;font-size:48px;line-height:1}
.nm span{font-size:13.5px;font-weight:800;color:var(--c2,var(--c))}
.spec{margin:8px 0 10px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.55)}
.bd{font-size:15px;line-height:1.75;color:rgba(255,255,255,.86);letter-spacing:-.012em}
.bd p{margin:0 0 10px}
.bd b{font-weight:900;color:#fff}
.q{margin:12px 0 0;font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.5;color:#fff;text-wrap:balance}
.q::before{content:"";display:inline-block;width:18px;height:3px;background:var(--c);vertical-align:middle;margin-right:9px}
.fo{position:absolute;left:22px;right:22px;bottom:12px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.4);z-index:6;pointer-events:none}
.fo b{color:#fff;font-weight:900}
.lite .fo{color:#8a8178}.lite .fo b{color:#222}
/* 한 화면에 안 들어가면 글자를 한두 단계 줄인다 */
.tight .bd{font-size:14px;line-height:1.66}.tight .bd p{margin-bottom:8px}.tight .nm b{font-size:42px}.tight .hd{font-size:28px}.tight .q{font-size:15.5px}
.tight2 .bd{font-size:13.2px;line-height:1.6}.tight2 .nm b{font-size:38px}.tight2 .spec{display:none}
.rv{opacity:0;transform:translateY(12px);transition:opacity .7s var(--d,.3s),transform .7s var(--d,.3s)}
.cur .rv{opacity:1;transform:none}
.again{position:absolute;right:12px;top:12px;z-index:9;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:16px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.again i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sub{position:absolute;left:18px;right:18px;z-index:5;text-align:center;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.45;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8);opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s;pointer-events:none}
.sub.on{opacity:1;transform:none}

/* 1. 표지 */
.cv-bg{position:absolute;inset:-10px;background:#000 center 40%/cover no-repeat;filter:brightness(.55);transform:scale(1.06);animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translateY(-10px)}}
.cv-vg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,.88) 85%)}
.cv-t{position:absolute;left:24px;right:24px;top:52px}
.cv-t small{display:block;font-size:12px;font-weight:900;letter-spacing:.16em;color:#e8b04a}
.cv-t h1{margin:12px 0 0;font-family:var(--brush);font-weight:400;font-size:clamp(62px,19vw,86px);line-height:1.02}
.cv-t h1 span{display:block}
.cv-f{position:absolute;left:24px;right:24px;bottom:28px}
.cv-f p{margin:0 0 6px;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.5}
.cv-f em{display:block;font-style:normal;font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
.cv-five{display:flex;gap:6px;margin-top:14px}
.cv-five i{width:34px;height:34px;border-radius:50%;background:#333 center 16%/cover;box-shadow:0 0 0 2px var(--c)}
.cv-f div.r{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.8)}
.cv-f b{background:var(--red);color:#fff;font-weight:900;padding:6px 10px}

/* 2. 영상 한 장 가득(프롤로그 · 인물 · 그림자 손님) */
.flm{position:absolute;inset:0;background:#000 center 20%/cover no-repeat}
.flm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.flm video.on{opacity:1}
.flg{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6) 32%,rgba(0,0,0,.95));pointer-events:none}
.flt{position:absolute;left:22px;right:22px;bottom:34px;max-height:56%;overflow:hidden}
.t-film .flt .hd,.t-vfull .flt .hd{font-size:36px}
.t-vfull .sub,.t-voice .sub{top:36%}

/* 3. 검은 무대 위 영상 액자 + 겹쳐 놓인 큰 이름 */
.t-vstage .face{background:radial-gradient(90% 55% at 50% 30%,color-mix(in srgb,var(--c) 24%,#0b0a0c),#070608 72%)}
.vs{position:absolute;left:0;right:0;top:0;bottom:30px;display:flex;flex-direction:column;padding:26px 24px 0}
.vs-fr{position:relative;flex:none;height:48%;aspect-ratio:4/5;align-self:center;overflow:hidden;background:#000 center 18%/cover no-repeat;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 70%,#fff),0 0 0 6px rgba(0,0,0,.6),0 0 0 7px color-mix(in srgb,var(--c) 40%,transparent),0 0 70px -6px color-mix(in srgb,var(--c) 55%,transparent);opacity:0;transform:scale(.94);transition:opacity .9s .1s,transform 1.1s cubic-bezier(.2,.9,.25,1) .1s}
.cur .vs-fr{opacity:1;transform:none}
.vs-fr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.vs-fr video.on{opacity:1}
.vs-fr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.75));pointer-events:none}
.vs-fr .sub{bottom:14px;font-size:16.5px}
.vs-fr .again{top:8px;right:8px}
.vs-nm{position:relative;z-index:3;margin-top:-30px;padding-left:4px}
.vs-nm .nm b{font-size:56px;text-shadow:0 6px 24px rgba(0,0,0,.85)}
.vs-tx{flex:1;min-height:0;overflow:hidden;margin-top:4px}
.tight .vs-nm .nm b{font-size:48px}

/* 4. 이야기 쪽(어두운 종이 · 명조 · 첫 글자 크게) */
.t-prose .face{background:radial-gradient(90% 60% at 50% 100%,color-mix(in srgb,var(--c) 18%,transparent),rgba(0,0,0,0) 70%),#0f0c0e}
.ps{position:absolute;left:26px;right:26px;top:30px;bottom:38px;overflow:hidden}
.ps .bd{font-family:var(--serif);font-size:15.5px;line-height:1.92;color:rgba(243,236,226,.88)}
.ps .bd p:first-child::first-letter{float:left;font-family:var(--brush);font-size:52px;line-height:.9;margin:6px 10px 0 0;color:var(--c)}
.ps .hd{color:#f3ece2}
.orn{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.orn i{width:7px;height:7px;border-radius:50%}
.tight .ps .bd{font-size:14.5px;line-height:1.8}.tight2 .ps .bd{font-size:13.6px;line-height:1.7}

/* 5. 큰 글자 쪽 */
.tyb{position:absolute;inset:-20px;background:#000 center/cover no-repeat;filter:blur(14px) brightness(.32) saturate(1.2)}
.tyw{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:40px 28px 60px}
.tyl{margin:14px 0 0;font-family:var(--brush);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:1.12}
.tyl span{display:block;opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px);transition:opacity 1.1s var(--d),transform 1.1s var(--d),filter 1.1s var(--d)}
.tyl span em{font-style:normal;color:var(--c)}
.cur .tyl span{opacity:1;transform:none;filter:none}
.tys{margin:22px 0 0;font-size:15px;line-height:1.75;color:rgba(255,255,255,.78);opacity:0;transition:opacity 1s 1.6s}
.tys b{color:#fff}
.cur .tys{opacity:1}
.tyd{display:flex;gap:10px;margin-top:22px}
.tyd i{width:16px;height:16px;border-radius:50%;opacity:0;transform:scale(.2);transition:opacity .5s var(--d),transform .6s cubic-bezier(.2,1.6,.4,1) var(--d)}
.cur .tyd i{opacity:1;transform:none}

/* 6. 다섯 기둥 */
.stp{position:absolute;left:0;right:0;top:0;height:58%;display:flex;gap:3px}
.stp div{flex:1;position:relative;background:#000 center 16%/cover no-repeat;clip-path:inset(100% 0 0 0);transition:clip-path 1s cubic-bezier(.2,.9,.25,1) var(--d)}
.cur .stp div{clip-path:inset(0 0 0 0)}
.stp div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.85))}
.stp div span{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;line-height:1.2}
.stp div span b{display:block;font-family:var(--brush);font-weight:400;font-size:20px}
.stp div span small{display:block;font-size:10px;font-weight:800;color:var(--c)}
.stp div i{position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);z-index:1}
.lw{position:absolute;left:22px;right:22px;bottom:34px;overflow:hidden}
.t-strips .lw{top:calc(58% + 20px)}
/* 7. 둘로 나뉜 쪽 */
.spw{position:absolute;left:0;right:0;top:0;height:56%}
.spw div{position:absolute;top:0;bottom:0;background:#000 center 16%/cover no-repeat;transition:clip-path 1.1s cubic-bezier(.2,.9,.25,1) .2s}
.spw .a{left:0;width:62%;clip-path:polygon(0 0,0 0,0 100%,0 100%)}
.spw .b{right:0;width:62%;clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}
.cur .spw .a{clip-path:polygon(0 0,100% 0,62% 100%,0 100%)}
.cur .spw .b{clip-path:polygon(38% 0,100% 0,100% 100%,0 100%)}
.spw::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(10,8,9,0),#0a0809);pointer-events:none}
.spw span{position:absolute;bottom:14px;z-index:2;font-family:var(--brush);font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.spw span small{display:block;font-family:var(--kr);font-size:10.5px;font-weight:800;color:var(--c2,#e8b04a)}
.spw .la{left:16px}.spw .lb{right:16px;text-align:right}
.t-split .lw{top:calc(56% + 18px)}

/* 8. 두 얼굴(깔끔한 쪽) */
.t-pairs .face{background:#f6f0e4;color:#111}
.prw{position:absolute;left:16px;right:16px;top:26px;bottom:34px;display:flex;flex-direction:column}
.prw .ch{color:#c8372d}.prw .hd{color:#111}
.prw .lead{margin:0 0 10px;font-size:14px;line-height:1.6;color:#6a6158}
.prl{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.pr{display:grid;grid-template-columns:56px 1fr 34px 1fr 56px;align-items:center;gap:6px}
.pr>i{width:56px;height:56px;border-radius:50%;background:#ddd center 16%/cover no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c),0 10px 16px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .6s var(--d),transform .8s cubic-bezier(.2,1.2,.3,1) var(--d)}
.pr>i:first-child{transform:translateX(-30px)}.pr>i:last-child{transform:translateX(30px)}
.cur .pr>i{opacity:1;transform:none}
.pr div b{display:block;font-size:15px;font-weight:900;color:#111}
.pr div small{display:block;margin-top:1px;font-size:11.5px;color:#7a6f62}
.pr .r{text-align:right}
.pr em{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:15px;opacity:0;transform:scale(.3);transition:opacity .4s calc(var(--d) + .25s),transform .6s cubic-bezier(.2,1.6,.4,1) calc(var(--d) + .25s)}
.cur .pr em{opacity:1;transform:none}

/* 9. 명인의 방(어두운 쪽, 카드를 누르면 그 명인이 말한다) */
.t-gal .face{background:radial-gradient(80% 50% at 50% 30%,#2a2016,#0a0809 70%)}
.gal{position:absolute;left:16px;right:16px;top:18px;height:54%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;perspective:900px}
.gal>button{position:relative;overflow:hidden;border:0;padding:0;background:#111 center 16%/cover no-repeat;transform-origin:50% 100%;transform:rotateX(78deg);opacity:0;box-shadow:0 0 0 1px rgba(224,178,90,.35),0 14px 20px -12px rgba(0,0,0,.8);transition:transform 1s cubic-bezier(.22,1.1,.3,1) var(--d),opacity .5s var(--d);text-align:left;color:#fff}
.cur .gal>button{transform:none;opacity:1}
.gal>button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.88))}
.gal>button span{position:absolute;left:10px;right:8px;bottom:8px;z-index:2}
.gal>button b{display:block;font-family:var(--brush);font-weight:400;font-size:24px;line-height:1.05}
.gal>button small{display:block;margin-top:3px;font-size:11px;line-height:1.35;color:rgba(255,255,255,.8)}
.gal>button em{position:absolute;right:8px;top:8px;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.gal>button em::after{content:"";position:absolute;left:10px;top:8px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.gal>button video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;z-index:1}
.gal>button video.on{opacity:1}
.t-gal .lw{top:calc(54% + 34px)}

/* 10. 그림자 손님 */
.shw{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 45% at 22% 78%,rgba(168,40,58,.32),rgba(0,0,0,0) 70%),radial-gradient(60% 45% at 80% 70%,rgba(59,90,154,.34),rgba(0,0,0,0) 70%),radial-gradient(70% 40% at 50% 100%,rgba(106,74,168,.4),rgba(0,0,0,0) 70%),#07060a}
.shw .tt{position:absolute;left:24px;right:24px;top:40px;z-index:6}
.shw .tt .ch{color:#e06a7a}
.shw .tt .tyl{font-size:clamp(42px,12.5vw,58px)}
.shw .tt p{margin:12px 0 0;font-size:14.5px;line-height:1.7;color:rgba(255,255,255,.75);opacity:0;transition:opacity 1s 1.4s}
.cur .shw .tt p{opacity:1}

  {t:'prose',ch:'제1장 · 이어서',hd:'새는 운',c:'#ff5a46',toc:'제1장 · 새는 운',body:[

  {t:'vfull',ch:'오방의 신 · 동쪽',n:'하람',h:'靑龍 · 木',c:EL.wood,c2:'#8fe0b5',toc:'하람 · 靑龍',poster:'img/wood.jpg',v:'v/ms/wood.mp4?v=2',

  {t:'vfull',ch:'오방의 신 · 가운데',n:'도준',h:'黃龍 · 土',c:EL.earth,c2:'#f0cf8a',toc:'도준 · 黃龍',poster:'img/earth.jpg?v=2',v:'v/rv_earth.mp4?v=2',

  {t:'how',ch:'에필로그',hd:'빈칸을 채우는 법',lite:1,toc:'에필로그 · 빈칸을 채우는 법'},

const N=PAGES.length;
const P2=n=>String(n).padStart(2,'0');
const bdy=(b,d=.45)=>`<div class="bd">${b.map((t,j)=>`<p class="rv" style="--d:${(d+j*.12).toFixed(2)}s">${t}</p>`).join('')}</div>`;
const head=p=>`<div class="ch rv" style="--d:.15s">${p.ch}</div>${p.hd?`<div class="hd rv" style="--d:.25s">${p.hd}</div>`:''}`;
const who=p=>p.n?`<div class="ch rv" style="--d:.15s">${p.ch}</div><div class="nm rv" style="--d:.25s"><b>${p.n}</b><span>${p.h}</span></div>`:head(p);
const fo=(p,i)=>`<div class="fo"><span>${p.n||p.hd||''}</span><b>${P2(i)}</b></div>`;
const typeLines=(ls,d0=.35)=>`<h2 class="tyl">${ls.map((t,j)=>`<span style="--d:${(d0+j*.45).toFixed(2)}s">${t}</span>`).join('')}</h2>`;
const DOTS=`<div class="orn rv" style="--d:1s">${Object.values(EL).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
const again=`<button class="again" type="button" data-again="1"><i></i>다시 듣기</button>`;
function front(p,i){
  switch(p.t){
  case 'cover': return `<div class="cv-bg" style="background-image:url('img/intro0.jpg')"></div><div class="cv-vg"></div>
    <div class="cv-t"><small>OBANG SAJU ORIGINAL · VOL. 1</small><h1><span>팔자에</span><span>신이</span><span>들었다</span></h1></div>
    <div class="cv-f"><p>빈칸 하나에, 신 다섯이 줄을 섰다</p><em>신 열 명과 그림자 손님 셋, 그리고 당신의 빈칸 이야기</em>
    <div class="cv-five">${['wood','fire','earth','metal','water'].map(k=>`<i style="--c:${EL[k]};background-image:url('img/thumb/${k}.jpg${k==='earth'||k==='water'?'?v=2':''}')"></i>`).join('')}</div>
    <div class="r"><span></span><b>무료</b></div></div>`;
  case 'film': return `<div class="flm" style="background-image:url('${p.bg}')"><video class="mv" playsinline muted preload="auto" data-src="${p.v}"></video></div><div class="flg"></div><div class="flt fit">${head(p)}${bdy(p.body,.6)}</div>`;
  case 'vfull': return `<div class="flm" style="background-image:url('${p.poster}')">${p.loop?`<video class="lv" playsinline muted loop preload="none" data-src="${p.loop}"></video>`:''}<video class="mv" playsinline preload="auto" data-src="${p.v}"></video></div>
    ${p.sub&&p.voice?`<div class="sub">${p.sub}</div>`:''}${again}<div class="flg"></div><div class="flt fit">${p.sub&&!p.voice?`<div class="sub said">${p.sub}</div>`:''}${who(p)}${bdy(p.body,.6)}</div>`;
  case 'vstage': return `<div class="vs fit"><div class="vs-fr" style="background-image:url('${p.poster}')">${p.loop?`<video class="lv" playsinline muted loop preload="none" data-src="${p.loop}"></video>`:''}<video class="mv" playsinline preload="auto" data-src="${p.v}"></video>${p.sub?`<div class="sub">${p.sub}</div>`:''}${again}</div>
    <div class="vs-nm"><div class="ch rv" style="--d:.5s">${p.ch}</div><div class="nm rv" style="--d:.6s"><b>${p.n}</b><span>${p.h}</span></div></div><div class="vs-tx">${bdy(p.body,.8)}</div></div>${fo(p,i)}`;
  case 'prose': return `<div class="ps fit">${head(p)}${bdy(p.body,.35)}${DOTS}</div>${fo(p,i)}`;
  case 'type': return `${p.bg?`<div class="tyb" style="background-image:url('${p.bg}')"></div>`:''}<div class="tyw"><div class="ch">${p.ch}</div>${typeLines(p.lines)}${p.dots?`<div class="tyd">${Object.values(EL).map((c,j)=>`<i style="background:${c};--d:${(1.3+j*.12).toFixed(2)}s"></i>`).join('')}</div>`:''}<p class="tys">${p.sub}</p></div>${fo({hd:p.toc.split(' · ').pop()},i)}`;
  case 'strips': return `<div class="stp">${p.cols.map(([k,n,s,img],j)=>`<div style="--c:${EL[k]};--d:${(.15+j*.14).toFixed(2)}s;background-image:url('${img}')"><i></i><span><b>${n}</b><small>${s}</small></span></div>`).join('')}</div><div class="lw fit">${head(p)}${bdy(p.body,.9)}</div>${fo(p,i)}`;
  case 'split': return `<div class="spw" style="--c2:${p.c2||'#e8b04a'}"><div class="a" style="background-image:url('${p.a[0]}')"></div><div class="b" style="background-image:url('${p.b[0]}')"></div><span class="la">${p.a[1]}<small>${p.a[2]}</small></span><span class="lb">${p.b[1]}<small>${p.b[2]}</small></span></div><div class="lw fit">${head(p)}${bdy(p.body,.6)}</div>${fo(p,i)}`;
  case 'pairs': return `<div class="prw">${head(p)}<p class="lead rv" style="--d:.3s">${p.lead}</p><div class="prl">${p.rows.map(([k,a,as,b,bs,e,ia,ib],j)=>`<div class="pr" style="--c:${EL[k]};--d:${(.35+j*.16).toFixed(2)}s"><i style="background-image:url('${ia}')"></i><div><b>${a}</b><small>${as}</small></div><em>${e}</em><div class="r"><b>${b}</b><small>${bs}</small></div><i style="background-image:url('${ib}')"></i></div>`).join('')}</div></div>${fo(p,i)}`;
  case 'gal': return `<div class="gal">${p.cards.map(([n,r,img,v],j)=>`<button type="button" data-gal="${j}" style="background-image:url('${img}');--d:${(.3+j*.15).toFixed(2)}s"><video playsinline preload="none" data-src="${v}"></video><em></em><span><b>${n}</b><small>${r}</small></span></button>`).join('')}</div><div class="lw fit">${head(p)}${bdy(p.body,.9)}</div>${fo(p,i)}`;
  case 'shade': return `<div class="shw"><div class="tt"><div class="ch">${p.ch}</div>${typeLines(p.lines,.25)}<p>${p.sub}</p></div>
    <div class="shp g" style="--d:.9s"><img src="${CUT.geum}" alt=""></div><div class="shp h" style="--d:.6s"><img src="${CUT.heuk}" alt=""></div><div class="shp s" style="--d:1.25s"><img src="${CUT.sam}" alt=""></div><div class="fog"></div></div>${fo({hd:'그림자 손님'},i)}`;
  case 'grid8': { const G=[['甲','#3fbf7f'],['丙','#ff5a46'],['庚','#c9d1db'],['壬','#5b8cff'],['子','#5b8cff'],['午','#ff5a46'],['',''],['申','#c9d1db']];
    return `<div class="g8w"><div class="ch" style="color:#ff5a46">${p.ch}</div><div class="g8h">여덟 글자,<br><em>빈칸</em> 하나</div>
      <div class="g8t">${['시','일','월','년'].map(t=>`<small>${t}</small>`).join('')}${G.map(([c,col],j)=>c?`<i style="--gc:${col};--d:${.45+j*.1}s">${c}</i>`:`<i class="emp" style="--d:${.45+j*.1}s"></i>`).join('')}</div>
      <div class="g8b fit">${bdy(p.body,1.2)}<div class="q rv" style="--d:1.6s;--c:#ff5a46">그 틈으로, 신이 들어온다</div></div></div>${fo({hd:'여덟 글자, 빈칸 하나'},i)}`; }
  case 'mini': return `<div class="mini">${['wood','fire','earth','metal','water'].map((k,j)=>`<i style="background-image:url('img/mini/${k}.jpg');--d:${.25+j*.12}s"></i>`).join('')}</div><div class="lw fit">${head(p)}${bdy(p.body)}</div>${fo(p,i)}`;
  case 'how': return `<div class="hw">${head(p)}<ul class="how">
    <li><em>1</em><span><b>문을 두드린다</b>생일을 알려 주면 내 빈칸이 보인다</span></li>
    <li><em>2</em><span><b>내 신을 만난다</b>빈칸을 채워 줄 수호신, 두 얼굴 가운데 하나를 고른다</span></li>
    <li><em>3</em><span><b>매일 조금씩 채운다</b>개운 미션, 당번 도장, 오늘 밤 손님 귀띔</span></li>
    <li><em>4</em><span><b>그림자 손님도 미리 안다</b>흑매 · 그믐 · 삼재, 전부 무료</span></li></ul>
    <div class="cta"><button type="button" data-go="home">내 빈칸 찾으러 가기</button><button class="gh" type="button" data-go="restart">처음부터</button></div></div>`;
  case 'next': return `<div class="nxbg" style="background-image:url('img/kv_house.jpg')"></div><div class="nx"><small>제2권 · 곧 열림</small><h2>오행 하우스<br>다섯 신, 빈 의자 하나</h2><p>빈칸을 채우러 온 신들이 한집에 모여 산다. 여섯 번째 의자는 아직 비어 있다. 그 주인은 당신의 여덟 글자가 알고 있다</p><div class="cta" style="margin-top:22px"><button type="button" data-go="home" style="background:#fff;color:#111">오방도감으로 돌아가기</button></div></div>`;
  } return ''; }

$('book').innerHTML=PAGES.map((p,i)=>`<div class="leaf t-${p.t}${p.lite?' lite':''}" data-i="${i}" data-density="soft"><div class="face" style="${p.c?`--c:${p.c};`:''}${p.c2?`--c2:${p.c2}`:''}">${front(p,i)}</div></div>`).join('');
const leaves=[...document.querySelectorAll('#book .leaf')];
$('tocL').innerHTML=PAGES.map((p,i)=>`<button class="it" type="button" data-i="${i}">${p.toc||p.hd||p.n}<span>${P2(i)}</span></button>`).join('');

/* 글이 한 화면을 넘치면 글자를 한두 단계 줄인다(스크롤 없음) */
function fit(){ leaves.forEach(l=>{ const f=l.querySelector('.face'); f.classList.remove('tight','tight2'); const box=f.querySelector('.fit'); if(!box) return;
  const tgt=box.classList.contains('vs')?box.querySelector('.vs-tx'):box; const over=()=>tgt.scrollHeight>tgt.clientHeight+2;
  if(over()){ f.classList.add('tight'); if(over()) f.classList.add('tight2'); } }); }

/* ---------- 소리 ---------- */
let AC=null; const ac=()=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } };
function swoosh(){ const A=ac(); if(!A) return; const d=.6, n=A.createBuffer(1,A.sampleRate*d,A.sampleRate), a=n.getChannelData(0);
  for(let i=0;i<a.length;i++){ const t=i/a.length; a[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.15)),1.6)*(.55+.45*Math.sin(t*46)); }
  const s=A.createBufferSource(); s.buffer=n; const f=A.createBiquadFilter(); f.type='bandpass'; f.Q.value=.9; const t0=A.currentTime;
  f.frequency.setValueAtTime(700,t0); f.frequency.exponentialRampToValueAtTime(3600,t0+d*.55); f.frequency.exponentialRampToValueAtTime(1400,t0+d);
  const g=A.createGain(); g.gain.value=.22; s.connect(f); f.connect(g); g.connect(A.destination); s.start(); }
const BG_LV=.12, BG_DUCK=.02; let bgG=null, bgOn=true, bgLv=BG_LV;
try{ bgOn=localStorage.getItem('obBookBgm')!=='0'; }catch(e){}
function bgSet(lv,sec=.8){ bgLv=lv; if(!bgG) return; const g=bgG.gain,t=AC.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(bgOn?lv:0,t+sec); }
function bgStart(){ const A=ac(); if(!A||bgG) return; bgG=A.createGain(); bgG.gain.value=0; bgG.connect(A.destination);
  fetch('a/book_bgm.mp3').then(r=>r.arrayBuffer()).then(b=>A.decodeAudioData(b)).then(buf=>{ const s=A.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(bgG); s.start(); bgSet(bgLv,2); }).catch(()=>{}); }
document.addEventListener('pointerdown',bgStart,{once:true,capture:true});
function muUi(){ $('muB').classList.toggle('off',!bgOn); }
$('muB').onclick=e=>{ e.stopPropagation(); bgStart(); bgOn=!bgOn; try{ localStorage.setItem('obBookBgm',bgOn?'1':'0'); }catch(_){} muUi(); bgSet(bgLv,.4); toast(bgOn?'배경음악 켜짐':'배경음악 꺼짐'); };
muUi();
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1800); }
const sndOff=()=>{ try{ return sessionStorage.getItem('obSnd')==='0'; }catch(e){ return false; } };

/* ---------- 영상: 쪽이 펼쳐지면 바로 말한다. 끝나면 반복 영상(있으면) ---------- */
const src=v=>{ if(v&&!v.getAttribute('src')) v.src=v.dataset.src; return v; };
function stopAll(l){ l.querySelectorAll('video').forEach(v=>{ try{ v.pause(); }catch(e){} v.classList.remove('on'); }); l.querySelectorAll('.sub').forEach(x=>x.classList.remove('on')); }
function playV(v,{sound=false,loop=false,onend=null}={}){ if(!v) return; src(v); v.loop=loop; v.muted=!sound||sndOff(); try{ v.currentTime=0; }catch(e){}
  v.onplaying=()=>{ v.classList.add('on'); if(!v.muted) bgSet(BG_DUCK,.4); }; v.onended=()=>{ if(!v.muted) bgSet(BG_LV,1.2); onend&&onend(); };
  const p=v.play(); if(p&&p.catch) p.catch(()=>{ if(!v.muted){ v.muted=true; v.play().catch(()=>onend&&onend()); toast('다시 듣기를 누르면 목소리가 들려요'); } else onend&&onend(); }); }
function talk(l,i,force){ const v=l.querySelector('video.mv'), lv=l.querySelector('video.lv'), sb=l.querySelector('.sub'); if(!v) return;
  if(force){ try{ sessionStorage.removeItem('obSnd'); }catch(_){} }
  if(lv){ try{ lv.pause(); }catch(_){} lv.classList.remove('on'); }
  playV(v,{sound:true,onend:()=>{ if(cur!==i) return; if(lv){ v.classList.remove('on'); playV(lv,{loop:true}); } }});
  if(sb){ sb.classList.remove('on'); setTimeout(()=>{ if(cur===i) sb.classList.add('on'); },700); } }
let cur=0, pf=null;
function activate(i){ const l=leaves[i], P=PAGES[i]; if(!l) return; cur=i;
  leaves.forEach((x,j)=>{ if(j!==i){ x.classList.remove('cur'); stopAll(x); } }); l.classList.add('cur'); bgSet(BG_LV);
  if(P.t==='film') setTimeout(()=>{ if(cur===i) playV(l.querySelector('video.mv')); },300);
  if(P.t==='vfull'||P.t==='vstage') talk(l,i);
  if(i>0) $('hint').classList.remove('on');
  $('prev').disabled=i===0; $('next').disabled=i===N-1; $('pgN').textContent=`${i+1} / ${N}`; $('prog').style.width=(i/(N-1)*100)+'%';
  $('runT').textContent=i===0?'팔자에 신이 들었다':(P.toc||P.hd||P.n);
  $('tocL').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i)); try{ sessionStorage.setItem('obBookPg7',i); }catch(e){}
  [i+1,i+2].forEach(j=>{ const nx=leaves[j]; if(nx) nx.querySelectorAll('video.mv').forEach(v=>{ src(v); v.preload='auto'; }); }); }

/* 아이폰은 손가락 동작 안에서 한 번 재생한 영상만 나중에 소리 내어 틀 수 있다 → 손짓마다 앞뒤 쪽 목소리 영상을 미리 깨운다 */
function prime(){ [cur-1,cur+1,cur+2].forEach(j=>{ const l=leaves[j]; if(!l) return; l.querySelectorAll('video.mv').forEach(v=>{ if(v._pr||PAGES[j].t==='film') return; v._pr=1; src(v); try{ v.muted=false; const p=v.play(); v.pause(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }); }); }

/* ---------- 넘기기: 화면 어디서든 좌우로 쓸기, 양 끝 톡, 아래 버튼. 종이가 말리며 넘어가는 그림은 page-flip ---------- */
const next=()=>{ if(pf&&cur<N-1&&pf.getState()==='read') pf.flipNext('bottom'); };
const prev=()=>{ if(pf&&cur>0&&pf.getState()==='read') pf.flipPrev('bottom'); };
function initBook(){ const d=$('desk').getBoundingClientRect(); let start=0; try{ start=+(sessionStorage.getItem('obBookPg7')||0); }catch(e){} if(!(start>=0&&start<N)) start=0;
  try{ const m=location.hash.match(/p=(\d+)/); if(m) start=Math.min(N-1,+m[1]); }catch(e){}
  pf=new St.PageFlip($('book'),{width:Math.round(d.width),height:Math.round(d.height),size:'stretch',minWidth:260,maxWidth:560,minHeight:420,maxHeight:1200,
    usePortrait:true,showCover:false,autoSize:true,drawShadow:true,maxShadowOpacity:.6,flippingTime:800,useMouseEvents:false,startPage:start,startZIndex:2});
  pf.on('flip',e=>activate(e.data));
  pf.on('changeState',e=>{ if(e.data==='flipping'){ swoosh(); $('hint').classList.remove('on'); } });
  pf.on('init',e=>{ fit(); activate(e.data.page||start); });
  pf.loadFromHTML(leaves);
  if(start===0){ setTimeout(()=>{ if(cur===0) $('hint').classList.add('on'); },1200); setTimeout(()=>$('hint').classList.remove('on'),8000); }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
}
(()=>{ const desk=$('desk'); let s=null;
  desk.addEventListener('pointerdown',e=>{ s={x:e.clientX,y:e.clientY,t:performance.now(),btn:!!e.target.closest('button')}; },{passive:true});
  desk.addEventListener('pointercancel',()=>{ s=null; });
  desk.addEventListener('pointerup',e=>{ if(!s) return; const dx=e.clientX-s.x, dy=e.clientY-s.y, dt=performance.now()-s.t, wasBtn=s.btn; s=null;
    if(Math.abs(dx)>34&&Math.abs(dx)>Math.abs(dy)*1.1&&dt<900){ prime(); dx<0?next():prev(); return; }
    if(wasBtn||Math.abs(dx)>10||Math.abs(dy)>10) return;
    const r=desk.getBoundingClientRect(), fx=(e.clientX-r.left)/r.width; if(fx>.78){ prime(); next(); } else if(fx<.22){ prime(); prev(); } });
})();
$('next').onclick=()=>{ prime(); next(); }; $('prev').onclick=()=>{ prime(); prev(); };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); });
$('tocB').onclick=()=>$('toc').classList.add('on');
$('toc').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b&&pf){ const n=+b.dataset.i; pf.turnToPage(n); activate(n); } if(b||e.target.closest('.x')) $('toc').classList.remove('on'); };
$('back').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} if(history.length>1) history.back(); else location.href='./'; };
$('book').addEventListener('click',e=>{ const l=e.target.closest('.leaf'); if(!l) return; const i=+l.dataset.i;
  if(e.target.closest('[data-again]')){ talk(l,i,true); return; }
  const g=e.target.closest('[data-gal]'); if(g){ l.querySelectorAll('.gal video').forEach(x=>{ x.pause(); x.classList.remove('on'); }); try{ sessionStorage.removeItem('obSnd'); }catch(_){} const v=g.querySelector('video'); playV(v,{sound:true,onend:()=>v.classList.remove('on')}); return; }
  const b=e.target.closest('[data-go]'); if(b){ if(b.dataset.go==='restart'){ pf.turnToPage(0); activate(0); return; } try{ sessionStorage.setItem('toHome','1'); }catch(_){} location.href='./'; } });
addEventListener('resize',()=>{ clearTimeout(fit._t); fit._t=setTimeout(fit,200); });
requestAnimationFrame(()=>requestAnimationFrame(initBook));

</script>
<script src="hanja.js"></script><script src="pcshell.js" defer></script>
