<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="early.js?v=6"></script>
<title>팔자에 신이 들었다 · 오방도감</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 세계관 책 v6 (10/3 밤): 진짜 책처럼 넘기는 종이(page-flip, 모서리가 말리며 넘어감) + 쪽마다 다른 틀 + 긴 글은 스크롤 */
:root{--kr:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--serif:'Noto Serif KR',serif;--brush:'OBrush','Noto Sans KR',serif;--ink:#111;--ink2:#2b2b2b;--ink3:#6a6158;--red:#c8372d;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#0a0908;color:var(--ink);font-family:var(--kr);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
button *{pointer-events:none}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:radial-gradient(90% 60% at 50% 45%,#2b231c,#0a0908 70%)}
@media (min-width:700px){.stage{height:min(100%,940px);margin:auto 0}}
.top{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;flex:none}
.ib svg{width:18px;height:18px}
.ib.mu.off::after{content:"";position:absolute;width:20px;height:2px;background:#fff;transform:rotate(-45deg)}
.ib.mu{position:relative}
.top b{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 60px);display:flex;align-items:center;justify-content:center}
.book{width:100%;height:100%}
.book .stf__block{filter:drop-shadow(0 26px 40px rgba(0,0,0,.55))}
.leaf{background:#fff;overflow:hidden}
.face{position:absolute;inset:0;overflow:hidden;background:#fff}
/* 종이 안쪽 접힌 자리(제본 쪽) 그늘: 진짜 책처럼 */
.face::after{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;pointer-events:none;z-index:50;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(env(safe-area-inset-bottom,0px) + 58px);padding:0 14px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:12px;color:#fff;font-size:13px;font-weight:700}
.bar .nv{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.bar .nv:disabled{opacity:.3}
.bar .nv svg{width:18px;height:18px}
.prog{flex:1;height:3px;background:rgba(255,255,255,.18);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .6s}
.toc{position:absolute;inset:0;z-index:80;background:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px 30px;color:#111;overflow-y:auto}
.toc.on{display:flex}
.toc .x{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:38px;height:38px;border:0;border-radius:50%;background:#f1f1f1;font-size:20px}
.toc small{font-size:13px;font-weight:900;color:var(--red)}
.toc h3{margin:6px 0 16px;font-family:var(--brush);font-weight:400;font-size:32px}
.toc button.it{display:flex;justify-content:space-between;gap:12px;width:100%;padding:13px 0;border:0;border-top:1px solid #eee;background:none;color:#111;font-size:15px;font-weight:700;text-align:left}
.toc button.it span{color:#888;font-weight:500;font-size:13px}
.toc button.it.on{color:var(--red)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);z-index:70;background:rgba(255,255,255,.96);color:#111;font-size:13px;font-weight:700;padding:9px 14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hint{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:65;display:flex;align-items:center;gap:8px;color:#fff;font-size:12.5px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .5s}
.hint.on{opacity:1}
.hint i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);position:relative;animation:sw 1.6s ease-in-out infinite}
.hint i::after{content:"";position:absolute;left:9px;top:10px;width:9px;height:9px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
@keyframes sw{0%{transform:translateX(10px);opacity:.2}50%{opacity:1}100%{transform:translateX(-14px);opacity:.2}}

/* 공통 글 */
.ch{font-size:12.5px;font-weight:900;color:var(--c,#c8372d);letter-spacing:.03em}
.hd{margin:6px 0 10px;font-family:var(--brush);font-weight:400;font-size:31px;line-height:1.2;color:var(--ink);text-wrap:balance}
.bd{font-size:15.5px;line-height:1.82;color:var(--ink2);letter-spacing:-.012em}
.bd p{margin:0 0 12px}
.bd b{font-weight:900;color:var(--ink)}
.q{margin:14px 0 4px;font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.5;color:var(--ink);text-wrap:balance}
.q::before{content:"";display:inline-block;width:18px;height:3px;background:var(--c);vertical-align:middle;margin-right:9px}
.nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm b{font-family:var(--brush);font-weight:400;font-size:44px;line-height:1}
.nm span{font-size:14px;font-weight:800;color:var(--c)}
.spec{margin:8px 0 12px;font-size:13px;font-weight:600;color:var(--ink3)}
.fo{position:absolute;left:22px;right:22px;bottom:12px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:#8a8178;z-index:6;pointer-events:none}
.fo b{color:#222;font-weight:900}
.dk .fo{color:rgba(255,255,255,.45)}.dk .fo b{color:#fff}
/* 스크롤되는 글 영역 + 아래로 더 있음 표시 */
.scr{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.more{position:absolute;left:50%;bottom:34px;z-index:7;transform:translateX(-50%);height:24px;padding:0 10px;border-radius:12px;background:rgba(20,16,14,.78);font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;gap:5px;pointer-events:none;opacity:0;transition:opacity .4s}
.more.on{opacity:1}
.more::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px}
/* 들어올 때 글이 차례로 */
.rv{opacity:0;transform:translateY(12px);transition:opacity .7s var(--d,.3s),transform .7s var(--d,.3s)}
.cur .rv{opacity:1;transform:none}
.tapv{position:absolute;z-index:8;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:16px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tapv i{width:8px;height:8px;border-radius:50%;background:var(--c)}
video.vv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s;z-index:3}
video.vv.on{opacity:1}

/* 1. 표지 */
.t-cover .face{background:#000}
.cv-bg{position:absolute;inset:-10px;background:#000 center 40%/cover no-repeat;filter:brightness(.55);transform:scale(1.06);animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translateY(-10px)}}
.cv-vg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,.85) 85%)}
.cv-t{position:absolute;left:24px;right:24px;top:56px;color:#fff}
.cv-t small{display:block;font-size:12px;font-weight:900;letter-spacing:.16em;color:#e8b04a}
.cv-t h1{margin:12px 0 0;font-family:var(--brush);font-weight:400;font-size:clamp(62px,19vw,86px);line-height:1.02}
.cv-t h1 span{display:block}
.cv-f{position:absolute;left:24px;right:24px;bottom:30px;color:#fff}
.cv-f p{margin:0 0 6px;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.5}
.cv-f em{display:block;font-style:normal;font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
.cv-f div{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.8)}
.cv-f b{background:var(--red);color:#fff;font-weight:900;padding:6px 10px}
.cv-five{display:flex;gap:6px;margin-top:14px}
.cv-five i{width:34px;height:34px;border-radius:50%;background:#333 center 16%/cover;box-shadow:0 0 0 2px var(--c)}

/* 2. 영상이 한 장 가득(프롤로그 · 영상 먼저 쪽 · 그림자 손님 목소리) */
.t-film .face,.t-reveal .face,.t-voice .face{background:#000}
.flm{position:absolute;inset:0;background:#000 center 22%/cover no-repeat}
.flm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.flm video.on{opacity:1}
.flg{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62) 34%,rgba(0,0,0,.94));pointer-events:none}
.flt{position:absolute;left:22px;right:22px;bottom:36px;max-height:56%;color:#fff}
.flt .ch{color:var(--c2,#e8b04a)}
.flt .hd{color:#fff;font-size:36px}
.flt .bd{color:rgba(255,255,255,.88);font-size:15px}
.flt .bd b{color:#fff}
/* 영상 먼저: 영상이 끝나면 글 판이 아래에서 올라온다 */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;z-index:6;display:flex;flex-direction:column;padding:22px 22px 40px;background:linear-gradient(180deg,rgba(12,10,14,.82),rgba(12,10,14,.97) 30%);color:#fff;transform:translateY(102%);transition:transform .9s cubic-bezier(.2,.9,.25,1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.up{transform:none}
.sheet .grip{position:absolute;left:50%;top:8px;width:36px;height:3px;margin-left:-18px;background:rgba(255,255,255,.3);border-radius:2px}
.sheet .nm b{color:#fff}
.sheet .spec{color:rgba(255,255,255,.6)}
.sheet .bd{color:rgba(255,255,255,.86)}
.sheet .bd b{color:#fff}
.sheet .q{color:#fff}
.sheet .scr{flex:1;min-height:0}
.rvname{position:absolute;left:22px;top:54px;z-index:5;color:#fff;opacity:0;transform:translateY(10px);transition:opacity .8s .6s,transform .8s .6s}
.cur .rvname{opacity:1;transform:none}
.rvname small{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--c2,#e8b04a);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.rvname b{display:block;margin-top:4px;font-family:var(--brush);font-weight:400;font-size:54px;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.sheet.up~.rvname{opacity:0;transition-delay:0s}
.skip{right:14px;top:54px}
.vsub{position:absolute;left:20px;right:20px;top:40%;z-index:4;text-align:center;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.45;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}
.vsub.on{opacity:1;transform:none}

/* 3. 전면 그림 + 아래 글 */
.t-full .face{background:#0d0b0a}
.fl-im{position:absolute;inset:0;background:#000 center 18%/cover no-repeat;transform:scale(1.04);transition:transform 9s ease-out}
.cur .fl-im{transform:scale(1.12)}
.fl-g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 30%,rgba(10,8,8,.72) 55%,rgba(10,8,8,.96) 78%)}
.fl-t{position:absolute;left:22px;right:22px;bottom:34px;top:46%;color:#fff;display:flex;flex-direction:column}
.fl-t .ch{color:var(--c2,var(--c))}
.fl-t .nm b,.fl-t .hd{color:#fff}
.fl-t .spec{color:rgba(255,255,255,.6)}
.fl-t .bd{color:rgba(255,255,255,.86)}
.fl-t .bd b{color:#fff}
.fl-t .q{color:#fff}
.fl-t .scr{flex:1;min-height:0}
.t-full .tapv{right:14px;top:14px}

/* 4. 그림 액자 + 글(종이) */
.fr-box{position:absolute;left:18px;right:18px;top:18px;height:46%;overflow:hidden;background:#111;box-shadow:0 16px 26px -14px rgba(0,0,0,.55),0 0 0 6px #fff,0 0 0 7px rgba(0,0,0,.12)}
.fr-box .im{position:absolute;inset:-6px;background:#000 center 16%/cover no-repeat;transform:translate(calc(var(--tx,0)*-6px),calc(var(--ty,0)*-4px))}
.fr-box .tapv{right:10px;bottom:10px}
.fr-t{position:absolute;left:22px;right:22px;top:calc(46% + 40px);bottom:34px;display:flex;flex-direction:column}
.fr-t .scr{flex:1;min-height:0}
.t-frame .face{background:#fbf8f2}

/* 5. 잡지형: 세로로 선 큰 이름 + 키 큰 그림 */
.t-mag .face{background:color-mix(in srgb,var(--c) 10%,#f7f2ea)}
.mg-im{position:absolute;right:0;top:0;width:68%;height:60%;background:#000 center 16%/cover no-repeat;clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.2,.9,.25,1) .15s}
.cur .mg-im{clip-path:inset(0 0 0 0)}
.mg-nm{position:absolute;left:14px;top:20px;height:58%;writing-mode:vertical-rl;font-family:var(--brush);font-size:min(25vw,108px);line-height:1;color:var(--c);opacity:0;transform:translateY(-20px);transition:opacity 1s .4s,transform 1s .4s}
.cur .mg-nm{opacity:1;transform:none}
.mg-hj{position:absolute;left:18px;bottom:calc(40% + 14px);font-size:13px;font-weight:900;letter-spacing:.2em;color:var(--ink3)}
.mg-t{position:absolute;left:22px;right:22px;top:calc(60% + 18px);bottom:34px;display:flex;flex-direction:column}
.mg-t .scr{flex:1;min-height:0}
.t-mag .tapv{right:12px;top:calc(60% - 46px)}

/* 6. 카드형: 기울이면 카드가 따라 움직이고 빛이 흐른다 */
.t-card .face{background:radial-gradient(90% 60% at 50% 22%,color-mix(in srgb,var(--c) 26%,#fff),#f3eee6 70%)}
.cdl{position:absolute;left:22px;right:22px;top:22px;bottom:34px;display:flex;flex-direction:column}
.cd-w{position:relative;flex:none;width:64%;aspect-ratio:3/4;margin:4px auto 22px;perspective:900px}
.cd{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--tx,0)*12deg)) rotateX(calc(var(--ty,0)*-10deg));opacity:0;translate:0 26px;transition:opacity .8s .2s,translate 1s cubic-bezier(.2,1.2,.3,1) .2s}
.cur .cd{opacity:1;translate:0 0}
.cd .im{position:absolute;inset:0;background:#000 center 14%/cover no-repeat;box-shadow:0 0 0 7px #fff,0 0 0 8px rgba(0,0,0,.08),0 30px 40px -18px rgba(0,0,0,.55)}
.cd .gl{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 48%,rgba(255,255,255,0) 62%);background-size:220% 100%;background-position:calc(50% + var(--tx,0)*40%) 0;mix-blend-mode:screen}
.cd .lb{position:absolute;left:-7px;bottom:-7px;right:-7px;height:42px;z-index:4;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--brush);font-size:22px;color:#111}
.cd .lb small{font-family:var(--kr);font-size:11px;font-weight:900;color:var(--c);letter-spacing:.1em}
.cd video.vv{z-index:2}
.cd-w .tapv{left:50%;transform:translateX(-50%);bottom:48px;z-index:5}
.cdl .scr{flex:1;min-height:0}
/* 7. 이야기 쪽(종이 · 명조 · 첫 글자 크게 · 스크롤) */
.t-prose .face{background:#fbf6ec}
.t-prose .face::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),repeating-linear-gradient(0deg,rgba(120,90,50,.03) 0 1px,transparent 1px 3px)}
.t-prose.dark .face{background:#100d12}
.t-prose.dark .face::before{background:radial-gradient(90% 60% at 50% 100%,rgba(120,40,60,.22),rgba(0,0,0,0) 70%)}
.ps{position:absolute;left:0;right:0;top:0;bottom:30px;padding:30px 26px 30px}
.ps .bd{font-family:var(--serif);font-size:16px;line-height:1.95;color:#2a241c}
.ps .bd p:first-child::first-letter{float:left;font-family:var(--brush);font-size:54px;line-height:.9;margin:6px 10px 0 0;color:var(--c)}
.dark .ps .hd{color:#f3ece2}.dark .ps .bd{color:rgba(243,236,226,.86)}.dark .ps .bd b{color:#fff}
.orn{display:flex;gap:7px;justify-content:center;margin:16px 0 8px}
.orn i{width:7px;height:7px;border-radius:50%}
.ps .por{float:right;width:38%;aspect-ratio:3/4;margin:4px 0 10px 14px;background:#ccc center 16%/cover no-repeat;box-shadow:0 0 0 5px #fff,0 0 0 6px rgba(120,90,50,.2),0 14px 20px -10px rgba(0,0,0,.4);transform:rotate(2deg)}
.ps .por.l{float:left;margin:4px 14px 10px 0;transform:rotate(-2deg)}

/* 8. 큰 글자 쪽 */
.t-type .face{background:#0b0908}
.tyb{position:absolute;inset:-20px;background:#000 center/cover no-repeat;filter:blur(14px) brightness(.32) saturate(1.2)}
.tyw{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:40px 28px 60px;color:#fff}
.tyl{margin:14px 0 0;font-family:var(--brush);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:1.12}
.tyl span{display:block;opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px);transition:opacity 1.1s var(--d),transform 1.1s var(--d),filter 1.1s var(--d)}
.tyl span em{font-style:normal;color:var(--c)}
.cur .tyl span{opacity:1;transform:none;filter:none}
.tys{margin:22px 0 0;font-size:15px;line-height:1.75;color:rgba(255,255,255,.78);opacity:0;transition:opacity 1s 1.6s}
.tys b{color:#fff}
.cur .tys{opacity:1}
.tyd{display:flex;gap:10px;margin-top:22px}
.tyd i{width:16px;height:16px;border-radius:50%;opacity:0;transform:scale(.2);transition:opacity .5s var(--d),transform .6s cubic-bezier(.2,1.6,.4,1) var(--d)}
.cur .tyd i{opacity:1;transform:none}

/* 9. 다섯 기둥(제3장): 다섯 신이 기둥처럼 하나씩 차오른다 */
.t-strips .face{background:#0e0c0b}
.stp{position:absolute;left:0;right:0;top:0;height:58%;display:flex;gap:3px}
.stp div{flex:1;position:relative;background:#000 center 16%/cover no-repeat;clip-path:inset(100% 0 0 0);transition:clip-path 1s cubic-bezier(.2,.9,.25,1) var(--d)}
.cur .stp div{clip-path:inset(0 0 0 0)}
.stp div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.85))}
.stp div span{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;color:#fff;line-height:1.2}
.stp div span b{display:block;font-family:var(--brush);font-weight:400;font-size:20px}
.stp div span small{display:block;font-size:10px;font-weight:800;color:var(--c)}

  {t:'prose',ch:'제3장 · 이어서',hd:'도시로 내려온 신들',c:'#1f9d61',por:'img/kv_drama.jpg',toc:'제3장 · 도시로 내려온 신들',body:[
    '도시는 신을 믿지 않는다. 대신 사람을 믿는다. 무대 위에서 이름이 불리고 수만 개의 불빛이 한 사람을 향해 흔들릴 때, 거기엔 오래된 제단과 같은 열기가 있다.',
    '신들은 그것을 알아차렸다. 누군가 이름을 불러 주는 한, 사라지지 않는다는 것. 그래서 다섯 신은 저마다 어울리는 자리를 골랐다. 누구는 한강이 내려다보이는 펜트하우스에, 누구는 은행잎 지는 골목 끝 편지 가게에, 누구는 네온이 꺼지지 않는 밤거리에.',
    '낮에는 사람처럼 일하고, 밤에는 사람들의 여덟 글자를 읽는다. 그리고 같은 물음을 품고 거리를 걷는다. 이 도시에서 내 기운이 비어 있는 사람은 누구인가.',
    '이제부터 한 명씩 소개한다. 그중 하나는, 이미 당신 곁에 와 있을지도 모른다.']},

  {t:'reveal',ch:'오방의 신 · 동쪽',n:'하람',h:'靑龍 · 木',c:EL.wood,c2:'#8fe0b5',toc:'하람 · 靑龍',poster:'img/wood.jpg',v:'v/rv_wood.mp4?v=2',voice:0,tap:'v/ms/wood.mp4?v=2',
    spec:'초록 · 새 시작과 다음 인연',body:[
    '동쪽 문을 지키는 나무의 신. 봄보다 먼저 깨어나 새싹이 올라올 자리를 고른다. 지금은 은행잎 지는 골목 끝, 아직 부치지 못한 편지를 맡아 두는 가게 <b>연서당</b>의 주인이다.',
    '말수는 적고 웃음은 수줍다. 손님이 오면 먼저 차를 내고, 한참을 기다렸다가 짧게 묻는다. 그 편지, 누구에게 쓰려던 거예요.',
    '새로 시작하려는 사람, 다음 인연을 기다리는 사람이 그의 손님이다. 망설이는 발끝 앞에서 그는 꼭 한 번 등을 밀어 준다.'],q:'늦게 피는 꽃도 봄은 봄이야'},

  {t:'mag',ch:'오방의 신 · 남쪽',n:'이안',h:'朱雀 · 火',c:EL.fire,toc:'이안 · 朱雀',img:'img/fire.jpg',tap:'v/rv_fire.mp4?v=2',
    spec:'빨강 · 고백과 결단',body:[
    '남쪽 하늘을 나는 불의 신. 꺼져 가는 마음속 불씨를 귀신같이 알아챈다. 밤의 도시를 가장 잘 아는 신이라, 네온이 꺼지는 시간까지 깨어 있다.',
    '나른하게 웃고, 말끝을 흐리고, 관심 없는 척 고개를 돌린다. 그런데 누군가 고백 앞에서 숨을 고를 때면 누구보다 먼저 그 옆에 서 있다.',
    '그의 불은 태우는 불이 아니라, 미뤄 둔 말을 꺼내게 하는 불이다.'],q:'망설이면 불 꺼진다. 오늘은 네가 먼저 가'},

  {t:'full',ch:'오방의 신 · 가운데',n:'도준',h:'黃龍 · 土',c:EL.earth,c2:'#f0cf8a',toc:'도준 · 黃龍',img:'img/earth.jpg?v=2',tap:'v/rv_earth.mp4?v=2',
    spec:'노랑 · 일과 돈, 흔들리지 않는 자리',body:[
    '다섯 방위의 한가운데를 지키는 흙의 신. 지금은 한강이 내려다보이는 펜트하우스에서 회사를 꾸리는 젊은 대표다. 회의가 길어지는 밤이면, 아무도 모르게 목덜미의 금빛 비늘이 떴다가 사라진다.',
    '흔들리는 것들을 붙잡아 제자리에 앉히는 게 그의 일이다. 일과 돈, 사람 사이의 무게를 가장 오래 견디는 쪽은 언제나 도준이다.',
    '스펙보다 타고난 판을 먼저 본다. 옮길 때인지 버틸 때인지, 기분 말고 때로 정하라고 말한다.'],q:'흔들려도 돼. 발밑은 내가 잡고 있을게'},

  {t:'frame',ch:'오방의 신 · 서쪽',n:'시온',h:'白虎 · 金',c:EL.metal,toc:'시온 · 白虎',img:'img/metal.jpg',tap:'v/ms/metal.mp4?v=2',
    spec:'흰색 · 정리와 재회',body:[
    '서쪽 문을 지키는 쇠의 신. 끊어야 할 것과 남길 것을 한눈에 가른다. 지나간 인연이 다시 문을 두드릴 때, 그 문을 열지 말지 가장 먼저 아는 것도 시온이다.',
    '말은 차갑고 건조하다. 위로 대신 사실을 말하고, 희망 대신 확률을 말한다. 그래서 그의 말은 아프지만 오래 남는다.',
    '그래도 그 칼끝은 언제나 사람을 살리는 쪽을 향한다. 비워야 들어온다는 걸, 그는 수천 년 동안 지켜봐 왔다.'],q:'안 맞는 건 끊어. 비워야 들어와'},

  {t:'card',ch:'오방의 신 · 북쪽',n:'재이',h:'玄武 · 水',c:EL.water,toc:'재이 · 玄武',img:'img/water.jpg?v=2',tap:'v/rv_water.mp4?v=2',
    spec:'남색 · 속마음과 지혜',body:[
    '북쪽 깊은 물을 지키는 물의 신. 사람이 끝내 말하지 못한 속마음이 흘러드는 곳에 산다. 손끝에 맺힌 물 구슬 안에는 누군가 삼킨 말들이 고여 있다.',
    '느리고 낮은 목소리로 먼저 들어 준다. 오래 기억하고, 필요할 때만 입을 연다. 지친 하루 끝, 아무도 모르게 곁에 앉아 있는 신이다.'],q:'말 안 해도 알아. 그래도 한 번은 말해 줘'},

  {t:'split',ch:'제4장',hd:'같은 바람, 다른 얼굴',c:'#2b5cc4',toc:'제4장 · 음의 현신',a:['img/wood.jpg','하람','甲 · 양의 얼굴'],b:[SAEA,'새아','乙 · 음의 얼굴'],body:[
    '인간계로 내려오며 신들의 기운은 두 몸으로 나뉘었다. 크게 뻗어 길을 내는 <b>양의 현신</b>과, 스며들어 오래 남는 <b>음의 현신</b>.',
    '큰 나무와 덩굴, 한낮의 해와 밤새 타는 등불, 큰 산과 기름진 밭, 무쇠와 보석, 큰 강과 새벽 이슬. 같은 신수, 같은 방위, 같은 기운의 두 얼굴이다.',
    '남매처럼 티격태격하지만 서로의 빈 곳을 누구보다 잘 안다.']},

  {t:'full',ch:'음의 현신 · 동쪽',n:'새아',h:'靑龍 · 木',c:EL.wood,c2:'#8fe0b5',toc:'새아 · 靑龍 · 음',img:SAEA,tap:D2+'5c50aa18-ca62-4c3f-a583-dcf5d4847487.mp4',
    spec:'乙 · 풀과 덩굴 · 다시 시작하기, 버티는 힘',body:[
    '하람의 다른 얼굴. 큰 나무가 바람에 부러질 때, 풀은 휘어서 산다.',
    '밝은 반말로 웃으면서 할 말은 다 하는 다정한 고집쟁이. 넘어진 자리에서 다시 일어나려는 사람 곁에 먼저 와서, 무릎의 흙부터 털어 준다.'],q:'괜찮아. 휘어도 안 꺾여'},

  {t:'mag',ch:'음의 현신 · 남쪽',n:'별하',h:'朱雀 · 火',c:EL.fire,toc:'별하 · 朱雀 · 음',img:'img/yin/fire.jpg',tap:D2+'30455774-ffb6-4d78-95f0-716de737468a.mp4',
    spec:'丁 · 촛불과 별빛 · 몰입, 고백과 결단의 타이밍',body:[
    '이안의 다른 얼굴. 한낮의 태양 대신 밤새 꺼지지 않는 촛불을 지킨다.',
    '말은 짧고 선은 분명하다. 한 가지에 오래 몰두해야 하는 사람, 고백의 때를 재는 사람에게 자기 불씨를 조금씩 나눠 준다.'],q:'작아도 괜찮아. 오래 타면 돼'},

  {t:'frame',ch:'음의 현신 · 가운데',n:'도담',h:'黃龍 · 土',c:EL.earth,toc:'도담 · 黃龍 · 음',img:'img/yin/earth.jpg',tap:D2+'9a5986fb-e15a-43b0-8227-fe37e6ec3d0e.mp4',
    spec:'己 · 논밭의 흙 · 재물과 살림, 거두는 때',body:[
    '도준의 다른 얼굴. 산이 버티는 땅이라면 도담은 길러 내고 거두는 밭이다.',
    '잔소리는 많아도 결국 곳간까지 다 챙겨 준다. 돈과 살림, 거둘 때를 묻는 사람의 편이다.'],q:'뿌린 만큼 거둬요. 걱정은 나한테 맡겨'},

  {t:'reveal',ch:'음의 현신 · 서쪽',n:'세린',h:'白虎 · 金',c:EL.metal,c2:'#dfe4ea',toc:'세린 · 白虎 · 음',poster:'img/yin/metal.jpg',v:D2+'6e77ff4d-1bcc-4e77-9676-351a9f281be4.mp4',voice:1,
    spec:'辛 · 보석과 칼날 · 정리와 결단, 커리어',body:[
    '시온의 다른 얼굴. 바위가 깎여 보석이 되듯, 다듬어진 날카로움을 가졌다.',
    '칭찬은 드물지만 늘 정확하다. 일의 값을 매기고, 버릴 것과 가질 것을 가르는 사람 곁에 선다.'],q:'칭찬은 아껴 둘게. 넌 아직 더 빛날 수 있어'},

  {t:'card',ch:'음의 현신 · 북쪽',n:'이슬',h:'玄武 · 水',c:EL.water,toc:'이슬 · 玄武 · 음',img:'img/yin/water.jpg',tap:D2+'cf2ab952-53cb-4703-b502-6445b716aec8.mp4',
    spec:'癸 · 이슬과 빗물 · 속마음, 꿈, 직감',body:[
    '재이의 다른 얼굴. 큰 강이 아니라 새벽에 맺히는 이슬처럼 조용히 스며든다.',
    '꿈 이야기를 잘하고, 직감은 누구보다 빠르다. 말로 다 하지 못한 마음을 먼저 알아듣는다.'],q:'천천히 말해도 돼. 다 들려'},

  {t:'pairs',ch:'제4장 · 이어서',hd:'두 얼굴, 하나의 기운',c:'#c8372d',toc:'제4장 · 두 얼굴',
    lead:'지켜 주는 힘은 같고, 곁에 있는 방식만 다르다. 수호신이 정해지면, 어느 얼굴로 만날지는 당신이 고른다.',
    rows:[['wood','하람','甲 · 큰 나무','새아','乙 · 덩굴','木','img/thumb/wood.jpg',SAEA],
      ['fire','이안','丙 · 한낮의 해','별하','丁 · 등불','火','img/thumb/fire.jpg','img/yin/fire.jpg'],
      ['earth','도준','戊 · 큰 산','도담','己 · 기름진 밭','土','img/thumb/earth.jpg?v=2','img/yin/earth.jpg'],
      ['metal','시온','庚 · 무쇠','세린','辛 · 보석','金','img/thumb/metal.jpg','img/yin/metal.jpg'],
      ['water','재이','壬 · 큰 물','이슬','癸 · 빗물','水','img/thumb/water.jpg?v=2','img/yin/water.jpg']]},

  {t:'frame',ch:'제5장 · 살롱의 주인',n:'서하',h:'오방색 실',c:'#c8372d',toc:'제5장 · 서하',img:'img/seoha.jpg',loop:'v/idle.mp4',tap:'v/t1.mp4',
    spec:'한남동 살롱 · 신의 말을 옮기는 사람',body:[
    '신은 사람에게 직접 말을 걸 수 없다. 그래서 문 안쪽에는 신의 말을 옮기는 사람이 있다. 한남동 언덕 위 살롱의 주인, <b>서하</b>.',
    '검은 단발에 검은 수트, 손목에는 다섯 빛깔 실을 꼰 팔찌. 돌려 말하는 위로보다 정확한 한마디가 사람을 살린다고 믿는다.',
    '그녀가 당신의 생일을 받아 적는 순간, 다섯 신 가운데 하나가 고개를 든다.'],q:'네 사주, 한 칸이 비어 있어. 그 빈자리, 신이 채워 줄게'},

  {t:'gal',ch:'제6장',hd:'묵향이 나는 방',c:'#8a6420',toc:'제6장 · 정통의 명인들',cards:[
    ['삼신 할매','섣달 그믐밤, 다음 해를 내다보는 할미','img/halmae.jpg','v/halmae.mp4'],['현암','한 사람의 평생을 아홉 마디로 읽는 명리 대가','img/jeongtong.jpg','v/menu/lifetime.mp4'],
    ['월하','나침반으로 좋은 날을, 붉은 실로 인연을 고르는 명인','img/taegil.jpg','v/menu/taegil.mp4'],['소헌 선생','붓으로 원국을 세우고 관인을 찍는 감정가','img/soheon.jpg','v/menu/soheon.mp4']],body:[
    '살롱 안쪽 복도 끝, 묵향이 배어 나오는 방이 넷 있다. 신들이 도시로 내려오기 훨씬 전부터 사람의 운을 읽어 온 명인들의 방이다. 카드를 누르면 명인이 말을 건넨다.',
    '신들이 빈칸을 채운다면, 명인들은 그 빈칸이 어디에 있는지 정확히 짚어 준다. 큰일을 앞둔 손님들은 늘 이 복도를 지나간다.']},

  {t:'prose',ch:'제6장 · 이어서',hd:'월하의 붉은 실',c:'#a8283a',por:'img/taegil.jpg',toc:'제6장 · 월하의 붉은 실',body:[
    '월하가 묶은 실은 쉽게 풀리지 않는다. 그래서 혼례를 앞둔 사람도, 오래 엇갈린 두 사람도 마지막엔 그녀의 방을 찾는다. 월하는 나침반으로 날을 고르고, 두 사람의 여덟 글자를 나란히 놓은 뒤에야 실을 꺼낸다.',
    '월하에게는 제자가 하나 있었다. 실을 다루는 손이 스승보다 빨랐던 아이. 어떤 매듭이든 한 번 보면 풀 줄 알았고, 한 번 풀면 다시 묶을 줄도 알았다.',
    '그 아이는 어느 봄날, 남의 붉은 실 사이에 <b>검은 실</b>을 한 가닥 섞었다. 왜 그랬는지는 아무도 모른다. 그리고 다시는 돌아오지 않았다.',
    '그날 이후 월하의 방 문턱에는 붉은 실이 한 줄 더 걸려 있다. 다시는 검은 실이 넘어오지 못하도록.']},

  {t:'split',ch:'제7장',hd:'불 켜진 다른 방들',c:'#e0679a',toc:'제7장 · 불 켜진 다른 방들',a:['img/tarot/mujin.jpg','무진','한밤의 카드방'],b:['img/taeo/base.jpg','태오','도화 향 펜트하우스'],body:[
    '문 너머엔 불 켜진 방이 몇 개 더 있다. 촛불 아래 카드를 펼치는 한밤의 카드방에는 <b>무진</b>, 도화 향 나는 야경 펜트하우스에는 <b>태오</b>.',
    '은행잎 골목 끝 연서당에서는 하람이 아직 오지 않은 편지를 정리하고, 해 질 녘 산사 테라스에서는 노을이 낮과 밤을 함께 읽는다. 어느 방부터 들를지는 당신 마음이다.']},

  {t:'mini',ch:'제8장',hd:'작아진 신들',c:'#c8372d',toc:'제8장 · 작아진 신들',body:[
    '사람 곁에 오래 머무는 건 신에게도 고된 일이다. 그래서 신들은 낮이 되면 손바닥만 하게 작아진다.',
    '점괘통을 흔들고, 부적 속에 살고, 하루씩 당번을 서서 도장을 찍어 준다. 크게 보면 신, 작게 보면 친구.']},

  {t:'full',ch:'제9장 · 뒷골목의 묘당',n:'마담 도화',h:'묘당의 주인',c:'#e0679a',c2:'#f5b5cf',toc:'제9장 · 묘당',img:'img/cat/madam.jpg',tap:'v/cat/madam.mp4',

let AC=null; const ac=()=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } };
function swoosh(){ const A=ac(); if(!A) return; const d=.62, n=A.createBuffer(1,A.sampleRate*d,A.sampleRate), a=n.getChannelData(0);
  for(let i=0;i<a.length;i++){ const t=i/a.length; a[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.15)),1.6)*(.55+.45*Math.sin(t*46)); }
  const s=A.createBufferSource(); s.buffer=n; const f=A.createBiquadFilter(); f.type='bandpass'; f.Q.value=.9; const t0=A.currentTime;
  f.frequency.setValueAtTime(700,t0); f.frequency.exponentialRampToValueAtTime(3600,t0+d*.55); f.frequency.exponentialRampToValueAtTime(1400,t0+d);
  const g=A.createGain(); g.gain.value=.22; s.connect(f); f.connect(g); g.connect(A.destination); s.start(); }
const BG_LV=.13, BG_DUCK=.02; let bgG=null, bgOn=true, bgLv=BG_LV;
try{ bgOn=localStorage.getItem('obBookBgm')!=='0'; }catch(e){}
function bgSet(lv,sec=.8){ bgLv=lv; if(!bgG) return; const g=bgG.gain,t=AC.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(bgOn?lv:0,t+sec); }
function bgStart(){ const A=ac(); if(!A||bgG) return; bgG=A.createGain(); bgG.gain.value=0; bgG.connect(A.destination);
  fetch('a/book_bgm.mp3').then(r=>r.arrayBuffer()).then(b=>A.decodeAudioData(b)).then(buf=>{ const s=A.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(bgG); s.start(); bgSet(bgLv,2); }).catch(()=>{}); }
document.addEventListener('pointerdown',bgStart,{once:true,capture:true});
function muUi(){ $('muB').classList.toggle('off',!bgOn); }
$('muB').onclick=e=>{ e.stopPropagation(); bgStart(); bgOn=!bgOn; try{ localStorage.setItem('obBookBgm',bgOn?'1':'0'); }catch(_){} muUi(); bgSet(bgLv,.4); toast(bgOn?'배경음악 켜짐':'배경음악 꺼짐'); };
muUi();
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1800); }
const sndOff=()=>{ try{ return sessionStorage.getItem('obSnd')==='0'; }catch(e){ return false; } };

/* ---------- 영상 ---------- */
const src=v=>{ if(v&&!v.getAttribute('src')){ v.src=v.dataset.src; } return v; };
function stopAll(l){ l.querySelectorAll('video').forEach(v=>{ try{ v.pause(); }catch(e){} v.classList.remove('on'); }); l.querySelectorAll('.vsub').forEach(x=>x.classList.remove('on')); const sh=l.querySelector('.sheet'); if(sh) sh.classList.remove('up'); }
function playV(v,{sound=false,loop=false,onend=null}={}){ if(!v) return; src(v); v.loop=loop; v.muted=!sound||sndOff(); try{ v.currentTime=0; }catch(e){}
  v.onplaying=()=>{ v.classList.add('on'); if(!v.muted) bgSet(BG_DUCK,.4); }; v.onended=()=>{ if(!v.muted) bgSet(BG_LV,1.2); onend&&onend(); };
  const p=v.play(); if(p&&p.catch) p.catch(err=>{ if(!v.muted){ v.muted=true; v.play().catch(()=>onend&&onend()); toast('목소리 버튼을 누르면 소리가 들려요'); } else onend&&onend(); }); }
function activate(i){ const l=leaves[i], P=PAGES[i]; if(!l) return;
  leaves.forEach((x,j)=>{ if(j!==i){ x.classList.remove('cur'); stopAll(x); } }); l.classList.add('cur'); bgSet(BG_LV);
  if(P.t==='film'){ const v=l.querySelector('video.lp'); setTimeout(()=>{ if(cur===i) playV(v); },300); }
  if(P.t==='frame'&&P.loop){ const v=l.querySelector('video.lp'); setTimeout(()=>{ if(cur===i) playV(v,{loop:true}); },500); }
  if(P.t==='reveal'){ const v=l.querySelector('video.rvv'), sh=l.querySelector('.sheet'); const up=()=>{ if(cur===i) sh.classList.add('up'); };
    playV(v,{sound:!!P.voice,onend:up}); clearTimeout(l._t); l._t=setTimeout(up,P.voice?14000:9000); }
  if(P.t==='voice'){ const v=l.querySelector('video.vc'), en=l.querySelector('video.en'), sb=l.querySelector('.vsub');
    playV(v,{sound:true,onend:()=>{ v.classList.remove('on'); if(cur===i) playV(en,{loop:true}); }}); setTimeout(()=>{ if(cur===i) sb.classList.add('on'); },900); }
  if(i>0) $('hint').classList.remove('on');
  $('prev').disabled=i===0; $('next').disabled=i===N-1; $('pgN').textContent=`${i+1} / ${N}`; $('prog').style.width=(i/(N-1)*100)+'%';
  $('runT').textContent=i===0?'팔자에 신이 들었다':(P.toc||P.hd||P.n);
  $('tocL').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i)); try{ sessionStorage.setItem('obBookPg6',i); }catch(e){}
  moreCheck(l);
  /* 다음 쪽 영상 미리 받기 */
  const nx=leaves[i+1]; if(nx) nx.querySelectorAll('video.rvv,video.vc,video.lp').forEach(v=>{ src(v); v.preload='auto'; });
}
/* 글이 더 있으면 '아래로' 표시 */
function moreCheck(l){ l.querySelectorAll('.more').forEach(m=>m.remove()); const s=l.querySelector('.scr'); if(!s) return; setTimeout(()=>{ if(s.scrollHeight>s.clientHeight+8){ const m=document.createElement('div'); m.className='more on'; m.textContent='아래로 더 읽기'; l.querySelector('.face').appendChild(m); s.addEventListener('scroll',()=>{ if(s.scrollTop>20) m.classList.remove('on'); },{passive:true,once:true}); } },1400); }

/* ---------- 책: 손가락으로 쓸어 넘기면 종이 모서리가 말리며 넘어간다 ---------- */
let cur=0, pf=null;
function initBook(){ const d=$('desk').getBoundingClientRect(); let start=0; try{ start=+(sessionStorage.getItem('obBookPg6')||0); }catch(e){} if(!(start>=0&&start<N)) start=0;
  try{ const m=location.hash.match(/p=(\d+)/); if(m) start=Math.min(N-1,+m[1]); }catch(e){}
  pf=new St.PageFlip($('book'),{width:Math.round(d.width),height:Math.round(d.height),size:'stretch',minWidth:260,maxWidth:560,minHeight:420,maxHeight:1200,
    usePortrait:true,showCover:false,autoSize:true,drawShadow:true,maxShadowOpacity:.55,flippingTime:850,mobileScrollSupport:true,swipeDistance:24,clickEventForward:true,disableFlipByClick:true,startPage:start,startZIndex:2});
  pf.on('flip',e=>{ cur=e.data; activate(cur); });
  let lastSt='read';
  pf.on('changeState',e=>{ const d=e.data; if((d==='flipping'||d==='user_fold')&&lastSt!=='user_fold'&&lastSt!=='flipping') swoosh(); if(d==='user_fold'||d==='flipping') $('hint').classList.remove('on'); lastSt=d; });
  pf.on('init',e=>{ cur=e.data.page||start; activate(cur); });
  pf.loadFromHTML(leaves);
  if(start===0){ setTimeout(()=>{ if(cur===0) $('hint').classList.add('on'); },1200); setTimeout(()=>$('hint').classList.remove('on'),7000); }
}
$('next').onclick=()=>pf&&pf.flipNext('bottom'); $('prev').onclick=()=>pf&&pf.flipPrev('bottom');
document.addEventListener('keydown',e=>{ if(!pf) return; if(e.key==='ArrowRight') pf.flipNext(); if(e.key==='ArrowLeft') pf.flipPrev(); });
$('tocB').onclick=()=>$('toc').classList.add('on');
$('toc').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b&&pf){ const n=+b.dataset.i; if(Math.abs(n-cur)<=1) pf.flip(n); else { pf.turnToPage(n); cur=n; activate(n); } } if(b||e.target.closest('.x')) $('toc').classList.remove('on'); };
$('back').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} if(history.length>1) history.back(); else location.href='./'; };

/* 아이폰은 손가락 동작 안에서 한 번 재생한 영상만 나중에 소리 내어 틀 수 있다 → 넘기는 손짓마다 앞뒤 쪽 목소리 영상을 미리 '깨워' 둔다 */
function prime(){ [cur-1,cur+1,cur+2].forEach(j=>{ const l=leaves[j]; if(!l) return; l.querySelectorAll('video.vc,video.rvv:not([muted])').forEach(v=>{ if(v._pr) return; v._pr=1; src(v); try{ v.muted=false; const p=v.play(); v.pause(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }); }); }
document.addEventListener('touchend',prime,{capture:true,passive:true}); document.addEventListener('click',prime,{capture:true});

/* 쪽 안의 버튼(목소리 듣기 · 글 보기 · 다시 듣기 · 명인 카드 · 홈) */
$('book').addEventListener('click',e=>{ const l=e.target.closest('.leaf'); if(!l) return; const i=+l.dataset.i, P=PAGES[i];
  const t=e.target.closest('[data-tap]'); if(t){ try{ sessionStorage.removeItem('obSnd'); }catch(_){} const v=l.querySelector('video.vv'); t.style.opacity='0'; playV(v,{sound:true,onend:()=>{ v.classList.remove('on'); t.style.opacity=''; }}); return; }
  const sk=e.target.closest('[data-skip]'); if(sk){ const sh=l.querySelector('.sheet'); if(sh) sh.classList.add('up'); return; }
  const vc=e.target.closest('[data-voice]'); if(vc){ try{ sessionStorage.removeItem('obSnd'); }catch(_){} const v=l.querySelector('video.vc'), en=l.querySelector('video.en'); if(en){ en.pause(); en.classList.remove('on'); } playV(v,{sound:true,onend:()=>{ v.classList.remove('on'); playV(en,{loop:true}); }}); return; }
  const g=e.target.closest('[data-gal]'); if(g){ l.querySelectorAll('.gal video').forEach(x=>{ x.pause(); x.classList.remove('on'); }); try{ sessionStorage.removeItem('obSnd'); }catch(_){} const v=g.querySelector('video'); playV(v,{sound:true,onend:()=>v.classList.remove('on')}); return; }
  const b=e.target.closest('[data-go]'); if(b){ if(b.dataset.go==='restart'){ pf.turnToPage(0); cur=0; activate(0); return; } try{ sessionStorage.setItem('toHome','1'); }catch(_){} location.href='./'; } });

/* 입체감: 마우스 · 폰 기울기 → 지금 펼친 쪽에만(카드 · 액자). 입력이 없으면 계산하지 않는다 */
(()=>{ let gx=0,gy=0,x=0,y=0,run=false;
  const loop=()=>{ x+=(gx-x)*.12; y+=(gy-y)*.12; const f=leaves[cur]&&leaves[cur].querySelector('.face'); if(f){ f.style.setProperty('--tx',x.toFixed(3)); f.style.setProperty('--ty',y.toFixed(3)); }
    if(Math.abs(gx-x)>.004||Math.abs(gy-y)>.004) requestAnimationFrame(loop); else run=false; };
  const set=(a,b)=>{ gx=Math.max(-1,Math.min(1,a)); gy=Math.max(-1,Math.min(1,b)); if(!run){ run=true; requestAnimationFrame(loop); } };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const r=$('stage').getBoundingClientRect(); set(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2); },{passive:true});
  let lo=0; addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; const t=performance.now(); if(t-lo<60) return; lo=t; set(e.gamma/22,(e.beta-40)/24); },{passive:true});
})();

requestAnimationFrame(()=>requestAnimationFrame(initBook));

</script>
