<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무료 존 · 오방사주</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&family=Song+Myung&display=swap">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 무료 존 — 생일만 넣으면 30초 안에 한 장짜리 결과. 테스트 6종을 한 엔진으로 돌린다(free.html?t=past|animal|bok|mind|bujeok|tti, t가 없으면 목록). */
:root{
  --brush:'OBrush','Noto Serif KR',serif; --bmj:'Song Myung','Noto Serif KR',serif; --serif:'Noto Serif KR',serif;
  --bg:#07060a; --stage:#18141b; --card:#231e27; --line:rgba(255,240,220,.1); --line-2:rgba(227,184,102,.32);
  --ink:#f6f1ea; --ink-2:#d0c7bb; --ink-3:#8e867c; --gold:#e3b866; --gold-2:#f3d79b; --red:#c8372d;
  --wood:#5fcf95; --fire:#ff7a5c; --earth:#e8b64f; --metal:#dfe5ee; --water:#7ea6ff;
  --sans:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --c:var(--gold); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,select,input{font-family:inherit}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:var(--stage);overflow:hidden}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0;border-radius:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .45s}
.scr::-webkit-scrollbar{display:none}
.scr.on{opacity:1;pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,8,12,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:#fff}
.ib svg{width:18px;height:18px}
.top b{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,236,200,.92);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.top .free{margin-left:auto;font:800 10.5px/1 var(--sans);letter-spacing:.12em;color:#1a1208;background:linear-gradient(180deg,#f3d79b,#d6a64f);padding:6px 9px;border-radius:0}
.wrap{padding:0 16px calc(env(safe-area-inset-bottom,0px) + 34px)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:95;background:rgba(0,0,0,.86);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:0;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.fx{position:absolute;inset:0;pointer-events:none;z-index:1}

/* 목록 */
.hubH{position:relative;padding:calc(env(safe-area-inset-top,0px) + 70px) 18px 16px;background:radial-gradient(ellipse 80% 60% at 70% 0%,rgba(227,184,102,.18),transparent 70%)}
.hubH small{font:800 11px/1 var(--sans);letter-spacing:.3em;color:var(--gold-2)}
.hubH h1{font-family:var(--brush);font-weight:400;font-size:46px;line-height:1.1;margin:10px 0 6px}
.hubH p{margin:0;font-family:var(--bmj);font-size:16px;color:var(--ink-2)}
.chips{display:flex;gap:6px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:0;border:1px solid rgba(255,255,255,.12);background:none;color:var(--ink-2);font-size:13.5px;cursor:pointer}
.chips button.on{background:rgba(227,184,102,.16);border-color:rgba(227,184,102,.55);color:var(--gold-2);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.fc{position:relative;border-radius:0;overflow:hidden;aspect-ratio:3/4.3;background:#111 center 20%/cover no-repeat;cursor:pointer;border:1px solid rgba(255,240,220,.1);text-align:left;padding:0;color:var(--ink);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.fc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(8,6,10,.92) 88%)}
.fc .tg{position:absolute;left:10px;top:10px;z-index:2;font:800 10px/1 var(--sans);letter-spacing:.1em;color:#1a1208;background:linear-gradient(180deg,#f3d79b,#d6a64f);padding:5px 7px;border-radius:0}
.fc .tm{position:absolute;right:10px;top:10px;z-index:2;font-size:10.5px;color:#fff;background:rgba(0,0,0,.5);padding:4px 7px;border-radius:0;backdrop-filter:blur(6px)}
.fc .ct{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.fc .ct b{display:block;font-family:var(--brush);font-weight:400;font-size:25px;line-height:1.15}
.fc .ct span{display:block;margin-top:5px;font-size:12px;line-height:1.45;color:var(--ink-2)}
.hubF{margin:18px 16px 0;padding:14px;border-radius:0;border:1px dashed rgba(227,184,102,.35);text-align:center;font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* 입력 */
.hero{position:relative;height:58vh;min-height:380px;max-height:540px;margin:0 -16px 8px;background:#000 center 20%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,.5),rgba(12,10,15,0) 26%,rgba(12,10,15,.35) 60%,var(--stage) 98%)}
.hero .t{position:absolute;left:18px;right:18px;bottom:8px;z-index:3}
.kick{font:800 11px/1 var(--sans);letter-spacing:.28em;color:var(--gold-2)}
.hero h1{font-family:var(--brush);font-weight:400;font-size:40px;line-height:1.14;margin:10px 0 6px;text-shadow:0 3px 20px rgba(0,0,0,.8)}
.hero p{margin:0;font-family:var(--bmj);font-size:16px;color:var(--ink-2);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:15px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.meQ{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(227,184,102,.12),rgba(227,184,102,.04));border-radius:0;padding:14px;color:var(--ink);cursor:pointer;margin-bottom:10px}
.meQ .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;color:#1a1208;background:linear-gradient(180deg,#f3d79b,#d6a64f);flex:none}
.meQ b{display:block;font-size:15.5px}.meQ small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.meQ i{margin-left:auto;font-style:normal;color:var(--gold-2);font-weight:800}
.other{display:block;margin:4px auto 12px;border:0;background:none;color:var(--ink-3);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:rgba(255,255,255,.03)}
.seg button{flex:1;height:40px;border:0;background:none;color:var(--ink-2);font-size:13.5px;cursor:pointer}
.seg button.on{background:rgba(227,184,102,.18);color:var(--gold-2);font-weight:700}
.g3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=text]{height:44px;border-radius:0;border:1px solid var(--line);background:#1a171d;color:var(--ink);font-size:15px;padding:0 10px;width:100%;min-width:0}
.go{width:100%;height:54px;border:0;border-radius:0;background:linear-gradient(180deg,#f0cf85,#d6a64f);color:#17120a;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(227,184,102,.25)}
.fine{font-size:11.5px;color:var(--ink-3);text-align:center;margin:10px 0 0;line-height:1.6}
#form[hidden]{display:none}

/* 퀴즈 */
.qz{padding:calc(env(safe-area-inset-top,0px) + 70px) 18px 30px;min-height:100%;display:flex;flex-direction:column}
.qbar{height:4px;border-radius:0;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:22px}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a6b,#ffd08a);transition:width .4s}
.qn{font:800 12px/1 var(--sans);letter-spacing:.2em;color:var(--gold-2)}
.qq{font-family:var(--bmj);font-size:24px;line-height:1.45;margin:12px 0 22px;min-height:70px}
.qo{display:grid;gap:9px}
.qo button{text-align:left;min-height:54px;padding:12px 16px;border-radius:0;border:1px solid rgba(255,240,220,.12);background:rgba(255,255,255,.035);color:var(--ink);font-size:15px;cursor:pointer;transition:all .2s;animation:up .35s both}
.qo button:active,.qo button.pk{border-color:var(--gold);background:rgba(227,184,102,.16)}

/* 로딩 */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ink{position:relative;width:136px;height:136px;margin-bottom:26px}
.ink .pf{position:absolute;inset:14px;border-radius:50%;background:#000 center 20%/cover no-repeat;box-shadow:0 0 30px rgba(227,184,102,.25)}
.ink svg{position:absolute;inset:0;width:100%;height:100%}
.ink circle{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:350;stroke-dashoffset:350}
.ld.on .ink circle{animation:brush 1.9s ease-in-out forwards}
@keyframes brush{to{stroke-dashoffset:22}}
.ld h2{font-family:var(--bmj);font-weight:400;font-size:20px;margin:0 0 8px}
.ld p{margin:0;color:var(--ink-3);font-size:13.5px;min-height:20px}

/* 결과 */
.rh{position:relative;height:46vh;min-height:320px;max-height:430px;margin:0 -16px;background:#000 center 18%/cover no-repeat}
.rh:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,.45),rgba(12,10,15,0) 24%,rgba(12,10,15,.2) 55%,var(--stage) 97%)}
.rh .t{position:absolute;left:18px;right:18px;bottom:0;z-index:3}
.rh h1{font-family:var(--brush);font-weight:400;font-size:44px;line-height:1.12;margin:8px 0 4px;text-shadow:0 3px 22px rgba(0,0,0,.9)}
.rh p{margin:0;font-family:var(--bmj);font-size:16px;color:var(--ink-2);line-height:1.5}
.vis{margin:16px 0 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;margin-top:12px}
.box h3{margin:0 0 12px;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.box p{margin:0 0 8px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.box p b{color:var(--ink)}
.li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;line-height:1.6;color:var(--ink-2);margin-bottom:7px}
.li i{font-style:normal;color:var(--gold);font-weight:900}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px;border-radius:0;background:linear-gradient(180deg,rgba(227,184,102,.1),rgba(227,184,102,.03));border:1px solid var(--line-2)}
.say .av{width:44px;height:44px;border-radius:50%;flex:none;background:#000 center 20%/cover no-repeat;box-shadow:0 0 0 1.5px var(--gold)}
.say small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold-2);margin-bottom:3px}
.say p{margin:0;font-family:var(--bmj);font-size:16.5px;line-height:1.55;color:var(--ink)}
.row2{display:flex;gap:8px;margin-top:12px}
.btn2{flex:1;height:48px;border-radius:0;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--ink);font-weight:800;font-size:14.5px;cursor:pointer}
.btn2.pr{border:0;background:linear-gradient(180deg,#f0cf85,#d6a64f);color:#17120a}
.up{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:0;border:1px solid rgba(255,240,220,.12);background:#110f14;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.up .th{width:62px;height:78px;border-radius:0;background:#000 center 20%/cover no-repeat;flex:none}
.up small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.up b{display:block;font-size:15.5px;margin:3px 0}
.up span{font-size:12.5px;color:var(--ink-3)}
.up i{margin-left:auto;font-style:normal;color:var(--gold-2);font-size:20px}
.more h4{margin:22px 2px 10px;font-size:13px;color:var(--ink-2);font-weight:700}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.hs::-webkit-scrollbar{display:none}
.hs .fc{flex:none;width:132px;aspect-ratio:3/4.2}
.hs .fc .ct b{font-size:19px}.hs .fc .ct span{display:none}
.sheet{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.sheet.on{display:flex}
.sheet img{max-height:68vh;max-width:100%;border-radius:0;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.sheet .row2{width:100%;max-width:330px}

/* 전생: 호패 */
.hopae{position:relative;margin:26px auto 4px;width:172px;aspect-ratio:1/2.25;border-radius:40px 40px 14px 14px;background:linear-gradient(90deg,#6e4a2a,#9a6d42 18%,#b4834f 50%,#9a6d42 82%,#6e4a2a);box-shadow:inset 0 0 0 3px rgba(40,24,10,.5),inset 0 0 30px rgba(40,20,5,.55),0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;padding:34px 18px 20px;color:#2a170a;transform:rotate(-2deg);animation:swing 4s ease-in-out infinite}
@keyframes swing{50%{transform:rotate(2deg)}}
.hopae:before{content:"";position:absolute;top:14px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#1e1109;box-shadow:inset 0 2px 3px rgba(0,0,0,.8)}
.hopae:after{content:"";position:absolute;top:-60px;left:50%;width:2px;height:66px;background:linear-gradient(#b3322a,#8f2a22);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.hopae .j{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-weight:900;font-size:36px;line-height:1.12;text-shadow:0 1px 0 rgba(255,220,170,.35);margin-top:10px}
.hopae .nm{margin-top:auto;font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.2em}
.hopae .sm{font-size:11.5px;font-weight:700;opacity:.8;margin-top:4px;letter-spacing:.08em}
.hopae .seal{position:absolute;right:12px;bottom:58px;width:38px;height:38px;border-radius:6px;border:2px solid rgba(179,50,42,.85);color:rgba(179,50,42,.9);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:13px;line-height:1.05;transform:rotate(8deg)}

/* 일주 동물 */
.ilju{position:relative;margin:0 auto;width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%)}
.ilju:before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);animation:spin 18s linear infinite;border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
.ilju .g{font-family:var(--serif);font-weight:900;font-size:86px;line-height:1;color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
.ilju small{position:absolute;bottom:36px;font:800 12px/1 var(--sans);letter-spacing:.3em;color:var(--ink-2)}
.pair{display:flex;gap:8px;flex-wrap:wrap}
.pair span{padding:6px 11px;border-radius:0;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.pair span.g{border-color:rgba(95,207,149,.5);color:#bff0d6}
.pair span.x{border-color:rgba(255,122,92,.5);color:#ffcdbf}

/* 복주머니 */
.boks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;text-align:center}
.bk{display:flex;flex-direction:column;align-items:center;gap:6px}
.bk .pouch{position:relative;width:52px;height:60px}
.bk .pouch svg{width:100%;height:100%;overflow:visible}
.bk .pouch .fill{transition:transform 1.1s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%;transform:scaleY(.05)}
.bk b{font-size:12.5px}
.bk .st{font-size:11px;color:var(--gold);letter-spacing:-.05em}
.bk.best b{color:var(--gold-2)}

/* 마음 vs 사주 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.vs .o{border-radius:0;padding:16px 6px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.vs .o small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.vs .o b{display:block;font-family:var(--serif);font-weight:900;font-size:52px;line-height:1.15}
.vs .o span{font-size:12.5px;color:var(--ink-2)}
.vs .x{font-family:var(--serif);font-size:20px;color:var(--gold-2)}
.bars5{display:grid;gap:8px}
.bars5 div{display:grid;grid-template-columns:24px 1fr 20px;gap:8px;align-items:center;font-size:13px}
.bars5 i{display:block;height:8px;border-radius:0;background:rgba(255,255,255,.07);overflow:hidden}
.bars5 i u{display:block;height:100%;width:0;border-radius:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* 부적 */
.bjDeck{display:flex;justify-content:center;gap:10px;margin:8px 0 6px;perspective:900px}
.bj{position:relative;width:96px;aspect-ratio:1/2.2;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.bj .f,.bj .b{position:absolute;inset:0;border-radius:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bj .b{background:repeating-linear-gradient(45deg,#2a1d12 0 6px,#231810 6px 12px);border:1.5px solid rgba(227,184,102,.55);box-shadow:0 10px 24px rgba(0,0,0,.5);display:grid;place-items:center}
.bj .b:after{content:"符";font-family:var(--serif);font-weight:900;font-size:30px;color:rgba(227,184,102,.7)}
.bj .f{transform:rotateY(180deg)}
.bj.on{transform:rotateY(180deg) translateY(-6px)}
.bj.dim{opacity:.25;transform:scale(.92)}
.bjDeck.one .bj{width:150px}
.bjDeck:not(.picked) .bj:hover{transform:translateY(-6px)}
.talis{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dd div{border-radius:0;padding:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center}
.dd small{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.dd b{font-size:15px}

/* 띠 궁합 */
.tti{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.tti .o{display:flex;flex-direction:column;align-items:center;gap:6px}
.tti .ci{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:44px;border:2px solid var(--line-2);background:radial-gradient(circle,rgba(227,184,102,.16),transparent 70%)}
.tti .o b{font-size:14px}.tti .o small{font-size:11.5px;color:var(--ink-3)}
.tti .ln{display:flex;flex-direction:column;align-items:center;gap:4px}
.tti .ln span{font-family:var(--serif);font-weight:900;font-size:40px;color:var(--gold-2);line-height:1}
.tti .ln small{font:800 11px/1 var(--sans);letter-spacing:.14em;color:var(--gold)}
.tti .ln i{display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ===== 2026-09-30 23시 서브 화면 정돈 — 각진 카드, 먹빛 차콜 바탕, 제목 줄, 캐릭터 한마디는 금색 세로줄 ===== */

const BU={0:{h:'勇',n:'용기 부적',l:'오늘은 비교하지 말고 내 속도로. 경쟁이 붙으면 오히려 네가 이겨.',d:'먼저 손 들기',x:'남 탓'},1:{h:'言',n:'말문 부적',l:'오늘 네 말에 힘이 실려. 미뤄 둔 연락·제안·글, 오늘 보내.',d:'먼저 말 걸기',x:'뒷말'},2:{h:'財',n:'재물 부적',l:'작은 돈이 들어오는 날. 대신 들어온 만큼 새지 않게 지갑 단속.',d:'가계부 한 줄',x:'충동 결제'},3:{h:'官',n:'합격 부적',l:'평가받는 자리에 강한 날. 면접·발표·보고는 오늘 하면 좋아.',d:'옷 한 벌 제대로',x:'지각'},4:{h:'貴',n:'귀인 부적',l:'도와주는 사람이 나타나는 날. 부탁하면 생각보다 쉽게 풀려.',d:'고맙다는 말',x:'혼자 끙끙'},
  chung:{h:'厄',n:'액막이 부적',l:'오늘은 네 일지와 부딪히는 날. 큰 결정은 내일로, 말은 한 템포 늦게.',d:'일찍 귀가',x:'언쟁'},peach:{h:'緣',n:'인연 부적',l:'오늘 네 도화가 열리는 날. 사람 많은 곳에 한 번 나가 봐.',d:'향수 한 번',x:'약속 취소'}};
function talisman(h,seed){ const r=i=>((hash(seed+':'+i)%1000)/1000);
  const zig=Array.from({length:7},(_,i)=>`${22+i*9},${150+(i%2?-8:8)+r(i)*6}`).join(' ');
  return `<svg class="talis" viewBox="0 0 100 220"><defs><linearGradient id="py" x1="0" x2="1"><stop offset="0" stop-color="#e9c65a"/><stop offset=".5" stop-color="#f6dd7c"/><stop offset="1" stop-color="#e2bb4c"/></linearGradient></defs>
  <rect x="2" y="2" width="96" height="216" rx="3" fill="url(#py)"/><rect x="7" y="7" width="86" height="206" fill="none" stroke="#b3261e" stroke-width="2"/><rect x="10" y="10" width="80" height="200" fill="none" stroke="#b3261e" stroke-width=".8"/>
  <g stroke="#b3261e" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="50" cy="30" r="9"/><path d="M50 21 V39 M41 30 H59"/><path d="M30 46 Q50 40 70 46"/><path d="M28 54 H72"/></g>
  <text x="50" y="118" text-anchor="middle" font-family="Noto Serif KR,serif" font-weight="900" font-size="54" fill="#b3261e">${h}</text>
  <g stroke="#b3261e" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="${zig}"/><path d="M26 170 Q50 ${176+r(9)*8} 74 170"/><path d="M50 176 V200 M40 190 H60"/><circle cx="50" cy="204" r="4"/></g>
  <g fill="#b3261e" opacity=".85"><rect x="64" y="178" width="18" height="18" rx="2"/></g><text x="73" y="191" text-anchor="middle" font-size="9" font-weight="900" fill="#f6dd7c" font-family="Noto Serif KR,serif">吉</text></svg>`; }
function runBujeok(A){ const t=new Date(), dp=Sj.dayPillar(t.getFullYear(),t.getMonth()+1,t.getDate()), r=(stEl(dp[0])-stEl(A.dm)+5)%5;
  const pk=[PEACH(A.P.y[1]),PEACH(A.P.d[1])];
  const key=Sj.isChung(dp[1],A.P.d[1])?'chung':pk.includes(dp[1])?'peach':r; const B=BU[key];
  const why=key==='chung'?`오늘 일진 ${GAN[dp[0]]}${JI[dp[1]]}의 ${JI[dp[1]]}가 내 일지 ${JI[A.P.d[1]]}와 충`:key==='peach'?`오늘 일진의 ${JI[dp[1]]}가 내 도화 글자`:`오늘 일진 ${GAN[dp[0]]}${JI[dp[1]]}이 내 일간 ${GAN[A.dm]}에게 ${['비겁(나와 같은 기운)','식상(내가 내보내는 기운)','재성(내가 다루는 기운)','관성(나를 다듬는 기운)','인성(나를 돕는 기운)'][r]}`;
  const seed=`${t.toDateString()}|${A.sol.y}${A.sol.m}${A.sol.d}`;
  return {k:`${t.getMonth()+1}월 ${t.getDate()}일 · ${GAN[dp[0]]}${JI[dp[1]]}일`,t:B.n,p:B.l,
    vis:`<div class="bjDeck" id="bjDeck">${[0,1,2].map(i=>`<div class="bj" data-i="${i}"><div class="b"></div><div class="f">${talisman(B.h,seed)}</div></div>`).join('')}</div><p class="fine" id="bjHint">마음 가는 한 장을 골라요</p>`,
    say:'어느 걸 골라도 오늘 너한테 올 부적은 정해져 있어. …그래도 고르는 맛은 있잖아.',
    body:`<div class="dd"><div><small>오늘 하면 좋은 것</small><b>${B.d}</b></div><div><small>오늘 피할 것</small><b>${B.x}</b></div></div>
      <div class="box"><h3>이 부적이 나온 이유</h3><p>${why}이라 <b>${B.n}</b>이 나왔어요.</p><p style="font-size:12.5px;color:var(--ink-3);margin:0">부적은 날마다 바뀌어요. 내일 또 뽑으러 와요.</p></div>`,
    share:[`${t.getMonth()+1}월 ${t.getDate()}일 나의 부적`,B.n,B.l], hold:true,
    after:()=>{ const dk=$('bjDeck'); dk.onclick=e=>{ const c=e.target.closest('.bj'); if(!c||dk.classList.contains('picked')) return; dk.classList.add('picked'); c.classList.add('on'); dk.querySelectorAll('.bj').forEach(x=>{ if(x!==c) x.classList.add('dim'); }); $('bjHint').textContent=B.n+' · 오늘 하루 지갑이나 폰 배경에'; ding(); setTimeout(()=>{ document.querySelectorAll('#rB .box,#rB .dd,.say').forEach(x=>x.style.opacity=1); $('rT').style.opacity=1; $('rP').style.opacity=1; },500); }; }}; }

/* ---- 띠 궁합 ---- */
const WONJIN={0:7,7:0,1:6,6:1,2:9,9:2,3:8,8:3,4:11,11:4,5:10,10:5};
function runTti(y1,y2){ const b1=((y1-4)%12+12)%12, b2=((y2-4)%12+12)%12;
  let R;
  if(b1===b2) R={s:84,k:'같은 띠',t:'거울 같은 사이',p:'생각하는 방식이 닮아서 금방 친해져요. 대신 고집 부리는 포인트도 같아요.',tip:'싸울 땐 누가 먼저 웃을지 정해 두기'};
  else if(SAM.some(g=>g.includes(b1)&&g.includes(b2))) R={s:95,k:'삼합',t:'말 안 해도 통하는 사이',p:'같은 방향을 보는 띠끼리의 합이에요. 같이 뭘 해도 손발이 척척 맞아요.',tip:'둘이 같이 하는 목표 하나 만들기'};
  else if(LIU[b1]===b2) R={s:92,k:'육합',t:'서로 끌어당기는 짝',p:'자석처럼 끌리는 합이에요. 처음 본 순간부터 편한 느낌이 들어요.',tip:'편하다고 소홀하지 않기'};
  else if(Math.abs(b1-b2)===6) R={s:58,k:'충',t:'부딪히며 크는 사이',p:'정반대 띠라 불꽃이 튀어요. 싸워도 크게 싸우지만 서로를 확 깨워 줘요.',tip:'감정 말고 사실만 말하기'};
  else if(WONJIN[b1]===b2) R={s:63,k:'원진',t:'괜히 서운한 사이',p:'이유 없이 서운함이 쌓이기 쉬운 조합이에요. 말로 설명하는 습관이 답이에요.',tip:'"그런 뜻 아니었어" 먼저 말하기'};
  else if(Sj.isHyung(b1,b2)) R={s:67,k:'형',t:'밀고 당기는 사이',p:'서로를 다듬어 주지만 가끔 날이 서요. 존중하는 선만 지키면 오래 가요.',tip:'잔소리는 하루 한 번만'};
  else R={s:78,k:'무난',t:'천천히 알아가는 사이',p:'크게 묶이지도 부딪히지도 않아요. 시간이 쌓일수록 좋아지는 사이.',tip:'작은 기념일 챙기기'};
  const s1=((y1-4)%10+10)%10, s2=((y2-4)%10+10)%10;
  return {k:`띠 궁합 · ${R.k}`,t:R.t,p:R.p,score:R.s,
    vis:`<div class="box" style="margin-top:0"><div class="tti"><div class="o"><span class="ci">${JI[b1]}</span><b>${ANI[b1]}띠</b><small>${y1}년 · ${GAN[s1]}${JI[b1]}</small></div><div class="ln"><small>${R.k}</small><span data-cnt>${R.s}</span><i></i></div><div class="o"><span class="ci">${JI[b2]}</span><b>${ANI[b2]}띠</b><small>${y2}년 · ${GAN[s2]}${JI[b2]}</small></div></div></div>`,
    say:R.s>=90?'오, 이 조합 좋은데? …좀 부럽다, 누나.':R.s>=75?'나쁘지 않아. 근데 띠는 절반이야, 생일까지 넣어 봐.':'부딪히는 띠네. …그래서 더 끌리는 거 아니야?',
    body:`<div class="box"><h3>두 띠 사이</h3><p>${R.p}</p><p><b>오래 가는 팁</b> · ${R.tip}</p><p style="font-size:12.5px;color:var(--ink-3);margin:0">근거 · ${ANI[b1]}(${JI[b1]}) × ${ANI[b2]}(${JI[b2]}) = ${R.k}. 띠 궁합은 태어난 해만 보는 간이 궁합이라, 생일을 넣은 도화 궁합이 훨씬 정확해요.</p></div>`,
    share:[`${ANI[b1]}띠 × ${ANI[b2]}띠`,R.t,`${R.k} · ${R.s}점`]}; }

const Q=new URLSearchParams(location.search); let KEY=Q.get('t'); if(KEY&&!T[KEY]) KEY=null;
let CUR=null, RES=null;

/* 입력 */
let cal='s', gender='f';
(function(){ const by=$('by'),bm=$('bm'),bd=$('bd'),bh=$('bh'),t1=$('ty1'),t2=$('ty2');
  for(let y=2010;y>=1950;y--){ by.add(new Option(y+'년',y,false,y===1996)); t1.add(new Option(y+'년생 (나)',y,false,y===1996)); t2.add(new Option(y+'년생 (그 사람)',y,false,y===1994)); }
  for(let m=1;m<=12;m++) bm.add(new Option(m+'월',m,false,m===5));
  window.fillD=()=>{ const n=cal==='s'?new Date(+by.value,+bm.value,0).getDate():30, cur=+bd.value||14; bd.innerHTML=''; for(let d=1;d<=n;d++) bd.add(new Option(d+'일',d,false,d===Math.min(cur,n))); };
  fillD(); by.onchange=fillD; bm.onchange=fillD; bh.add(new Option('태어난 시 모름','x',true,true)); HOURS.forEach((h,i)=>bh.add(new Option(h,i)));
  const seg=(id,cb)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ $(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); cb(b.dataset.v); });
  seg('cSeg',v=>{ cal=v; fillD(); }); seg('gSeg',v=>gender=v); })();
const setSeg=(id,v)=>$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
function prefill(me){ if(!me||!me.y) return; cal=me.cal||'s'; gender=me.g||'f'; setSeg('cSeg',cal); setSeg('gSeg',gender); $('nm').value=me.name||''; $('by').value=me.y; $('bm').value=me.m; fillD(); $('bd').value=me.d; $('bh').value=me.h==null?'x':me.h; $('ty1').value=me.y; }
const readForm=()=>({name:$('nm').value.trim(),g:gender,cal,y:+$('by').value,m:+$('bm').value,d:+$('bd').value,h:$('bh').value==='x'?null:+$('bh').value});

function openTest(k){ KEY=k; CUR=T[k]; history.replaceState(null,'','?t='+k); WANT_BIRTH_FOR_MIND=false;
  $('topT').textContent=CUR.t;
  const H=HOST[CUR.host]; $('inHero').style.backgroundImage=`url('${H.img}')`; $('inK').textContent=`FREE · ${H.h} ${H.n}`; $('inT').innerHTML=CUR.tt; $('inP').textContent=CUR.teaser;

  if(CUR.input==='quiz'){ $('meQ').hidden=true; $('other').hidden=true; $('form').hidden=false; $('fBirth').hidden=true; $('fTti').hidden=true; $('goBtn').textContent='테스트 시작 (8문항)'; $('inFine').textContent='정답은 없어요. 가장 먼저 떠오르는 걸 골라요.'; show('sIn'); return; }

function openInput(){ const me=loadMe(); $('fBirth').hidden=CUR.input==='tti'; $('fTti').hidden=CUR.input!=='tti'; $('inFine').textContent='입력한 정보는 결과 계산에만 쓰여요.';
  $('goBtn').textContent=WANT_BIRTH_FOR_MIND?'사주랑 비교하기':'결과 보기';
  if(me&&me.y&&CUR.input!=='tti'){ prefill(me); $('meQ').hidden=false; $('other').hidden=false; $('form').hidden=true;
    $('meIc').textContent=(me.name||'나').slice(-1); $('meT').textContent=`${me.name||'내'} 정보로 바로 보기`; $('meS').textContent=`${me.cal==='l'?'음력':'양력'} ${me.y}.${me.m}.${me.d}${me.h!=null?' · '+HOURS[me.h].split(' ')[0]:''}`; }
  else { if(me) prefill(me); $('meQ').hidden=true; $('other').hidden=true; $('form').hidden=false; }
  show('sIn'); }
$('other').onclick=()=>{ $('form').hidden=false; $('other').hidden=true; $('meQ').hidden=true; };
$('meQ').onclick=()=>go(loadMe());
$('goBtn').onclick=()=>{ if(CUR.input==='quiz'&&!WANT_BIRTH_FOR_MIND){ startQuiz(); return; }
  if(CUR.input==='tti'){ go(null); return; } const me=readForm(); if(!build(me)){ toast('없는 음력 날짜예요'); return; } saveMe(me); go(me); };
async function go(me){ if(me&&!build(me)){ toast('없는 음력 날짜예요'); return; } await loading(); finish(me); }
async function loading(){ const H=HOST[CUR.host]; $('ldPf').style.backgroundImage=`url('${H.img}')`; $('ldT').textContent=`${H.n}${bat(H.n)?'이':'가'} 보는 중`; show('sLd');
  for(const t of CUR.ld){ $('ldP').textContent=t; await wait(560); } await wait(250); }
async function finish(me){ if(KEY==='mind'&&!me){ await loading(); me=loadMe(); }
  const A=me&&me.y?build(me):null;
  RES=KEY==='past'?runPast(A):KEY==='animal'?runAnimal(A):KEY==='bok'?runBok(A):KEY==='mind'?runMind(A):KEY==='bujeok'?runBujeok(A):runTti(+$('ty1').value,+$('ty2').value);
  render(); }
function render(){ const H=HOST[CUR.host];
  $('rH').style.backgroundImage=`url('${H.img}')`; $('rK').textContent=RES.k; $('rT').textContent=RES.t; $('rP').textContent=RES.p;
  $('rV').innerHTML=RES.vis; $('rB').innerHTML=RES.body; $('sayAv').style.backgroundImage=`url('${H.img}')`; $('sayN').textContent=`${H.h} · ${H.n}`; $('sayT').textContent=RES.say;
  const U=CUR.up; $('upTh').style.backgroundImage=`url('${U.img}')`; $('upK').textContent=U.k; $('upT').textContent=U.t; $('upS').textContent=U.s; $('up').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} location.href=U.go; };
  $('more').innerHTML=ORDER.filter(k=>k!==KEY).map(cardHTML).join('');
  document.body.dataset.menu=CUR.t;
  if(RES.hold){ $('rT').style.opacity=.25; $('rP').style.opacity=.25; setTimeout(()=>document.querySelectorAll('#rB .box,#rB .dd,.say').forEach(x=>{ x.style.transition='opacity .6s'; x.style.opacity=.25; }),0); }
  else { $('rT').style.opacity=1; $('rP').style.opacity=1; }
  show('sRs'); if(window.Depth3D){ Depth3D.unmount($('rH')); Depth3D.mount($('rH'),{src:H.img,pos:[.5,.18]}); }
  if(RES.after) RES.after(); ding(); }
$('again').onclick=()=>openTest(KEY);
$('toHub').onclick=()=>{ history.replaceState(null,'',location.pathname); KEY=null; hub(); show('sHub'); $('sHub').dataset.seen='1'; $('topT').textContent='FREE ZONE'; };
$('back').onclick=()=>{ if($('sHub').classList.contains('on')||!$('sHub').dataset.seen){ home(); return; } $('toHub').onclick(); };

/* 소리 */
let AC=null; const ac=()=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){} return AC; };
function ding(){ const A=ac(); if(!A) return; const t=A.currentTime; [[784,.07],[1175,.05],[1568,.03]].forEach(([f,v],i)=>{ const o=A.createOscillator(), g=A.createGain(); o.frequency.value=f; g.gain.setValueAtTime(.0001,t+i*.06); g.gain.exponentialRampToValueAtTime(v,t+i*.06+.01); g.gain.exponentialRampToValueAtTime(.0001,t+i*.06+1.2); o.connect(g).connect(A.destination); o.start(t+i*.06); o.stop(t+i*.06+1.3); }); }

/* 공유 카드 1080×1920 */
let blob=null;
async function card(){ const W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try{ await document.fonts.load('80px OBrush'); await document.fonts.load('40px "Song Myung"'); }catch(e){}
  const im=await new Promise(ok=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ok(null); i.src=HOST[CUR.host].img; });
  x.fillStyle='#0c0a0f'; x.fillRect(0,0,W,H);
  if(im){ const s=Math.max(W/im.width,1250/im.height), w=im.width*s, h=im.height*s; x.drawImage(im,(W-w)/2,0,w,h); }
  let g=x.createLinearGradient(0,700,0,1300); g.addColorStop(0,'rgba(12,10,15,0)'); g.addColorStop(1,'rgba(12,10,15,1)'); x.fillStyle=g; x.fillRect(0,700,W,1220);
  x.fillStyle='#f3d79b'; x.beginPath(); x.roundRect?x.roundRect(60,70,200,64,32):x.rect(60,70,200,64); x.fill(); x.fillStyle='#1a1208'; x.font='800 30px "Noto Sans KR",sans-serif'; x.textAlign='center'; x.fillText('FREE · 30초',160,114);
  x.textAlign='center'; x.fillStyle='#f3d79b'; x.font='700 40px "Noto Sans KR",sans-serif'; x.fillText(RES.share[0],W/2,1330);
  x.fillStyle='#fff'; let fs=132; x.font=`${fs}px OBrush, "Noto Serif KR", serif`; while(x.measureText(RES.share[1]).width>W-120&&fs>70){ fs-=8; x.font=`${fs}px OBrush, "Noto Serif KR", serif`; } x.fillText(RES.share[1],W/2,1490);
  x.fillStyle='#d0c7bb'; x.font='42px "Song Myung", serif'; const words=String(RES.share[2]).split(' '); let line='', yy=1600; words.forEach(w=>{ const t=line?line+' '+w:w; if(x.measureText(t).width>W-160){ x.fillText(line,W/2,yy); yy+=62; line=w; } else line=t; }); if(line) x.fillText(line,W/2,yy);
  x.fillStyle='rgba(243,215,155,.85)'; x.font='700 30px "Noto Sans KR",sans-serif'; x.fillText(`OBANG SAJU · 오방사주 무료 존 · ${CUR.t}`,W/2,1860);
  return new Promise(ok=>cv.toBlob(ok,'image/jpeg',.9)); }
