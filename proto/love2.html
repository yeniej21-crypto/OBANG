html,body{height:100%}
body{margin:0;background:#07060a;color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,select,input{font-family:inherit}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:var(--stage);overflow:hidden}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .45s}
.scr::-webkit-scrollbar{display:none}.scr.on{opacity:1;pointer-events:auto}

.ib svg{width:20px;height:20px}

.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  return [{id:'core',prompt:core,check:d=>d&&Array.isArray(d.letter)},{id:'c0',prompt:cal([0,1,2,3,4,5]),check:isArr},{id:'c1',prompt:cal([6,7,8,9,10,11]),check:isArr}]; }
function apply(id,d){ if(id==='core') Object.keys(d).forEach(k=>{ if(d[k]&&d[k].length) C[k]=d[k]; }); else d.forEach(x=>{ const i=+x.i; if(i>=0&&i<12) C.months[i]=Object.assign({},C.months[i],x); }); }
function build(){ const nk=D.me.name||'', ps=a=>K.ps(a,nk), t=x=>K.tok(x,nk), top=[...D.M].sort((a,b)=>b.sc-a.sc), hi=top.slice(0,2), lo=[...D.M].sort((a,b)=>a.sc-b.sc).slice(0,1);
  const H=[`<div class="pk-st" id="lvst" hidden></div>`];
  if(MODE==='re') H.push(K.sec('시온의 재회 노트 · 두 사람 사이',ps(C.why)+K.ev(D.pts.map(p=>p[0]))));
  else H.push(K.sec('서하의 인연 노트 · 그 사람의 결',`<div class="pk-vs"><div><small>인연의 별</small><b>${EL[D.starEl]}</b><em>${TYPE[D.starEl].n}</em></div><div><small>만나는 곳</small><b style="font-size:15px">${TYPE[D.starEl].place.split(', ')[0]}</b><em>${TYPE[D.starEl].job}</em></div></div>`+ps(C.who)));
  H.push(K.sec(MODE==='re'?'열두 달 재회 달력':'열두 달 인연 달력',`<div class="pk-acc">${D.M.map((x,i)=>{ const c=C.months[i]||{}, o=x.o, tag=hi.includes(x)?(MODE==='re'?'다시 닿음':'인연'):lo.includes(x)?'조심':'';
    return K.row({k:'v'+i,cls:hi.includes(x)?'pk-hi':lo.includes(x)?'pk-lo':'',a:`${o.start.m}월`,asub:`${o.start.y}`,b:`<em>${o.gz}</em>${t(c.title||'')}${tag?`<span class="pk-tag">${tag}</span>`:''}`,c:x.sc,body:ps([c.text])+(c.tip?`<p class="pk-key"><b>이달 한 줄</b>${t(c.tip)}</p>`:'')+K.ev([...new Set(x.why.concat(o.ss.filter(k=>!x.why.includes(k))))])}); }).join('')}</div>`,'입춘 기준 · 숫자는 점수'));
  H.push(K.sec(MODE==='re'?'먼저 연락해도 되는 날':'고백하기 좋은 날',D.days.length?`<div class="pk-cards">${D.days.map(o=>`<div class="pk-card"><b>${o.m}.${o.d}<small>${o.y} · ${DOW[o.w]}요일</small></b><div><p class="pk-ct">${GAN[o.s]}${JI[o.b]}일</p><p>${o.why.join(' · ')}</p></div></div>`).join('')}</div>`:'<p class="pk-p">따로 고른 날이 없어요. 점수가 높은 달을 노리세요.</p>',MODE==='re'?'두 사람 모두 충이 없는 날':'내 일지 충이 없는 날'));
  if(MODE==='re'){ H.push(K.sec('다시 만난다면 지킬 것',`<div class="pk-cards">${(C.keep||[]).slice(0,3).map((k,i)=>`<div class="pk-card"><b>${i+1}</b><div><p class="pk-ct">${t(k.t)}</p><p>${t(k.d)}</p></div></div>`).join('')}</div>`)); H.push(K.sec('놓아야 할 신호',ps(C.sign))); }
  else { H.push(K.sec('만나는 장면',ps(C.scene))); H.push(K.sec('연애할 때 내 패턴',ps(C.mine))); }
  H.push(K.letter(C.letter||[],{title:CFG.who+'의 편지',name:CFG.who},CFG.seal,nk));
  H.push(`<p class="pk-note" style="margin:14px 0 0">${ST.ai?`이 노트는 만세력 계산 근거만 재료로 AI가 ${CFG.who}의 말투로 쓴 글이에요. 명리 전문가 감수 전 원고예요`:`이 부분은 해석 사전으로 조립한 초안이에요. 정식 서비스에서는 같은 근거로 ${CFG.who}가 길게 써 줘요`}</p>`);
  return H.join(''); }
function renderPrem(){ const host=$('lprem'); K.keepOpen(host,()=>{ host.innerHTML=build(); }); K.status($('lvst'),Object.assign({who:CFG.who+'가 노트'},ST)); }
function openPrem(){ const host=$('lprem'); D.days=days(); C=K.gl(draft()); ST={}; host.className='pkx dark'; host.style.setProperty('--pk-acc','var(--a)'); host.hidden=false; K.bind(host); renderPrem();
  const f=host.querySelector('.pk-row.pk-hi'); if(f) f.classList.add('open');
  K.runAI({key:D.key,ver:'v1',parts:prompts(),apply,rerender:renderPrem,S:ST}); }
