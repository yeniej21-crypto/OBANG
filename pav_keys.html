<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>정자 메인 컷 비교</title>

<script>document.addEventListener('click',e=>{const i=e.target.closest('figure img');const z=document.getElementById('z');if(i){document.getElementById('zi').src=i.src;z.classList.add('on');}else if(e.target.closest('#z'))z.classList.remove('on');});</script></body></html>
