<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부적 카드 · 오방사주</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&family=Song+Myung&display=swap">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 부적 카드 — 내 사주에 모자란 기운의 미니가 사는 부적을, 모으는 수집 카드로. 카드 그림(img/card/{el}.jpg) 위에 이름·용도·날짜는 코드로 얹는다.
   기울이면 홀로그램 광택(depth3d.js holo). 희귀도: 일반 · 레어(금빛) · 홀로(무지개). */
:root{
  --brush:'OBrush','Song Myung',serif; --bmj:'Song Myung','Noto Serif KR',serif; --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --paper:#fbf8f3; --paper2:#f4eee4; --ink:#1f1a15; --ink2:#5d544a; --ink3:#8a8178; --red:#c8372d; --gold:#b8862f; --line:rgba(60,40,20,.1);
  --c:#3f9f6e; --cp:#e2f1e7; color-scheme:light;
  /* 카드 그림 속 빈칸 위치(%) — 그림 확인 후 맞춤 */
  
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#efe9df;color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button{font-family:inherit;cursor:pointer}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:var(--paper);overflow:hidden}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0;box-shadow:0 30px 80px rgba(60,40,20,.18)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.top{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:18px;height:18px}
.top b{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--ink2)}
.wrap{padding:calc(env(safe-area-inset-top,0px) + 64px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);background:radial-gradient(90% 38% at 50% 30%,var(--cp),rgba(251,248,243,0) 70%)}
.hd .k{font-size:11.5px;font-weight:800;letter-spacing:.2em;color:var(--red)}
.hd h1{margin:8px 0 4px;font-family:var(--brush);font-weight:400;font-size:44px;line-height:1.08}
.hd p{margin:0;font-family:var(--bmj);font-size:16px;color:var(--ink2)}

/* 카드 */
.cardW{position:relative;margin:22px auto 0;width:min(78vw,320px);perspective:1000px}
.card{position:relative;width:100%;aspect-ratio:648/1046;border-radius:8px!important;overflow:hidden;background:#e9dfb8 center/cover no-repeat;box-shadow:0 18px 40px rgba(60,40,20,.28),0 2px 0 rgba(255,255,255,.6) inset;transform-style:preserve-3d;transition:transform .2s}
.card .face{position:absolute;inset:0;border-radius:inherit}
.card .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;background:linear-gradient(115deg,rgba(255,0,128,0) 20%,rgba(255,120,120,.5) 32%,rgba(255,230,120,.55) 40%,rgba(120,255,200,.5) 48%,rgba(120,180,255,.5) 56%,rgba(220,140,255,.45) 64%,rgba(255,0,128,0) 76%);background-size:250% 250%;background-position:var(--sx,50%) var(--sy,50%);transition:opacity .4s}
.card.r2 .foil{opacity:.55;mix-blend-mode:soft-light;background:linear-gradient(115deg,rgba(255,215,120,0) 25%,rgba(255,215,130,.75) 45%,rgba(255,245,210,.9) 50%,rgba(255,200,110,.7) 55%,rgba(255,215,120,0) 75%);background-size:250% 250%;background-position:var(--sx,50%) var(--sy,50%)}
.card.r3 .foil{opacity:.55}
.card .seal{position:absolute;left:42.7%;width:14.6%;top:86.5%;height:8.3%;z-index:4;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(9px,2.7vw,12px);line-height:1;letter-spacing:.02em;color:#b0231a;opacity:.92;mix-blend-mode:multiply}
/* 카드 케이스(슬랩) + 라벨: 먹색 라벨 · 붉은 도장 속 용도 문양 · 금빛 글자 */
.slab{position:relative;padding:9px;background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(236,230,220,.6));box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),inset 0 0 0 2px rgba(120,100,70,.08),0 22px 44px rgba(60,40,20,.2)}
.slab::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.35) 46%,rgba(255,255,255,0) 54%);z-index:6}
.label{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;margin-bottom:8px;padding:10px 12px 10px 10px;background:#1f1a15;color:#f4ecdc;position:relative}
.label::before{content:"";position:absolute;inset:3px;border:1px solid rgba(214,176,98,.35);pointer-events:none}
.label .mo{width:40px;height:40px;display:grid;place-items:center;background:#c8372d;color:#fbf1dc;box-shadow:inset 0 0 0 2px rgba(255,235,210,.28)}
.label .mo svg{width:26px;height:26px}
.label .lt small{display:block;font-size:10px;font-weight:700;letter-spacing:.24em;color:#d6b062}
.label .lt b{display:block;margin-top:3px;font-family:var(--serif);font-weight:900;font-size:15.5px;letter-spacing:-.01em;color:#fbf5e8}
.label .lt span{display:block;margin-top:2px;font-size:11px;color:rgba(244,236,220,.6)}
.label .lr{text-align:right}
.label .lr em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.16em;padding:4px 8px 3px;color:#f4ecdc;box-shadow:inset 0 0 0 1px rgba(244,236,220,.45)}
.label .lr em.r2{background:linear-gradient(135deg,#f6e3a8,#d9ab4f);color:#2a1c05;box-shadow:none}
.label .lr em.r3{background:linear-gradient(120deg,#ffc6d9,#fff0a8,#b8f5dc,#bcd6ff,#e6c4ff);color:#2b2230;box-shadow:none}
.label .lr span{display:block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.06em;color:rgba(244,236,220,.55)}
.rar{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:14px}
.rar span{font-size:11.5px;font-weight:800;letter-spacing:.14em;padding:5px 10px;background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.rar span.r2{background:linear-gradient(135deg,#f6e3a8,#d9ab4f);color:#3a2708;box-shadow:none}
.rar span.r3{background:linear-gradient(120deg,#ffc6d9,#fff0a8,#b8f5dc,#bcd6ff,#e6c4ff);color:#2b2230;box-shadow:none}
.rar small{font-size:12px;color:var(--ink3)}
.tilt{margin:8px 0 0;text-align:center;font-size:12px;color:var(--ink3)}

/* 용도 */
.lab{margin:22px 2px 8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.uses{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.uses button{height:40px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13.5px;font-weight:500}
.uses button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.lab small{margin-left:4px;font-size:11.5px;font-weight:700;color:var(--c)}
.els{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.els button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;font-weight:500}
.els button i{width:42px;height:42px;border-radius:50%!important;background:#eee center 18%/cover no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3px transparent;transition:box-shadow .2s}
.els button.on{border-color:var(--ink);color:var(--ink);font-weight:800}
.els button.on i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.els button.low::after{content:"추천";position:absolute;top:4px;right:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--red);padding:2px 4px 1px}
.bless{margin-top:12px;background:#fff;padding:15px 16px}
.bless small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--c)}
.bless p{margin:6px 0 0;font-family:var(--bmj);font-size:18px;line-height:1.55}
/* 근거 */
.why{margin-top:26px;padding:22px 2px 4px;border-top:1px solid var(--line)}
.why h3{margin:0 0 16px;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.wm{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wm div{padding:10px 0 9px;text-align:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.wm b{display:block;font-family:var(--serif);font-size:20px;font-weight:900;color:var(--ink);line-height:1.1}
.wm span{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ink3)}
.wm .lo{background:var(--c);box-shadow:none}
.wm .lo b,.wm .lo span{color:#fff}
.wmT{margin:12px 0 0;font-size:15px;line-height:1.6;color:var(--ink);font-weight:500}
.wmT b{color:var(--c);font-weight:800}
.why ul{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.why li:last-child{grid-column:1/-1}
.why li small{display:block;font-size:12px;font-weight:800;color:var(--c);letter-spacing:.02em}
.why li span{display:block;margin-top:4px;font-size:14px;line-height:1.55;color:var(--ink2)}
.luck{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.luck div{padding:13px 4px;text-align:center}
.luck div+div{border-left:1px solid var(--line)}
.luck small{display:block;font-size:12px;color:var(--ink3);font-weight:700}
.luck b{display:block;margin-top:3px;font-size:16px;font-weight:800;color:var(--ink)}
.row2{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:50px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:14.5px}
.btn.pr{border:0;background:var(--ink);color:#fff}
/* 도감 */
.col{margin-top:22px}
.col h3{display:flex;justify-content:space-between;margin:0 2px 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.col h3 small{font-weight:500;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid div{position:relative;aspect-ratio:648/1046;background:#ebe4d8;overflow:hidden}
.grid div.has{background:#e9dfb8 center/cover no-repeat}
.grid div.lock::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--bmj);font-size:22px;color:#c2b8a8}
.grid div i{position:absolute;left:0;right:0;bottom:0;padding:3px 0;text-align:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;background:rgba(31,26,21,.72)}
.grid div.r3::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,198,217,.35),rgba(255,240,168,.35),rgba(184,245,220,.35),rgba(188,214,255,.35));mix-blend-mode:color-dodge}
.price{margin:18px 0 0;text-align:center;font-size:12px;line-height:1.6;color:var(--ink3)}
.price b{color:var(--red)}
.sheet{position:absolute;inset:0;z-index:90;background:rgba(20,16,12,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.sheet.on{display:flex}
.sheet img{max-height:70vh;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet .row2{width:100%;max-width:330px;margin:0}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:95;background:rgba(31,26,21,.92);color:#fff;font-size:13.5px;padding:10px 16px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hsh,.hgl{display:none}

/* 케이스 모서리에 매달린 용도 장식 — 액막이는 실로 엮은 굴비 + 소금 종지 */
.charm{position:absolute;right:-34px;top:-6px;z-index:8;width:44px;height:82px;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(60,40,20,.25))}
.charm svg{width:100%;height:100%}
@keyframes swing{50%{transform:rotate(-7deg)}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top"><button class="ib" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b>OBANG · 부적 카드</b></div>
  <div class="scr"><div class="wrap">
    <div class="hd"><div class="k">NEW · 하루 한 장</div><h1>오늘의 부적 카드</h1><p>내 사주에 모자란 기운이, 부적 속에 산다</p></div>
    <div class="cardW"><div class="charm" id="charm"></div><div class="slab"><div class="label"><i class="mo" id="cMo"></i><div class="lt"><small id="cK"></small><b id="cT"></b><span id="cB"></span></div><div class="lr"><em id="cR"></em><span id="cN"></span></div></div><div class="card" id="card"><div class="face" id="face"></div><div class="foil" id="foil"></div><div class="seal" id="cS"></div></div></div></div>
    <div class="rar"><span id="rar"></span><small id="rarS"></small></div>
    <p class="tilt">폰을 기울이면 부적이 반짝여요</p>

    <div class="lab">누구의 부적으로 받을까 <small id="elHint"></small></div>
    <div class="els" id="els"><button data-k="wood" type="button"><i style="background-image:url('img/mini/wood.jpg')"></i><span>하람</span></button><button data-k="fire" type="button"><i style="background-image:url('img/mini/fire.jpg')"></i><span>이안</span></button><button data-k="earth" type="button"><i style="background-image:url('img/mini/earth.jpg')"></i><span>도준</span></button><button data-k="metal" type="button"><i style="background-image:url('img/mini/metal.jpg')"></i><span>시온</span></button><button data-k="water" type="button"><i style="background-image:url('img/mini/water.jpg')"></i><span>재이</span></button></div>
    <div class="lab">무엇을 빌어 볼까</div>
    <div class="uses" id="uses"><button data-k="money" type="button">재물</button><button class="on" data-k="love" type="button">인연</button><button data-k="pass" type="button">합격</button><button data-k="health" type="button">건강</button><button data-k="guard" type="button">액막이</button></div>
    <div class="bless"><small id="bK"></small><p id="bT"></p></div>

    <div class="why"><h3>이 부적은 이렇게 그렸어요</h3><div id="whyM"></div><ul id="whyL"></ul><div class="luck" id="whyK"></div></div>

    <div class="row2"><button class="btn pr" id="save" type="button">카드 저장</button><button class="btn" id="wall" type="button">배경화면으로 받기</button></div>

    <div class="col"><h3>모은 부적 <small id="colN"></small></h3><div class="grid" id="grid"></div></div>
    <p class="price">정식 오픈 때 <b>990원</b> · 체험판에서는 무료로 모을 수 있어요</p>
  </div></div>
  <div class="sheet" id="sheet"><img id="shImg" alt="부적 카드 이미지"><div class="row2"><button class="btn pr" id="shDl" type="button">이미지 받기</button><button class="btn" id="shX" type="button">닫기</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="saju.js"></script>
<script>
const $=id=>document.getElementById(id);
const EL={
  wood:{k:'木',r:'목',n:'하람',god:'청룡',godH:'靑龍',dirH:'東',dir:'동쪽',num:'3 · 8',color:'초록',c:'#3f9f6e',p:'#e2f1e7',hold:'새싹',line:'붉은 선',top:['북두칠성','예부터 부적에 넣던 수명과 복의 별'],sang:'물이 나무를 키워요. 물 가까이, 파란 소품이 힘이 돼요',seal:[86.5,8.3],ink:'#b0231a',blend:'multiply'},
  fire:{k:'火',r:'화',n:'이안',god:'주작',godH:'朱雀',dirH:'南',dir:'남쪽',num:'2 · 7',color:'빨강',c:'#c8432f',p:'#f7e0d8',hold:'불씨',line:'금빛 선',top:['해','불의 기운이 가장 센 한낮의 해'],sang:'나무가 불을 살려요. 초록 식물이 이안의 불씨가 돼요',seal:[84.9,10],ink:'#f0c865',blend:'normal'},
  earth:{k:'土',r:'토',n:'도준',god:'황룡',godH:'黃龍',dirH:'中',dir:'가운데',num:'5 · 10',color:'노랑',c:'#b8862f',p:'#f4ead0',hold:'엽전 항아리',line:'붉은 선',top:['산','흙이 쌓여 이룬 든든한 산'],sang:'불이 타고 남은 재가 흙이 돼요. 따뜻한 빛, 붉은 소품이 힘이 돼요',seal:[87,8.4],ink:'#b0231a',blend:'multiply'},
  metal:{k:'金',r:'금',n:'시온',god:'백호',godH:'白虎',dirH:'西',dir:'서쪽',num:'4 · 9',color:'흰색',c:'#7d8591',p:'#eceef1',hold:'방울',line:'붉은 선',top:['방울','맑은 소리로 삿된 기운을 쫓는 방울'],sang:'흙 속에서 쇠가 나와요. 노란빛, 도자기가 힘이 돼요',seal:[88.6,7.9],ink:'#b0231a',blend:'multiply'},
  water:{k:'水',r:'수',n:'재이',god:'현무',godH:'玄武',dirH:'北',dir:'북쪽',num:'1 · 6',color:'남색',c:'#2f4a7a',p:'#dfe5ef',hold:'물방울 구슬',line:'은빛 선',top:['달과 비','물의 기운을 모으는 밤의 달과 빗방울'],sang:'쇠에 맺힌 이슬이 물이 돼요. 은빛, 흰 소품이 힘이 돼요',seal:[86.5,8.9],ink:'#e6ecf5',blend:'normal'}};
Object.keys(EL).forEach(k=>EL[k].img=`img/card/${k}.jpg`);
const ELK=['wood','fire','earth','metal','water'], ELN={wood:'木',fire:'火',earth:'土',metal:'金',water:'水'};
/* 받침 있으면 이/은/을, 없으면 가/는/를 */
const bt=w=>{ const c=w.charCodeAt(w.length-1)-0xac00; return c>=0&&c<11172&&c%28!==0; };
const jo=(w,a,b)=>w+(bt(w)?a:b);
/* 용도: [이름, 문양 이름, 문양 뜻] + 기운마다 다른 한마디 */

async function drawCard(x,X,Y,W,H){ const e=EL[el], m=me(), u=USE[use], r=rarity(); const im=await loadImg(e.img); x.save(); x.beginPath(); x.rect(X,Y,W,H); x.clip(); x.drawImage(im,X,Y,W,H);
