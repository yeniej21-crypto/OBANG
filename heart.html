<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="early.js?v=4"></script>
<title>그 사람 속마음 · 시온의 은거울</title>
<meta name="description" content="시온이 은거울로 그 사람의 결과 요즘, 둘 사이를 사주로 비춰 줘요">
<meta property="og:type" content="website"><meta property="og:site_name" content="오방도감">
<meta property="og:title" content="그 사람 속마음 · 시온의 은거울"><meta property="og:description" content="생일 하나면 그 사람의 결과 요즘이 은거울에 비쳐요">
<meta property="og:image" content="https://obangsaju.netlify.app/img/og/home.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://obangsaju.netlify.app/heart.html"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;700;900&display=swap">
<script src="vidguard.js?v=1"></script>
<style>
/* 그 사람 속마음 · 시온의 은거울(10/3): 시온 영상으로 들어서기 → 대화로 묻기 → 김 서린 은거울 닦기 → 무료 풀이(근거 표시) → 시온의 은거울 리포트(19,900원).
   색: 밤의 남흑 + 은빛 달빛 + 촛불의 금빛 조금. 모서리는 각지게(원만 둥글게). 빛은 실제 광원(달빛 반사 · 촛불)만, 반짝이 입자 금지. */
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#07090d;--bg2:#0c1016;--line:rgba(214,222,232,.11);--line2:rgba(214,222,232,.24);--ink:#eef1f5;--ink2:#c4cbd4;--ink3:#868f9a;
  --silver:#c9d1dc;--silver2:#e9eef4;--gold:#d9b46a;--gold2:#ecd29a;--metal:#c9d1dc;
  --serif:'Noto Serif KR',serif;--brush:'OBrush','Noto Serif KR',serif;--sans:'Noto Sans KR',"Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000}
body{font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,select,input{font-family:inherit;color:inherit}
.stage{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .9s ease;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{opacity:1;pointer-events:auto}
/* 맨 위 */
.top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;transition:background .4s;pointer-events:none}
.top>*{pointer-events:auto}
.top.sc{background:linear-gradient(180deg,rgba(7,9,13,.97) 72%,rgba(7,9,13,0))}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(7,9,13,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:18px;height:18px}
.ib.off .wv{display:none}.ib:not(.off) .mx{display:none}
.top b{font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--silver2);opacity:0;transition:opacity .4s}
.top.t b{opacity:1}

/* ---------- 1. 들어서기 ---------- */
#sIn{background:#000}
.ibg{position:absolute;inset:0;background:url('https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/2bf60153-6138-439e-854a-a22ef5e28c37.jpg') center 30%/cover no-repeat,url('img/sion.jpg') center 22%/cover no-repeat;transform:scale(1.06);animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.11) translateY(-1.2%)}}
#iv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:0;transition:opacity .7s}
#iv.on{opacity:1}
.ish{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,13,.6) 0,rgba(7,9,13,0) 18%,rgba(7,9,13,0) 44%,rgba(7,9,13,.78) 72%,var(--bg) 100%);pointer-events:none}
.itx{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:2;transition:opacity .7s,transform .7s}
#sIn.play .itx{opacity:0;transform:translateY(10px);pointer-events:none}
.itx small{display:block;font-size:11px;letter-spacing:.32em;color:var(--silver);font-weight:700}
.itx h1{margin:12px 0 0;font-family:var(--brush);font-weight:400;font-size:54px;line-height:1.02;color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.7)}
.itx h2{margin:10px 0 0;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.06em;color:var(--silver2)}
.itx p{margin:12px 0 0;font-size:14px;line-height:1.65;color:var(--ink2)}
.itx .from{display:inline-block;margin-bottom:10px;padding:4px 9px;border:1px solid var(--line2);font-size:11.5px;color:var(--gold2)}
.go{display:block;width:100%;height:54px;border:0;background:linear-gradient(180deg,#eef2f6,#b7c0cb);color:#0a0d11;font-size:15.5px;font-weight:800;letter-spacing:.03em;cursor:pointer}
.go:active{transform:scale(.985)}
.go.gl{background:none;border:1px solid var(--silver);color:var(--silver2);font-weight:700}
.lnk{display:block;margin:12px auto 0;padding:6px 10px;border:0;background:none;font-size:13px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.itx .go{margin-top:22px}
.sub{position:absolute;left:24px;right:24px;bottom:22%;z-index:3;text-align:center;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.5;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.95);opacity:0;transition:opacity .3s}
.sub.on{opacity:1}

/* ---------- 2. 대화 ---------- */
.tbg{position:absolute;inset:0;background:url('https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/12fc7564-0053-4b5f-9520-68c1a894eba0.jpg') center 26%/cover no-repeat,url('img/sion.jpg') center 16%/cover no-repeat;animation:kb 30s ease-in-out infinite alternate;filter:brightness(.86)}
.tlt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 6% 96%,rgba(255,196,120,.2),rgba(255,196,120,0) 42%);animation:fl 5.5s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.75}22%{opacity:.95}38%{opacity:.7}61%{opacity:1}80%{opacity:.82}}
.tsh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,9,13,.55) 0,rgba(7,9,13,0) 14%,rgba(7,9,13,0) 30%,rgba(7,9,13,.82) 56%,rgba(7,9,13,.97) 78%)}
#sTalk{overflow:hidden}
.talk{position:absolute;inset:0;z-index:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 70px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.talk::-webkit-scrollbar{display:none}
.msgs{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.ln{opacity:0;transform:translateY(10px);max-height:240px;overflow:hidden;transition:opacity .8s ease,transform .8s ease,font-size .5s,color .5s,max-height .6s ease .25s,margin .6s ease .25s}
.ln.on{opacity:1;transform:none}
.ln.gone{opacity:0!important;max-height:0;margin:0!important;transition:opacity .4s ease,max-height .6s ease .3s,margin .6s ease .3s}
.ln.n{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.55;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85)}
.ln.n small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:var(--silver);font-weight:700;margin-bottom:4px}
.ln.n.old{font-size:15.5px;color:rgba(238,241,245,.42)}
.ln.n.old small{display:none}
.ln.me{align-self:flex-end;max-width:85%;text-align:right;font-size:14.5px;color:var(--gold2)}
.ln.me:before{content:"";display:inline-block;width:18px;height:1px;background:var(--gold);vertical-align:middle;margin-right:8px;opacity:.7}
.ln.me.old{opacity:.4}
.ask{margin-top:18px;display:none}
.ask.on{display:block;animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 15px;border:1px solid var(--line2);background:rgba(7,9,13,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:14.5px;cursor:pointer;transition:border-color .2s,background .2s}
.chips button:active,.chips button:hover{border-color:var(--silver);background:rgba(201,209,220,.1)}
.pick{display:grid;gap:10px}
.seg{display:flex;border-bottom:1px solid var(--line2)}
.seg button{flex:1;height:42px;border:0;background:none;color:var(--ink3);font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--silver2);font-weight:700;border-bottom-color:var(--silver)}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:end}
.pick select{height:46px;border:0;border-bottom:1px solid rgba(201,209,220,.5);background:transparent;color:#fff;font-family:var(--serif);font-size:16px;padding:0 4px;width:100%;border-radius:0;-webkit-appearance:none;appearance:none}
.pick select option{background:#10141a;color:var(--ink)}
.pick .go{margin-top:6px}
.pick .lnk{margin-top:2px}

/* ---------- 3. 은거울 닦기 ---------- */
.mbg{position:absolute;inset:-20px;background:url('https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/af566d6d-84c2-4346-b695-8218e8e3cdbf.jpg') center 60%/cover no-repeat;filter:blur(16px) brightness(.32) saturate(.7)}
.mbg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(201,209,220,.08),rgba(7,9,13,.6) 70%)}
.mw{position:relative;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.mw .mk{font-size:11px;letter-spacing:.32em;color:var(--silver);font-weight:700}
.mw .mt{margin:8px 0 26px;font-family:var(--serif);font-size:19px;font-weight:600;text-align:center;line-height:1.55;min-height:3.1em}
.mirror{--ms:min(72vw,300px,40vh);position:relative;touch-action:none;cursor:pointer;width:var(--ms);height:var(--ms);margin-bottom:84px}
.mirror:before,.mirror:after{pointer-events:none}
.mirror:before{content:"";position:absolute;inset:-13px;border-radius:50%;background:conic-gradient(from 210deg,#5d6570,#eef2f6,#87909c,#f6f8fa,#6c7581,#d3d9e1,#59616c,#c8cfd8,#5d6570);box-shadow:0 26px 60px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08)}
.mirror:after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(217,180,106,.55),0 0 0 1px rgba(0,0,0,.6)}
.hdl{position:absolute;left:50%;top:calc(100% + 10px);width:24px;height:76px;transform:translateX(-50%);background:linear-gradient(90deg,#4f5761,#e4e9ef 45%,#8a939e 70%,#4f5761)}
.hdl:before{content:"";position:absolute;left:-8px;right:-8px;top:0;height:10px;background:linear-gradient(90deg,#59616c,#eef2f6 48%,#7d8692)}
.hdl:after{content:"";position:absolute;left:4px;right:4px;bottom:10px;height:1px;background:rgba(217,180,106,.7);box-shadow:0 -40px 0 rgba(217,180,106,.5)}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 36% 30%,#3d4652 0%,#1b222b 52%,#0b0f14 100%);box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.12)}
.sheen{position:absolute;inset:-30%;background:linear-gradient(118deg,rgba(233,238,244,0) 38%,rgba(233,238,244,.12) 47%,rgba(233,238,244,0) 56%);animation:sh 9s ease-in-out infinite;pointer-events:none}
@keyframes sh{0%,100%{transform:translateX(-14%)}50%{transform:translateX(14%)}}
.moon{position:absolute;left:18%;top:12%;width:46%;height:30%;border-radius:50%;background:radial-gradient(ellipse,rgba(225,232,240,.14),rgba(225,232,240,0) 70%);pointer-events:none}
.mf{position:absolute;inset:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:.5;filter:blur(1.2px);transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease;transform:scale(.97)}
.mf small{font-size:10.5px;letter-spacing:.3em;color:var(--silver);font-weight:700}
.mf b{display:block;margin-top:10px;font-family:var(--serif);font-weight:900;font-size:clamp(20px,6.4vw,26px);line-height:1.32;color:#f4f6f9}
.mf em{display:block;margin-top:10px;font-style:normal;font-size:12.5px;color:var(--gold2);letter-spacing:.04em}
.mirror.clear .mf{opacity:1;filter:none;transform:none}
.mirror.clear .mf b{text-shadow:0 0 22px rgba(201,209,220,.35)}
#fog{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;touch-action:none;cursor:pointer;transition:opacity 1.5s ease}
#fog.gone{opacity:0;pointer-events:none}
.ring{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:.7}
.ring .bg{stroke:rgba(201,209,220,.12)}
.ring .fg{stroke:var(--gold);stroke-linecap:butt;transition:stroke-dashoffset .25s}
.mh{font-size:13px;color:var(--ink3);text-align:center;min-height:20px}
.mbt{width:100%;max-width:320px;margin-top:16px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .8s,transform .8s}
.mbt.on{opacity:1;transform:none;pointer-events:auto}

/* ---------- 4. 결과 ---------- */
#sRes{background:var(--bg)}
.hero{position:relative;height:calc(var(--sh,100vh)*.7);min-height:430px;overflow:hidden}
.hero .ph{position:absolute;left:0;right:0;top:-4%;bottom:-4%;background:url('https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/b5576885-c4a8-4c6b-b25b-79dbc95a20e0.jpg') center 24%/cover no-repeat,url('img/sion.jpg') center 18%/cover no-repeat;will-change:transform}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,13,.55) 0,rgba(7,9,13,0) 20%,rgba(7,9,13,.15) 45%,rgba(7,9,13,.88) 80%,var(--bg) 100%)}
.hero .ct{position:absolute;left:20px;right:20px;bottom:20px;z-index:1}
.hero small{display:block;font-size:11px;letter-spacing:.3em;color:var(--silver);font-weight:700}
.hero h1{margin:10px 0 0;font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.28;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hero p{margin:10px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
.hero p i{font-style:normal;color:var(--gold2)}
.wrap{padding:0 16px}
.cd{position:relative;margin-top:12px;padding:20px 18px 18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(201,209,220,.055),rgba(201,209,220,.015))}
.cd:first-child{margin-top:4px}
.cd>small{display:block;font-size:11px;letter-spacing:.2em;color:var(--silver);font-weight:700}
.cd h3{margin:8px 0 0;font-family:var(--serif);font-size:21px;font-weight:900;line-height:1.38}
.cd p{margin:10px 0 0;font-size:14.5px;line-height:1.78;color:var(--ink2)}
.cd p.q{color:var(--ink);padding-left:12px;border-left:1px solid var(--gold)}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ev span{font-size:11.5px;line-height:1.4;padding:4px 8px;border:1px solid rgba(217,180,106,.3);color:rgba(236,210,154,.88)}
.ev em{font-style:normal;font-size:11px;color:var(--ink3);margin-right:2px;align-self:center}
.one{margin:26px 4px 0;padding:4px 0 4px 16px;border-left:2px solid var(--gold)}
.one small{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold2);font-weight:700}
.one p{margin:6px 0 0;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.6}
.cta2{margin-top:14px}
.more{margin:30px 0 0;text-align:center}
.more p{margin:0 0 12px;font-size:13px;color:var(--ink3);line-height:1.6}
.rv{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
/* 잠긴 리포트 */
.lock,.pm{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 58px)}
.lock{margin-top:30px;padding:22px 18px 20px;border:1px solid rgba(217,180,106,.35);background:linear-gradient(180deg,rgba(217,180,106,.07),rgba(201,209,220,.02))}
.lock .lh small{display:block;font-size:11px;letter-spacing:.24em;color:var(--gold2);font-weight:700}
.lock .lh b{display:block;margin-top:8px;font-family:var(--serif);font-size:22px;font-weight:900}
.lock .lh p{margin:8px 0 0;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.lk{list-style:none;margin:16px 0 18px;padding:0;display:grid;gap:1px;background:var(--line)}
.lk li{display:flex;gap:12px;align-items:flex-start;padding:12px 10px;background:var(--bg2)}
.lk li>span{flex:none;width:24px;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--gold)}
.lk li b{display:block;font-size:14.5px;font-weight:700}
.lk li i{display:block;margin-top:4px;font-style:normal;font-size:12.5px;color:var(--ink3);filter:blur(4.5px);user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.price{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:13px;color:var(--ink3)}
.price b{font-family:var(--serif);font-size:22px;color:var(--ink)}
.fine{margin:10px 0 0;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.6}
/* 리포트 본문 */
.pm{margin-top:30px}
.pm-hd{padding:26px 0 6px;text-align:center;border-top:1px solid var(--line)}
.pm-hd small{display:block;font-size:11px;letter-spacing:.3em;color:var(--gold2);font-weight:700}
.pm-hd b{display:block;margin-top:10px;font-family:var(--serif);font-size:24px;font-weight:900;line-height:1.35}
.pm-hd p{margin:8px 0 0;font-size:12.5px;color:var(--ink3);min-height:1em}
.ps{margin-top:26px}
.ps h4{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-family:var(--serif);font-size:19px;font-weight:900}
.ps h4 span{font-size:13px;color:var(--gold);font-weight:700}
.ps>p{margin:0 0 12px;font-size:14.5px;line-height:1.82;color:var(--ink2)}
.mo{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.mo:last-child{border-bottom:1px solid var(--line)}
.mo .a b{display:block;font-family:var(--serif);font-size:16px;font-weight:900}
.mo .a small{display:block;margin-top:3px;font-size:11px;color:var(--ink3)}
.mo .a em{display:inline-block;margin-top:6px;font-style:normal;font-size:10.5px;padding:2px 5px;border:1px solid var(--line2);color:var(--ink2)}
.mo.hi .a em{border-color:rgba(217,180,106,.6);color:var(--gold2)}
.mo h5{margin:0;font-size:15px;font-weight:700}
.mo p{margin:6px 0 0;font-size:13.5px;line-height:1.72;color:var(--ink2)}
.mo p.tp{color:var(--silver2);font-size:13px}
.mo p.tp:before{content:"한 줄 · ";color:var(--gold)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.dd>div{background:var(--bg2);padding:14px 12px}

 {t:'곧게 서서\n기다리는 사람',s:['좋아하면 티를 내기보다 곁에 오래 서 있는 쪽을 골라.','자존심이 세서 먼저 숙이는 건 늦지만, 한번 정한 마음은 쉽게 꺾지 않는 결이야.'],

 {t:'부드럽게\n감기는 사람',s:['분위기와 말투에 예민하고, 상대 반응을 보면서 조금씩 다가와.','겉으로는 맞춰 주는 것 같아도 서운한 건 오래 기억하는 쪽이야.'],

 {t:'숨기지\n못하는 사람',s:['좋으면 얼굴과 말에 바로 드러나는 편이야.','대신 식을 때도 빠르게 티가 나서, 연락의 온도가 마음의 온도에 가까운 쪽이야.'],

function clip(v,sub,src,lines,dur){ return new Promise(res=>{ let done=false, timerOn=false, tk=0, sf=0, last='';

  const timer=()=>{ if(timerOn||done) return; timerOn=true; try{ v.pause(); }catch(e){} v.classList.remove('on'); const t0=performance.now(); tk=setInterval(()=>{ const t=(performance.now()-t0)/1000; setSub(t); if(t>=dur+.4) fin(); },80); };

  pm.onclick=e=>{ const cp=e.target.closest('[data-copy]'); if(cp){ const t=C.msgs[+cp.dataset.copy]; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어'),()=>toast('길게 눌러 복사해 줘')); return; }
    const dy=e.target.closest('[data-day]'); if(dy){ const o=R.days[+dy.dataset.day]; if(window.ObNotify) ObNotify.ask({title:'다시 볼 날 알림',img:'img/sion.jpg',head:`${o.m}월 ${o.d}일 ${DOW[o.w]}요일`,sub:'그날 아침에 시온이 알려 줄게요'}); else toast(`${o.m}월 ${o.d}일, 기억해 둬`); } }; }

/* ---------- 보관함 저장 (archive.js와 같은 저장 형식) ---------- */
function archive(){ try{ const r=R, it={id:'heart|'+r.key,k:'heart',menu:'그 사람 속마음',h:r.Q?r.ST.t.replace('\n',' '):'네 쪽의 은거울',s:'',sub:r.Q?`${Q1[A.q1]} · ${r.head}`:`${Q1[A.q1]} · 생일 모름`,
    lines:[r.Q?r.ST.s[0]:SPOUSE[r.myPg][1],oneLine()],img:new URL('img/sion.jpg',location.href).href,url:location.href.split('#')[0],me:A.me,form:null,re:false,at:Date.now()};
  const KEY='obArch'; let a=[]; for(const st of ['localStorage','sessionStorage']){ try{ const v=window[st].getItem(KEY); if(v){ a=JSON.parse(v)||[]; break; } }catch(e){} }
  a=a.filter(x=>x.id!==it.id); a.unshift(it); const s=JSON.stringify(a.slice(0,40)); ['localStorage','sessionStorage'].forEach(st=>{ try{ window[st].setItem(KEY,s); }catch(e){} }); }catch(e){} }

/* ---------- 끝: 초대 공유 · 다시 ---------- */
function invite(){ if(window.ObShare) ObShare.sheet({src:'img/sion.jpg',name:'sion.jpg',invite:true,head:'이 은거울, 너도 볼래',title:'그 사람 속마음 · 시온의 은거울',text:'시온이 은거울로 그 사람의 결을 비춰 줘. 너도 봐 봐',note:'친구는 링크로 바로 들어와 자기 얘기로 은거울을 볼 수 있어요. 내 결과는 보내지지 않아요. 정식 오픈 뒤에는 친구가 들어오면 둘 다 할인 쿠폰을 받아요.'}); else toast('공유 준비 중이야'); }
$('shareBtn').onclick=invite;
$('again').onclick=()=>{ show('sTalk'); interview(); };
$('toLove').onclick=()=>{ location.href='love.html'; };
})();
