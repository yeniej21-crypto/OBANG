<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오방 궁합 · 오방사주</title>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&family=Song+Myung&display=swap">
<link rel="stylesheet" href="premkit.css">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 오방 궁합 — 다섯 수호신과 내 사주의 궁합 순위. 신마다 정해 둔 일주(甲寅·丙午·戊辰·庚申·壬子)와 내 사주를 맞대 본다. */
:root{
  --brush:'OBrush','Noto Serif KR',serif; --bmj:'Song Myung','Noto Serif KR',serif; --serif:'Noto Serif KR',serif;
  --bg:#07060a; --stage:#18141b; --card:#231e27; --line:rgba(255,240,220,.1); --line-2:rgba(227,184,102,.32);
  --ink:#f6f1ea; --ink-2:#d0c7bb; --ink-3:#8e867c; --gold:#e3b866; --gold-2:#f3d79b;
  --sans:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --c:var(--gold); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,select,input{font-family:inherit}
.stage{position:relative;width:100%;max-width:460px;height:100%;background:var(--stage);overflow:hidden}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0;border-radius:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .45s}
.scr::-webkit-scrollbar{display:none}
.scr.on{opacity:1;pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,8,12,.5);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:#fff}
.ib svg{width:18px;height:18px}
.top b{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,236,200,.92);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.wrap{padding:0 16px calc(env(safe-area-inset-bottom,0px) + 34px)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:95;background:rgba(0,0,0,.86);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:0;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hero{position:relative;height:58vh;min-height:380px;max-height:540px;margin:0 -16px 8px;background:#000 url('img/kv_house.jpg') center 30%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,.5),rgba(12,10,15,0) 26%,rgba(12,10,15,.4) 60%,var(--stage) 98%)}
.hero .t{position:absolute;left:18px;right:18px;bottom:8px;z-index:3}
.kick{font:800 11px/1 var(--sans);letter-spacing:.28em;color:var(--gold-2)}
.hero h1{font-family:var(--brush);font-weight:400;font-size:42px;line-height:1.14;margin:10px 0 6px;text-shadow:0 3px 20px rgba(0,0,0,.8)}
.hero p{margin:0;font-family:var(--bmj);font-size:16px;color:var(--ink-2);line-height:1.5}
.five{display:flex;justify-content:center;gap:8px;margin:14px 0 14px}
.five span{width:52px;height:52px;border-radius:50%;background:#000 center 20%/cover no-repeat;box-shadow:0 0 0 1.5px var(--cc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:15px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.meQ{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(227,184,102,.12),rgba(227,184,102,.04));border-radius:0;padding:14px;color:var(--ink);cursor:pointer;margin-bottom:10px}
.meQ .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;color:#1a1208;background:linear-gradient(180deg,#f3d79b,#d6a64f);flex:none}
.meQ b{display:block;font-size:15.5px}.meQ small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.meQ i{margin-left:auto;font-style:normal;color:var(--gold-2);font-weight:800}
.other{display:block;margin:4px auto 12px;border:0;background:none;color:var(--ink-3);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:rgba(255,255,255,.03)}
.seg button{flex:1;height:40px;border:0;background:none;color:var(--ink-2);font-size:13.5px;cursor:pointer}
.seg button.on{background:rgba(227,184,102,.18);color:var(--gold-2);font-weight:700}
.g3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:8px}
select,input[type=text]{height:44px;border-radius:0;border:1px solid var(--line);background:#1a171d;color:var(--ink);font-size:15px;padding:0 10px;width:100%;min-width:0}
.go{width:100%;height:54px;border:0;border-radius:0;background:linear-gradient(180deg,#f0cf85,#d6a64f);color:#17120a;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(227,184,102,.25)}
.fine{font-size:11.5px;color:var(--ink-3);text-align:center;margin:10px 0 0;line-height:1.6}
#form[hidden]{display:none}
/* 로딩: 다섯 신이 원을 돌며 하나씩 켜짐 */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.orb{position:relative;width:250px;height:250px;margin-bottom:24px}
.orb span{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#000 center 20%/cover no-repeat;box-shadow:0 0 0 1.5px rgba(255,255,255,.15);filter:grayscale(1) brightness(.5);transition:all .35s}
.orb span.on{filter:none;box-shadow:0 0 0 2px var(--cc),0 0 26px var(--cc)}
.orb b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:900;font-size:40px;color:var(--gold-2)}
.ld h2{font-family:var(--bmj);font-weight:400;font-size:20px;margin:0 0 8px}
.ld p{margin:0;color:var(--ink-3);font-size:13.5px;min-height:20px}
/* 결과 */
.win{position:relative;height:60vh;min-height:420px;max-height:560px;margin:0 -16px;background:#000 center 18%/cover no-repeat}
.win:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,.4),rgba(12,10,15,0) 24%,rgba(12,10,15,.25) 55%,var(--stage) 97%)}
.win .t{position:absolute;left:18px;right:18px;bottom:0;z-index:3}
.win .rk{display:inline-flex;align-items:center;gap:6px;font:900 12px/1 var(--sans);letter-spacing:.14em;color:#1a1208;background:linear-gradient(180deg,#f3d79b,#d6a64f);padding:6px 10px;border-radius:0}
.win h1{font-family:var(--brush);font-weight:400;font-size:46px;line-height:1.1;margin:10px 0 4px;text-shadow:0 3px 22px rgba(0,0,0,.9)}
.win h1 small{font-family:var(--serif);font-size:18px;color:var(--gold-2);margin-left:6px}
.win p{margin:0;font-family:var(--bmj);font-size:17px;color:#fff;line-height:1.5;text-shadow:0 2px 12px #000}
.sc{position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(12,10,15,.75),rgba(12,10,15,.35));border:2px solid var(--cc);box-shadow:0 0 30px color-mix(in srgb,var(--cc) 50%,transparent)}
.sc b{display:block;font-family:var(--serif);font-weight:900;font-size:34px;line-height:1;color:#fff}
.sc small{font-size:10.5px;color:var(--ink-2);letter-spacing:.1em}
.box{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;margin-top:12px}
.box h3{margin:0 0 12px;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.box p{margin:0 0 8px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.box p b{color:var(--ink)}
.rank{display:grid;gap:8px}
.ri{display:grid;grid-template-columns:22px 48px 1fr 44px;gap:10px;align-items:center;padding:8px;border-radius:0;background:rgba(255,255,255,.025);border:1px solid transparent}
.ri.first{border-color:color-mix(in srgb,var(--cc) 55%,transparent);background:color-mix(in srgb,var(--cc) 10%,transparent)}
.ri em{font-style:normal;font-family:var(--serif);font-weight:900;font-size:17px;color:var(--gold-2);text-align:center}
.ri .av{width:48px;height:48px;border-radius:50%;background:#000 center 20%/cover no-repeat;box-shadow:0 0 0 1.5px var(--cc)}
.ri b{display:block;font-size:14.5px}.ri b small{font-weight:500;font-size:11.5px;color:var(--ink-3);margin-left:4px}
.ri .bar{display:block;height:6px;border-radius:0;background:rgba(255,255,255,.07);margin:6px 0 4px;overflow:hidden}
.ri .bar u{display:block;height:100%;width:0;border-radius:0;background:var(--cc);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.ri span.l{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .n{font-family:var(--serif);font-weight:900;font-size:18px;text-align:right}
.why{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.why+.why{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.why .ic{width:40px;height:40px;border-radius:0;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent);border:1px solid color-mix(in srgb,var(--cc) 40%,transparent)}
.why b{display:block;font-size:14.5px}.why p{margin:3px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px;border-radius:0;background:linear-gradient(180deg,rgba(227,184,102,.1),rgba(227,184,102,.03));border:1px solid var(--line-2)}
.say .av{width:44px;height:44px;border-radius:50%;flex:none;background:#000 center 20%/cover no-repeat;box-shadow:0 0 0 1.5px var(--gold)}
.say small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gold-2);margin-bottom:3px}
.say p{margin:0;font-family:var(--bmj);font-size:16.5px;line-height:1.55;color:var(--ink)}
.btn2{flex:1;height:48px;border-radius:0;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--ink);font-weight:800;font-size:14.5px;cursor:pointer;width:100%;margin-top:10px}
.btn2.pr{border:0;background:linear-gradient(180deg,#f0cf85,#d6a64f);color:#17120a}
.lock{position:relative;overflow:hidden}
.lock .bl{filter:blur(5px);opacity:.55;font-family:var(--bmj);font-size:15px;line-height:1.7}
.lock .cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:linear-gradient(180deg,rgba(21,18,24,.2),rgba(21,18,24,.9))}
.lock .cta b{font-size:15px}.lock .cta small{font-size:12.5px;color:var(--ink-2)}
.pay{height:46px;border:0;border-radius:0;background:linear-gradient(180deg,#f0cf85,#d6a64f);color:#1a120a;font-weight:900;font-size:14.5px;padding:0 20px;cursor:pointer}
.sheet{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.sheet.on{display:flex}
.sheet img{max-height:66vh;max-width:100%;border-radius:0}
.sheet .row{display:flex;gap:8px;width:100%;max-width:330px}

/* ===== 2026-09-30 23시 서브 화면 정돈 — 각진 카드, 먹빛 차콜 바탕, 제목 줄, 캐릭터 한마디는 금색 세로줄 ===== */
.stage{background:radial-gradient(120% 34% at 50% 0%,rgba(74,54,40,.28),rgba(0,0,0,0) 70%),linear-gradient(180deg,#1a161d 0%,#161219 60%,#131016 100%)}
.box,.card{background:linear-gradient(180deg,rgba(255,244,228,.045),rgba(255,244,228,.02));border:1px solid rgba(255,236,210,.1);padding:18px 16px}
.box{margin-top:10px}
.box h3{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.18em}
.box h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(227,184,102,.4),rgba(227,184,102,0))}
.say{background:linear-gradient(90deg,rgba(227,184,102,.13),rgba(227,184,102,.03));border:0;border-left:2px solid var(--gold);padding:14px 14px 14px 13px}
.meQ{border-left:2px solid var(--gold)}
.up{background:rgba(255,244,228,.03);border-color:rgba(255,236,210,.1)}
.btn2{background:rgba(255,244,228,.03);border-color:rgba(227,184,102,.35)}
.go,.btn2.pr{box-shadow:0 10px 26px rgba(227,184,102,.18)}
.rh h1,.hero h1{letter-spacing:-.01em}
.top b{transition:opacity .3s}
#oprem{margin:14px 0}
#oprem .pk-sec{margin-top:12px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top"><button class="ib" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b>OBANG MATCH</b></div>

  <section class="scr on" id="sIn"><div class="wrap">
    <div class="hero" id="hero"><div class="t"><div class="kick">오방 궁합 · 다섯 신과 나</div><h1>다섯 신 중,<br>나랑 맞는 단 한 명</h1><p>네 사주를 다섯 신의 사주에 하나씩 맞대 볼게.</p></div></div>
    <div class="five" id="five"></div>
    <button class="meQ" id="meQ" type="button" hidden><span class="ic" id="meIc"></span><span><b id="meT"></b><small id="meS"></small></span><i>바로 보기 ›</i></button>
    <button class="other" id="other" type="button" hidden>다른 생일로 볼래요</button>
    <div id="form">
      <div class="card"><h3>이름 (선택)</h3><input type="text" id="nm" maxlength="8" placeholder="예) 은주"></div>
      <div class="card"><h3>성별</h3><div class="seg" id="gSeg"><button class="on" data-v="f" type="button">여자</button><button data-v="m" type="button">남자</button></div></div>
      <div class="card"><h3>생년월일</h3><div class="seg" id="cSeg"><button class="on" data-v="s" type="button">양력</button><button data-v="l" type="button">음력</button></div>
        <div class="g3"><select id="by" aria-label="년"></select><select id="bm" aria-label="월"></select><select id="bd" aria-label="일"></select></div>
        <select id="bh" aria-label="태어난 시" style="margin-top:6px"></select></div>
      <button class="go" id="goBtn" type="button">다섯 신과 궁합 보기</button>
    </div>
    <p class="fine">신마다 정해진 사주(일주)가 있어요 · 하람 甲寅 · 이안 丙午 · 도준 戊辰 · 시온 庚申 · 재이 壬子</p>
  </div></section>

  <section class="scr ld" id="sLd"><div class="orb" id="orb"><b>?</b></div><h2>다섯 신이 네 사주를 보는 중</h2><p id="lTx"></p></section>

  <section class="scr" id="sOut"><div class="wrap">
    <div class="win" id="win"><div class="sc" id="scC"><div><b id="sc" data-cnt>0</b><small>궁합</small></div></div><div class="t"><span class="rk">1위 · <span id="wK"></span></span><h1 id="wN"></h1><p id="wQ"></p></div></div>
    <div class="box"><h3>다섯 신과 나, 궁합 순위</h3><div class="rank" id="rank"></div></div>
    <div class="box"><h3 id="whyH"></h3><div id="why"></div></div>
    <div class="say"><div class="av" id="sayAv"></div><div><small id="sayN"></small><p id="sayT"></p></div></div>
    <button class="btn2 pr" id="talk" type="button"></button>
    <div class="box lock" id="lockO"><h3 id="lockH"></h3><div class="bl" id="lockBl"></div>
      <div class="cta"><b id="lockT"></b><small>2027년 둘이 가장 가까워지는 달과 개운 미션</small><button class="pay" id="pay" type="button">편지 열기 · 9,900원</button></div></div>
    <div id="oprem" hidden></div>
    <button class="btn2" id="shareBtn" type="button">궁합 카드 저장 · 공유</button>
    <button class="btn2" id="toGh" type="button">진짜 그 사람과는 · 도화 궁합 보기</button>
    <button class="btn2" id="again" type="button">다른 생일로 다시 보기</button>
  </div></section>

  <div class="sheet" id="sheet"><img id="shImg" alt="궁합 카드"><div class="row"><button class="btn2" id="shSave" type="button" style="margin:0">저장</button><button class="btn2" id="shSend" type="button" style="margin:0">공유</button></div><button class="btn2" id="shX" type="button" style="max-width:330px">닫기</button></div>
  <div class="toast" id="toast"></div>
</div>
<script src="saju.js"></script>
<script src="saju_x.js"></script>
<script src="prem2_core.js"></script>
<script src="premai.js"></script>
<script src="premkit.js"></script>
<script src="obgh_prem.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), wait=ms=>new Promise(r=>setTimeout(r,ms));
const toast=t=>{ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1900); };
const show=id=>{ ['sIn','sLd','sOut'].forEach(s=>$(s).classList.toggle('on',s===id)); $(id).scrollTop=0; };
const Sj=window.Saju, {GAN,JI,BR_EL,stEl}=Sj, EK='木火土金水', EN=['나무','불','흙','쇠','물'];
const HOURS=['자시 (23:30~01:29)','축시 (01:30~03:29)','인시 (03:30~05:29)','묘시 (05:30~07:29)','진시 (07:30~09:29)','사시 (09:30~11:29)','오시 (11:30~13:29)','미시 (13:30~15:29)','신시 (15:30~17:29)','유시 (17:30~19:29)','술시 (19:30~21:29)','해시 (21:30~23:29)'];
const bat=w=>{ const c=String(w).charCodeAt(String(w).length-1)-0xAC00; return c>=0&&c<11172&&c%28>0; }, jo=(w,a,b)=>w+(bat(w)?a:b);
const PEACH=b=>[2,6,10].includes(b)?3:[8,0,4].includes(b)?9:[5,9,1].includes(b)?6:0;
/* 다섯 신: 오행 · 일주 · 대사 */
const G=[
 {k:'wood',n:'하람',h:'靑龍',el:0,d:[0,2],img:'img/wood.jpg',c:'#5fcf95',tag:'새 시작 · 다음 인연',L:['막힌 데는 내가 뚫어 줄게. 넌 자라기만 해.','천천히 친해지자. 봄은 원래 늦게 와.','우린 좀 다르네. 근데 다른 게 재밌잖아.'],pk:[4,8]},
 {k:'fire',n:'이안',h:'朱雀',el:1,d:[2,6],img:'img/fire.jpg',c:'#ff7a5c',tag:'고백 · 결단',L:['네 사주에 없는 불, 이제 내가 켜 줄게.','…나쁘지 않네. 조금 더 가까이 와 봐.','뜨거운 건 나 혼자로 충분해. 넌 식혀 줘.'],pk:[6,1]},
 {k:'earth',n:'도준',h:'黃龍',el:2,d:[4,4],img:'img/earth.jpg',c:'#e8b64f',tag:'일 · 돈 · 안정',L:['흔들릴 땐 기대. 네 발밑은 내가 받친다.','급할 거 없어. 천천히 쌓자.','너 요즘 좀 바쁘구나. 쉬고 싶을 때 와.'],pk:[0,9]},
 {k:'metal',n:'시온',h:'白虎',el:3,d:[6,8],img:'img/metal.jpg',c:'#dfe5ee',tag:'정리 · 속마음 · 재회',L:['끊어야 할 건 내가 끊어 줄게. 넌 고르기만 해.','정리가 필요할 때, 그때 불러.','…우린 말보다 거리가 필요한 사이야.'],pk:[2,5]},
 {k:'water',n:'재이',h:'玄武',el:4,d:[8,0],img:'img/water.jpg',c:'#7ea6ff',tag:'위로 · 회복',L:['메마른 데는 내가 적셔 줄게. 천천히 흘러가자.','말 안 해도 알아. 그냥 옆에 있을게.','넌 이미 물이 많아. 난 조용히 옆에 있을게.'],pk:[7,3]}];
$('five').innerHTML=G.map(g=>`<span style="background-image:url('${g.img}');--cc:${g.c}"></span>`).join('');
$('orb').innerHTML+=G.map((g,i)=>{ const a=-Math.PI/2+i*2*Math.PI/5, r=92; return `<span style="background-image:url('${g.img}');--cc:${g.c};transform:translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)"></span>`; }).join('');

function build(me){ let y=+me.y,m=+me.m,d=+me.d; if(me.cal==='l'){ const s=Sj.lunarToSolar(y,m,d,!!me.leap); if(!s) return null; y=s.y; m=s.m; d=s.d; }
  const h=(me.h==null||me.h===''||+me.h<0)?null:+me.h; return Sj.pillars(y,m,d,h); }
/* 궁합 계산 */
function match(P){ const cnt=Sj.elCount(P), me=stEl(P.d[0]); const mn=Math.min(...cnt), mx=Math.max(...cnt);
  const lows=cnt.map((v,i)=>v===mn?i:-1).filter(i=>i>=0);
  const tgt=[PEACH(P.y[1]),PEACH(P.d[1])];
  return G.map(g=>{ let s=62; const R=[];
    if(lows.includes(g.el)){ s+=18; R.push({ic:EK[g.el],t:`빈칸을 채워 주는 신`,p:`네 사주에 ${EN[g.el]}(${EK[g.el]}) 기운이 ${cnt[g.el]}개로 가장 적어요. ${g.n}의 기운이 바로 그 빈자리예요.`,w:3}); }
    else if(cnt[g.el]===mx&&mx>=3){ s-=5; R.push({ic:EK[g.el],t:'이미 넘치는 기운',p:`${EN[g.el]}(${EK[g.el]})는 네 사주에 이미 ${cnt[g.el]}개. 비슷한 기운이 겹쳐서 편하지만 새롭진 않아요.`,w:1}); }
    const r=(g.el-me+5)%5;
    if(r===4){ s+=9; R.push({ic:'生',t:`나를 살려 주는 사이`,p:`${g.n}의 ${EN[g.el]}가 네 일간 ${GAN[P.d[0]]}(${EN[me]})를 살려 줘요(상생). 곁에 있으면 기운이 차오르는 사이.`,w:2}); }
    else if(r===1){ s+=5; R.push({ic:'生',t:'내가 챙겨 주는 사이',p:`네 ${EN[me]} 기운이 ${g.n}의 ${EN[g.el]}를 살려요. 네가 먼저 다가가면 금방 가까워져요.`,w:1}); }
    else if(r===0){ s+=4; R.push({ic:'同',t:'같은 결의 친구',p:`둘 다 ${EN[me]}(${EK[me]}) 일간. 말이 잘 통하는 대신 고집도 닮았어요.`,w:1}); }
    else if(r===3){ s+=3; R.push({ic:'剋',t:'끌어당기는 긴장',p:`${g.n}의 ${EN[g.el]}가 네 ${EN[me]}를 다듬어요(상극). 그 긴장이 곧 설렘이 되는 사이.`,w:1}); }
    else { s+=2; R.push({ic:'剋',t:'내가 이끄는 사이',p:`네 ${EN[me]}가 ${g.n}의 ${EN[g.el]}를 이겨요. 주도권은 네 쪽이에요.`,w:1}); }
    if(Sj.isHap(P.d[1],g.d[1])){ s+=10; R.push({ic:'合',t:'배우자 자리 합',p:`네 일지 ${JI[P.d[1]]}와 ${g.n}의 일지 ${JI[g.d[1]]}가 합이에요. 한번 묶이면 쉽게 안 풀려요.`,w:2}); }
    else if(Sj.isChung(P.d[1],g.d[1])){ s-=6; R.push({ic:'沖',t:'배우자 자리 충',p:`네 일지 ${JI[P.d[1]]}와 ${g.n}의 ${JI[g.d[1]]}가 충. 부딪히지만 서로를 확 깨워 줘요.`,w:1}); }
    if(tgt.includes(g.d[1])){ s+=6; R.push({ic:'桃',t:'도화가 닿는 사이',p:`${g.n}의 일지 ${JI[g.d[1]]}가 네 도화 글자예요. 이유 없이 눈이 가요.`,w:2}); }
    s=Math.max(55,Math.min(98,s));
    return Object.assign({},g,{s,R:R.sort((a,b)=>b.w-a.w)}); }).sort((a,b)=>b.s-a.s||a.el-b.el); }

/* 입력 */
let cal='s', gender='f';
(function(){ const by=$('by'),bm=$('bm'),bd=$('bd'),bh=$('bh');
  for(let y=2010;y>=1950;y--) by.add(new Option(y+'년',y,false,y===1996)); for(let m=1;m<=12;m++) bm.add(new Option(m+'월',m,false,m===5));
  window.fillD=()=>{ const n=cal==='s'?new Date(+by.value,+bm.value,0).getDate():30, cur=+bd.value||14; bd.innerHTML=''; for(let d=1;d<=n;d++) bd.add(new Option(d+'일',d,false,d===Math.min(cur,n))); };
  fillD(); by.onchange=fillD; bm.onchange=fillD; bh.add(new Option('태어난 시 모름','x',true,true)); HOURS.forEach((h,i)=>bh.add(new Option(h,i)));
  const seg=(id,cb)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ $(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); cb(b.dataset.v); });
  seg('cSeg',v=>{ cal=v; fillD(); }); seg('gSeg',v=>gender=v); })();
const setSeg=(id,v)=>$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
const loadMe=()=>{ try{ return JSON.parse(sessionStorage.getItem('me')||'null'); }catch(e){ return null; } };
const saveMe=o=>{ try{ sessionStorage.setItem('me',JSON.stringify(o)); }catch(e){} };
function prefill(me){ cal=me.cal||'s'; gender=me.g||'f'; setSeg('cSeg',cal); setSeg('gSeg',gender); $('nm').value=me.name||''; $('by').value=me.y; $('bm').value=me.m; fillD(); $('bd').value=me.d; $('bh').value=me.h==null?'x':me.h; }
(function(){ const me=loadMe(); if(me&&me.y){ prefill(me); $('meQ').hidden=false; $('other').hidden=false; $('form').hidden=true; $('meIc').textContent=(me.name||'나').slice(-1); $('meT').textContent=`${me.name||'내'} 정보로 바로 보기`; $('meS').textContent=`${me.cal==='l'?'음력':'양력'} ${me.y}.${me.m}.${me.d}${me.h!=null?' · '+HOURS[me.h].split(' ')[0]:''}`; } })();
$('other').onclick=()=>{ $('form').hidden=false; $('other').hidden=true; $('meQ').hidden=true; };
$('meQ').onclick=()=>run(loadMe());
$('goBtn').onclick=()=>{ const me={name:$('nm').value.trim(),g:gender,cal,y:+$('by').value,m:+$('bm').value,d:+$('bd').value,h:$('bh').value==='x'?null:+$('bh').value}; if(!build(me)){ toast('없는 음력 날짜예요'); return; } saveMe(me); run(me); };

let RES=null, ME=null;
async function run(me){ const P=build(me); if(!P){ toast('없는 음력 날짜예요'); return; } ME=me; RES=match(P);
  show('sLd'); const sp=[...$('orb').querySelectorAll('span')]; const tx=['하람이 네 사주를 펼쳐 보는 중…','이안이 불씨를 찾는 중…','도준이 기둥을 세우는 중…','시온이 선을 긋는 중…','재이가 물길을 따라가는 중…'];
  for(let i=0;i<5;i++){ sp.forEach(x=>x.classList.remove('on')); sp[i].classList.add('on'); $('lTx').textContent=tx[i]; tone(392*Math.pow(1.122,i),.08); await wait(420); }
  sp.forEach(x=>x.classList.remove('on')); const w=G.findIndex(g=>g.k===RES[0].k); sp[w].classList.add('on'); $('orb').querySelector('b').textContent=EK[RES[0].el]; $('lTx').textContent=`…${jo(RES[0].n,'이','가')} 손을 들었어요`; tone(523,.12); tone(784,.08,.1); await wait(900);
  render(P); }
function render(P){ const W=RES[0], nm=ME.name||'너', tier=s=>s>=85?0:s>=72?1:2;
  document.documentElement.style.setProperty('--cc',W.c); $('scC').style.setProperty('--cc',W.c);
  $('win').style.backgroundImage=`url('${W.img}')`; $('wK').textContent=`${W.h} · ${EK[W.el]}`; $('wN').innerHTML=`${W.n}<small>${W.s>=90?'운명의 짝':W.s>=80?'찰떡 궁합':'잘 맞는 편'}</small>`; $('wQ').textContent=`"${W.L[0]}"`;
  $('sc').textContent=W.s;
  $('rank').innerHTML=RES.map((g,i)=>`<div class="ri${i===0?' first':''}" style="--cc:${g.c}"><em>${i+1}</em><span class="av" style="background-image:url('${g.img}')"></span><div style="min-width:0"><b>${g.n}<small>${g.h} · ${EK[g.el]}</small></b><span class="bar"><u data-w="${g.s}"></u></span><span class="l">${g.R[0].t} · "${g.L[tier(g.s)]}"</span></div><span class="n" style="color:${g.c}">${g.s}</span></div>`).join('');
  $('whyH').textContent=`${W.n}${bat(W.n)?'과':'와'} 잘 맞는 이유`;
  $('why').innerHTML=W.R.slice(0,3).map(r=>`<div class="why" style="--cc:${W.c}"><div class="ic">${r.ic}</div><div><b>${r.t}</b><p>${r.p}</p></div></div>`).join('');
  const last=RES[4]; $('sayAv').style.backgroundImage=`url('${last.img}')`; $('sayN').textContent=`5위 · ${last.h} ${last.n}`; $('sayT').textContent=last.L[2];
  $('talk').textContent=`1위 ${W.n}${bat(W.n)?'과':'와'} 바로 대화하기`; $('talk').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} location.href='chat.html?h='+W.k+'&from=obgh'; };
  $('lockH').textContent=`${W.n}의 편지`; $('lockT').textContent=`${jo(W.n,'이','가')} 너에게 쓴 2027년 편지`;
  $('lockBl').textContent=`${nm}에게. 너랑 내가 제일 가까워지는 달은 ○월이야. 그때는 사람 많은 곳에 한 번 더 나가 봐. 그리고 네가 요즘 미뤄 둔 그 일, ○월 전에는 꼭 시작해. 내가 옆에서…`;
  window.OGF={me:ME,W,RES}; $('lockO').hidden=false; $('oprem').hidden=true;
  show('sOut'); if(window.Depth3D){ Depth3D.unmount($('win')); Depth3D.mount($('win'),{src:W.img,pos:[.5,.18]}); }
  setTimeout(()=>document.querySelectorAll('.ri .bar u').forEach(u=>u.style.width=u.dataset.w+'%'),500); }
$('pay').onclick=()=>{ if(window.OgPrem&&OgPrem.open()){ $('lockO').hidden=true; setTimeout(()=>$('oprem').scrollIntoView({behavior:'smooth',block:'start'}),60); } else toast('체험판이라 결제는 여기까지예요'); };
$('toGh').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} location.href='gunghap.html'; };
$('again').onclick=()=>{ $('form').hidden=false; $('other').hidden=true; $('meQ').hidden=true; show('sIn'); };
$('back').onclick=()=>{ if($('sOut').classList.contains('on')){ show('sIn'); return; } try{ sessionStorage.setItem('toHome','1'); }catch(e){} if(history.length>1) history.back(); else location.href='./'; };
let AC=null; function tone(f,v,t0=0){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); const t=AC.currentTime+t0, o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+1.1); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+1.2); }catch(e){} }
/* 공유 카드 */
let blob=null;
async function card(){ const W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d'), T=RES[0];
  try{ await document.fonts.load('80px OBrush'); }catch(e){}
  const im=await new Promise(ok=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ok(null); i.src=T.img; });
  x.fillStyle='#0c0a0f'; x.fillRect(0,0,W,H); if(im){ const s=Math.max(W/im.width,1300/im.height), w=im.width*s, h=im.height*s; x.drawImage(im,(W-w)/2,0,w,h); }
  let g=x.createLinearGradient(0,700,0,1300); g.addColorStop(0,'rgba(12,10,15,0)'); g.addColorStop(1,'rgba(12,10,15,1)'); x.fillStyle=g; x.fillRect(0,700,W,1220);
  x.textAlign='center'; x.fillStyle='#f3d79b'; x.font='700 38px "Noto Sans KR",sans-serif'; x.fillText(`다섯 신 중 나랑 맞는 1위`,W/2,1280);
  x.fillStyle='#fff'; x.font='150px OBrush, "Noto Serif KR", serif'; x.fillText(`${T.n} ${T.s}점`,W/2,1440);
  x.font='40px "Song Myung", serif'; x.fillStyle='#d0c7bb'; x.fillText(`"${T.L[0]}"`,W/2,1540);
  RES.slice(1).forEach((g2,i)=>{ x.fillStyle=g2.c; x.font='700 34px "Noto Sans KR",sans-serif'; x.fillText(`${i+2}위 ${g2.n} ${g2.s}`,W/2+(i%2?1:-1)*220,1650+Math.floor(i/2)*60); });
  x.fillStyle='rgba(243,215,155,.85)'; x.font='700 30px "Noto Sans KR",sans-serif'; x.fillText('OBANG SAJU · 오방 궁합',W/2,1870);
  return new Promise(ok=>cv.toBlob(ok,'image/jpeg',.9)); }
$('shareBtn').onclick=async()=>{ toast('카드를 만드는 중…'); blob=await card(); $('shImg').src=URL.createObjectURL(blob); $('sheet').classList.add('on'); };
$('shX').onclick=()=>$('sheet').classList.remove('on');
$('shSave').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='obang-match.jpg'; document.body.appendChild(a); a.click(); a.remove(); toast('이미지를 저장했어요'); };
$('shSend').onclick=async()=>{ const f=new File([blob],'obang-match.jpg',{type:'image/jpeg'}); try{ if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:'오방 궁합'}); else $('shSave').onclick(); }catch(e){} };
addEventListener('load',()=>{ if(window.Depth3D) Depth3D.mount($('hero'),{src:'img/kv_house.jpg',pos:[.5,.3]}); });
})();
