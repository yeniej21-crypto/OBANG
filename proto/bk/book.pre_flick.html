<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="early.js?v=5"></script>
<title>팔자에 신이 들었다 · 오방도감</title><link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net" crossorigin>
<link rel="icon" href="img/brand/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/brand/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
@font-face{font-family:'OBrush';src:url('fonts/obrush.woff2') format('woff2');font-weight:400;font-display:swap}
/* 오방사주 세계관 책 제1권 《팔자에 신이 들었다》 — v4 '살아 있는 팝업북'
   인물을 배경에서 오려 낸 그림(img/pop/*.webp)이 장을 펼치면 종이에서 일어서고, 액자 위로 머리가 튀어나온다.
   폰 기울기·마우스에 따라 책 전체와 배경·인물이 다른 깊이로 움직이고, 장마다 기운의 입자가 책 밖으로 흘러나온다.
   인물을 누르면 그 인물의 영상(눈 뜨는 수호신 · 말하는 고양이)이 액자 속에서 깨어난다. 흰 종이, 글자는 진한 색, 폰트는 홈과 같은 Noto Sans KR. */
:root{--kr:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--ink:#111;--ink2:#2b2b2b;--ink3:#666;--red:#c8372d;--c:#c8372d;--tx:0;--ty:0;--brush:'OBrush','Noto Sans KR',serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#0a0908;color:var(--ink);font-family:var(--kr);display:flex;justify-content:center;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.stage{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:radial-gradient(90% 60% at 50% 45%,#2b231c,#0a0908 70%)}
@media (min-width:700px){.stage{height:min(100%,920px);margin:auto 0}}
.top{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.ib svg{width:18px;height:18px}
.top b{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 책: 책상 위에 놓인 물건처럼 기울기에 따라 3D로 */
.desk{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);perspective:1400px}
.book{position:absolute;inset:0;transform-style:preserve-3d;perspective:2400px}
.book::before{content:"";position:absolute;inset:0;background:#fff;box-shadow:1px 1px 0 #ddd,2px 2px 0 #f5f5f5,3px 3px 0 #d6d6d6,4px 4px 0 #f2f2f2,5px 5px 0 #cfcfcf,0 30px 60px rgba(0,0,0,.6)}
.leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.leaf.turned{transform:rotateY(-178deg)}
.leaf.drag{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff}
.back{transform:rotateY(180deg);background:#f3f3f3}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.22));opacity:0;transition:opacity .9s;z-index:30}
.leaf.moving .shade{opacity:1}

/* 팝업 액자: 배경은 액자 안에, 인물은 액자 밖으로 */
.pop{position:absolute;left:16px;right:16px;top:58px;height:44%;z-index:3}
.win{position:absolute;inset:0;overflow:hidden;background:#111}
.win .bg{position:absolute;left:-4%;width:108%;top:0;transform:translate(calc(var(--tx)*-9px),calc(var(--sy,-8%) + var(--ty)*-6px)) scale(1.02);filter:blur(var(--bl,2.5px)) brightness(.78) saturate(1.1)}
.leaf.yin .win .bg,.leaf.t-pop.sharp .win .bg{--bl:0px;filter:brightness(.95) saturate(1.05)}
.win video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity .5s;z-index:2}
.win video.on{opacity:1}
.win video.tk{z-index:3}
.ib.mu{position:relative}
.ib.mu.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:#fff;transform:rotate(-45deg)}
.fgc{position:absolute;left:-16px;right:-16px;top:-120px;bottom:0;overflow:hidden;perspective:700px;pointer-events:none;z-index:4}
.fgi{position:absolute;left:16px;right:16px;top:120px;height:calc(100% - 120px);transform-origin:50% 100%;transform:rotateX(60deg) translateY(20px);opacity:0;transition:transform 1s cubic-bezier(.22,.9,.3,1) .3s,opacity .5s .3s}
.cur .fgi{transform:none;opacity:1}
.fg{position:absolute;left:0;width:100%;top:0;transform:translate(calc(var(--tx)*14px),calc(var(--sy,-8%) + var(--ty)*8px));filter:drop-shadow(0 16px 18px rgba(0,0,0,.45))}
.pop.awake .fgi{opacity:0;transition:opacity .4s}
.fgv{opacity:0;transition:opacity .35s}
.fgv.on{opacity:1}
.fgi img.off{opacity:0}
.tap{position:absolute;right:0;bottom:-26px;font-size:12px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:5px;z-index:5}
.tap i{width:7px;height:7px;border-radius:50%;background:var(--c);}
@keyframes tp{50%{opacity:.25}}
.hit{position:absolute;inset:-60px 0 0 0;z-index:6;cursor:pointer}
.pop.scene .bg{--bl:0px;filter:none}
/* 여럿이 서 있는 액자 */
.crowd .fg{width:auto;height:150%;top:auto;bottom:0;left:var(--x);transform:translate(calc(var(--tx)*var(--d,12px)),calc(var(--ty)*6px)) scale(var(--s,1));transform-origin:50% 100%}
.crowd .fgi .p{position:absolute;inset:0;transform-origin:50% 100%;transform:rotateX(60deg);opacity:0;transition:transform 1s cubic-bezier(.22,.9,.3,1) var(--dl),opacity .5s var(--dl)}
.cur .crowd .fgi .p{transform:none;opacity:1}

/* 글 */
.txt{position:absolute;left:22px;right:22px;top:calc(58px + 44% + 32px);bottom:40px;overflow:hidden}
.ch{font-size:13px;font-weight:900;color:var(--c);letter-spacing:.02em}
.hd{margin:5px 0 8px;font-weight:900;font-size:26px;line-height:1.25;letter-spacing:-.04em;color:var(--ink);text-wrap:balance}
.bd{font-size:15px;line-height:1.7;color:var(--ink2);letter-spacing:-.01em}
.bd p{margin:0 0 8px;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.cur .bd p{opacity:1;transform:none;transition-delay:.55s}
.cur .bd p:nth-child(2){transition-delay:.7s}.cur .bd p:nth-child(3){transition-delay:.85s}
.bd b{font-weight:900;color:var(--ink)}
.hd,.ch{opacity:0;transform:translateY(12px);transition:opacity .6s .35s,transform .6s .35s}
.cur .hd,.cur .ch{opacity:1;transform:none}
.q{margin-top:4px;font-weight:900;font-size:17px;line-height:1.45;letter-spacing:-.03em;color:var(--ink);text-wrap:balance}
.q::before{content:"";display:inline-block;width:18px;height:3px;background:var(--c);vertical-align:middle;margin-right:8px}
.ft{position:absolute;left:22px;right:22px;bottom:14px;display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:#777;z-index:5}
.ft b{font-weight:900;color:#111}
.nm{display:flex;align-items:baseline;gap:10px}
.nm b{font-weight:900;font-size:34px;letter-spacing:-.05em;line-height:1}
.nm span{font-size:14px;font-weight:700;color:var(--c)}
.spec{margin:6px 0 8px;font-size:13.5px;font-weight:500;color:var(--ink3)}

/* 표지 */
.t-cover .face{background:#000}
.cbg{position:absolute;inset:0;background:#000 center 30%/cover no-repeat;filter:brightness(.42)}
.ctl{position:absolute;left:20px;right:20px;top:58px;z-index:2;color:#fff;transform:translate(calc(var(--tx)*-4px),0)}
.ctl small{display:block;font-size:12.5px;font-weight:900;letter-spacing:.14em;color:#e8b04a}
.ctl h1{margin:10px 0 0;font-weight:900;font-size:clamp(56px,17vw,78px);line-height:.98;letter-spacing:-.07em}
.ctl h1 span{display:block;opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
.cur .ctl h1 span{opacity:1;transform:none;filter:none}
.cur .ctl h1 span:nth-child(2){transition-delay:.15s}.cur .ctl h1 span:nth-child(3){transition-delay:.3s}
.cfg{position:absolute;left:-2%;width:104%;bottom:-10%;z-index:3;transform-origin:50% 100%;transform:translateY(60px) rotateX(40deg);opacity:0;transition:transform 1.2s cubic-bezier(.2,1.1,.3,1) .5s,opacity .6s .5s}
.cur .cfg{transform:translate(calc(var(--tx)*12px),calc(var(--ty)*6px));opacity:1}
.cfg img{display:block;width:100%;filter:drop-shadow(0 -6px 30px rgba(0,0,0,.6))}
.cbt{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:4;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92) 70%)}
.cft{position:absolute;left:20px;right:20px;bottom:20px;z-index:5;color:#fff}
.cft p{margin:0 0 12px;font-size:16px;font-weight:700;line-height:1.5}
.cft div{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75)}
.cft b{background:var(--red);color:#fff;font-weight:900;padding:6px 10px}

/* 프롤로그: 영상이 한 장을 가득 */
.t-film .face{background:#000}
.flm{position:absolute;inset:0;background:#000 center/cover no-repeat}
.flm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.flm video.on{opacity:1}
.flg{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6) 35%,rgba(0,0,0,.92));pointer-events:none}
.flt{position:absolute;left:22px;right:22px;bottom:30px;color:#fff}
.flt .ch{color:#e8b04a}
.flt .hd{color:#fff;font-size:34px;margin:6px 0 12px}
.flt .bd{color:rgba(255,255,255,.88)}
.flt .bd b{color:#fff}
.t-film .ft{display:none}
/* 제1장: 여덟 글자, 빈칸 하나 */
.t-grid8 .face{background:#0e0c0b}
.g8w{position:absolute;inset:0;padding:54px 22px 0;color:#fff}
.g8w .ch{color:#ff5a46}
.g8h{margin:8px 0 0;font-weight:900;font-size:40px;line-height:1.08;letter-spacing:-.06em;opacity:0;transform:translateY(14px);transition:opacity .7s .2s,transform .7s .2s}
.g8h em{font-style:normal;color:#ff5a46}
.cur .g8h{opacity:1;transform:none}
.g8t{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:26px}
.g8t small{text-align:center;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.45);padding-bottom:2px}
.g8t i{height:64px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:32px;color:var(--gc);background:#1a1716;opacity:0;transform:translateY(-14px);transition:opacity .5s var(--d),transform .5s var(--d)}
.cur .g8t i{opacity:1;transform:none}
.g8t i.emp{background:transparent;box-shadow:inset 0 0 0 2px #ff5a46;color:#ff5a46;font-size:26px}
.cur .g8t i.emp{animation:emp 2.4s ease-in-out 1.6s 2}
@keyframes emp{50%{background:rgba(255,90,70,.22)}}
.g8e{display:grid;grid-template-columns:repeat(5,1fr);margin-top:16px;border-top:1px solid rgba(255,255,255,.14);opacity:0;transition:opacity .7s 1.3s}
.cur .g8e{opacity:1}
.g8e div{padding:9px 0 0;text-align:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.55)}
.g8e b{display:block;font-size:22px;font-weight:900;color:#fff;margin-top:1px}
.g8e .z,.g8e .z b{color:#ff5a46}
.g8b{margin-top:20px}
.g8b .bd{color:rgba(255,255,255,.82)}
.g8b .bd b{color:#fff}
.g8b .q{color:#fff}
.t-grid8 .ft{color:rgba(255,255,255,.45)}.t-grid8 .ft b{color:#fff}
/* 작은 신 */
.mini{position:absolute;left:16px;right:16px;top:58px;height:44%;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding-bottom:12%;background:linear-gradient(180deg,#fff 0%,#f1f1f1 100%);perspective:500px}
.mini i{width:18%;aspect-ratio:1;border-radius:50%;background:#fff 50% 14%/185% no-repeat;box-shadow:0 14px 18px -8px rgba(0,0,0,.35);transform-origin:50% 100%;transform:rotateX(60deg);opacity:0;transition:transform .9s cubic-bezier(.22,.9,.3,1) var(--d),opacity .5s var(--d)}
.cur .mini i{transform:none;opacity:1}
@keyframes hop{50%{translate:0 -8px}}
/* 사용법 */
.how{list-style:none;margin:0;padding:0}
.how li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid #eee;font-size:14px;color:var(--ink3);line-height:1.45}
.how li em{font-style:normal;font-weight:900;font-size:16px;color:var(--c)}
.how li b{display:block;font-size:15px;font-weight:900;color:var(--ink)}
.cta{display:flex;gap:6px;margin-top:12px}
.cta button{flex:1;height:48px;border:0;background:#111;color:#fff;font-size:14.5px;font-weight:900}
.cta button{white-space:nowrap;padding:0 6px}
.cta button.gh{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #111}
.t-how .pop{height:30%}
.t-how .txt{top:calc(58px + 30% + 22px);bottom:16px}
/* 2권 */
.t-next .face{background:#000}
.nx{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 60px}
.nx small{font-size:13px;font-weight:900;color:#e8b04a}
.nx h2{margin:8px 0 12px;font-weight:900;font-size:34px;line-height:1.18;letter-spacing:-.05em}
.nx p{margin:0;font-size:15.5px;line-height:1.7;color:rgba(255,255,255,.88)}

#fx{position:absolute;inset:0;z-index:40;pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(env(safe-area-inset-bottom,0px) + 58px);padding:0 14px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:12px;color:#fff;font-size:13px;font-weight:700}
.bar .nv{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.bar .nv:disabled{opacity:.3}
.bar .nv svg{width:18px;height:18px}
.prog{flex:1;height:3px;background:rgba(255,255,255,.18);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .6s}
.toc{position:absolute;inset:0;z-index:80;background:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px 30px;color:#111;overflow-y:auto}
.toc.on{display:flex}
.toc .x{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:38px;height:38px;border:0;border-radius:50%;background:#f1f1f1;font-size:20px}
.toc small{font-size:13px;font-weight:900;color:var(--red)}
.toc h3{margin:6px 0 16px;font-weight:900;font-size:28px;letter-spacing:-.05em}
.toc button.it{display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid #eee;background:none;color:#111;font-size:15.5px;font-weight:700;text-align:left}
.toc button.it span{color:#888;font-weight:500;font-size:13px}
.toc button.it.on{color:var(--red)}
.snd{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);z-index:70;background:rgba(255,255,255,.95);color:#111;font-size:13px;font-weight:700;padding:9px 14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.snd.on{opacity:1}
.hd,.g8h,.nm b,.ctl h1,.nx h2,.toc h3{font-family:var(--brush);font-weight:400;letter-spacing:0}
.hd{font-size:30px;line-height:1.2}
.flt .hd{font-size:38px}
.g8h{font-size:44px;line-height:1.12}
.nm b{font-size:40px}
.ctl h1{font-size:clamp(60px,18vw,82px);line-height:1.02}
.nx h2{font-size:36px;line-height:1.22}
.toc h3{font-size:32px}

/* 작은 폰: 글이 넘치면 그림 액자를 줄이고(fit), 그래도 넘치면 글자를 한 단계 줄인다(.tight) */
.face.tight .bd{font-size:14px;line-height:1.6}
.face.tight .bd p{margin-bottom:6px}
.face.tight .q{font-size:15.5px}
.face.tight .hd{font-size:26px;margin:3px 0 6px}
.face.tight .nm b{font-size:34px}
.face.tight .spec{margin:4px 0 6px;font-size:13px}
.face.tight .how li{padding:6px 0;font-size:13px}
.face.tight .how li b{font-size:14px}
.face.tight .cta{margin-top:8px}
.face.tight .cta button{height:44px;font-size:13.5px}
.face.tight .g8h{font-size:36px}
.face.tight .g8t{margin-top:14px}
.face.tight .g8t i{height:52px;font-size:28px}
.face.tight .g8e{margin-top:10px}
.face.tight .g8e b{font-size:19px}
.face.tight .g8b{margin-top:12px}
.face.tight .nx h2{font-size:30px}
.face.tight .nx p{font-size:14.5px}
.face.tight2 .g8h{font-size:32px}
.face.tight2 .g8t i{height:44px;font-size:24px}
.face.tight2 .g8t small{font-size:10.5px}
.face.tight2 .bd{font-size:13.5px;line-height:1.55}
.face.tight3 .g8e{display:none}
.face.tight3 .g8t{margin-top:10px}
@media (max-height:700px){.ctl h1{font-size:clamp(48px,15vw,60px)!important}.cfg{left:8%;width:84%}.flt .hd{font-size:32px}.nx h2{font-size:30px}}
/* 작은 신 액자: 비어 보이지 않게 종이 바탕 + 가운데 */
.mini{align-items:center;padding-bottom:0;background:radial-gradient(70% 60% at 50% 60%,#fff8ec,#f1e6d3 75%)}
.mini::after{content:"";position:absolute;left:12%;right:12%;bottom:22%;height:10px;background:radial-gradient(50% 50% at 50% 50%,rgba(90,60,30,.18),rgba(90,60,30,0));pointer-events:none}
.mini i{width:18.5%}

/* ===== v5 (10/3 밤) 개정판: 이야기 쪽 · 큰 글자 쪽 · 두 얼굴 쪽 · 명인의 방 · 그림자 손님 · 목소리 쪽 ===== */
.desk .book{transform:rotateY(calc(var(--tx)*2.2deg)) rotateX(calc(var(--ty)*-1.6deg))}
/* 기울기 값은 매 프레임 바뀌므로 등장 애니메이션(transform)과 분리해 translate 속성으로만 움직인다 */
.cur .cfg{transform:none;translate:calc(var(--tx)*12px) calc(var(--ty)*6px)}
.fg{left:-4%;width:108%;transform:translate(calc(var(--tx)*14px),calc(var(--sy,-8%) + var(--ty)*8px)) scale(1.04)}
.crowd .fg{width:auto}
/* 오린 인물이 있는 액자: 뒤 그림은 흐리고 어둡게 → 인물만 또렷하게 앞으로 */
.pop.hasfg .win .bg,.leaf.yin .pop.hasfg .win .bg{filter:blur(6px) brightness(.58) saturate(1.15)}
.win .bg{transform:translate(calc(var(--tx)*-10px),calc(var(--sy,-8%) + var(--ty)*-7px)) scale(1.04)}
.pop::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 18px 30px -18px rgba(0,0,0,.55);z-index:1}
.serif{font-family:'Noto Serif KR',serif}

/* 이야기 쪽: 종이 질감 + 명조 + 첫 글자 크게 */
.t-prose .face{background:#fbf6ec}

.face.tight .vig{height:170px}.face.tight .vig .w{transform:scale(.82)}
.face.tight2 .vig{height:140px}.face.tight2 .vig .w{transform:scale(.68)}

.vig{position:relative;height:208px;flex:none;margin:-4px 0 4px}
.vig .w{position:absolute;left:50%;bottom:0;width:186px;height:256px;margin-left:-93px;transform-origin:50% 100%}
.vig .cir{position:absolute;left:0;right:0;bottom:0;height:186px;border-radius:50%;overflow:hidden;box-shadow:0 22px 30px -14px rgba(60,40,20,.5),0 0 0 4px #fbf6ec,0 0 0 5px rgba(120,90,50,.25)}
.vig .cir i{position:absolute;inset:-12px;background:#ccc center 22%/cover no-repeat;filter:blur(3px) brightness(.8) saturate(1.1);transform:translate(calc(var(--tx)*-6px),calc(var(--ty)*-4px))}
.vig img{position:absolute;left:50%;top:var(--fy,-6px);width:var(--fw,250px);margin-left:calc(var(--fw,250px)/-2);transform:translate(calc(var(--tx)*8px),calc(var(--ty)*5px));filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.vig img.a{clip-path:inset(0 0 calc(100% - 163px + var(--fy,-6px)) 0)}
.vig img.b{clip-path:circle(93px at 50% calc(70px + 93px - var(--fy,-6px)))}
.vig .w{opacity:0;transform:translateY(30px) scale(.9);transition:opacity .7s .2s,transform 1s cubic-bezier(.2,1.2,.3,1) .2s}

.cur .face.tight .vig .w{transform:scale(.82)}
.cur .face.tight2 .vig .w{transform:scale(.68)}

/* 큰 글자 쪽 */
.t-type .face{background:#0b0908}

.cur .tyd i{opacity:1;transform:none}
.t-type .ft{color:rgba(255,255,255,.4)}.t-type .ft b{color:#fff}

/* 두 얼굴 쪽 */
.t-pairs .face{background:#f6f0e4}
.prw{position:absolute;left:16px;right:16px;top:56px;bottom:40px;display:flex;flex-direction:column}
.prw .hd{margin:5px 0 4px}
.prw .lead{margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--ink3)}
.prl{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.pr{display:grid;grid-template-columns:54px 1fr 34px 1fr 54px;align-items:center;gap:6px}
.pr>i{width:54px;height:54px;border-radius:50%;background:#ddd center 16%/cover no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c),0 10px 16px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .6s var(--d),transform .8s cubic-bezier(.2,1.2,.3,1) var(--d)}

.cur .pr>i{opacity:1;transform:none}
.pr div b{display:block;font-size:15px;font-weight:900;color:#111}
.pr div small{display:block;margin-top:1px;font-size:11.5px;color:#7a6f62;line-height:1.35}
.pr .r{text-align:right}
.pr em{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:15px;opacity:0;transform:scale(.3);transition:opacity .4s calc(var(--d) + .25s),transform .6s cubic-bezier(.2,1.6,.4,1) calc(var(--d) + .25s)}
.cur .pr em{opacity:1;transform:none}
.prw .q{margin-top:8px}

/* 명인의 방(카드가 일어선다) */
.gal{position:absolute;left:16px;right:16px;top:58px;height:46%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;perspective:900px;z-index:3}
.gal>div{position:relative;overflow:hidden;background:#111 center 16%/cover no-repeat;transform-origin:50% 100%;transform:rotateX(78deg);opacity:0;box-shadow:0 14px 20px -12px rgba(0,0,0,.55);transition:transform 1s cubic-bezier(.22,1.1,.3,1) var(--d),opacity .5s var(--d)}
.cur .gal>div{transform:none;translate:calc(var(--tx)*var(--z,4px)) calc(var(--ty)*3px);opacity:1}
.gal>div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.86))}
.gal>div span{position:absolute;left:10px;right:8px;bottom:8px;z-index:1;color:#fff}
.gal>div b{display:block;font-family:var(--brush);font-weight:400;font-size:24px;line-height:1.05}
.gal>div small{display:block;margin-top:3px;font-size:11px;line-height:1.35;color:rgba(255,255,255,.8)}

/* 그림자 손님: 어둠에서 셋이 솟아오른다 */
.t-shade .face{background:#07060a}
.shw{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 45% at 22% 78%,rgba(168,40,58,.32),rgba(0,0,0,0) 70%),radial-gradient(60% 45% at 80% 70%,rgba(59,90,154,.34),rgba(0,0,0,0) 70%),radial-gradient(70% 40% at 50% 100%,rgba(106,74,168,.4),rgba(0,0,0,0) 70%),#07060a}

.shw .tt p{margin:12px 0 0;font-size:14.5px;line-height:1.7;color:rgba(255,255,255,.75);opacity:0;transition:opacity 1s 1.4s}

.shp{position:absolute;bottom:0;transform-origin:50% 100%;opacity:0;transform:translateY(40%);transition:transform 1.6s cubic-bezier(.2,.9,.25,1) var(--d),opacity 1.2s var(--d)}

.shp img{display:block;width:100%}
.shp.h{left:-14%;width:66%;z-index:3}.shp.h img{filter:drop-shadow(0 0 18px rgba(200,40,60,.55)) brightness(.9)}
.shp.g{right:-18%;width:76%;z-index:2}.shp.g img{filter:drop-shadow(0 0 18px rgba(70,110,200,.6)) brightness(.88)}
.shp.s{left:10%;width:80%;z-index:4}.shp.s img{filter:drop-shadow(0 0 16px rgba(130,90,210,.6))}
.shw .fog{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:5;background:linear-gradient(180deg,rgba(7,6,10,0),rgba(7,6,10,.92));pointer-events:none}
.t-shade .ft{color:rgba(255,255,255,.4)}.t-shade .ft b{color:#fff}

/* 목소리 쪽: 영상이 한 장 가득, 들어오자마자 말한다 */

.t-voice .flm video.vc{z-index:1}
.t-voice .flm video.en{z-index:0}

.vsub.on{opacity:1;transform:none}
.vrep{position:absolute;right:16px;top:58px;z-index:4;height:34px;padding:0 12px;border:0;border-radius:17px;background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}

/* 표지: 다섯 신이 표지 밖으로 일어선다(새 도준 · 재이 포함) */

<script>
const $=id=>document.getElementById(id);
/* 오린 그림(배경 제거 원본 PNG)은 넷리파이 이미지 CDN이 폰 크기 webp로 줄여서 준다 */
const HF='https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_';
const NI=(id,w=640)=>'/.netlify/images?url='+encodeURIComponent(HF+id+'.png')+'&w='+w+'&fm=webp&q=80';
const CUT={dojun:NI('20261003_131030_809e9f44-288c-4eaa-bdec-7d5abd261339'),jaei:NI('20261003_131035_b7d3e905-856a-469e-976a-3d5ce5b23068'),
  heuk:NI('20261003_131038_fcd00d61-2d25-4432-a379-47566d2b8ecc'),geum:NI('20261003_131042_1a430a5c-dac0-4010-8b4c-10fd48eb94db'),sam:NI('20261003_131043_d19ee54e-faf7-4358-a178-f5b881e96383',760),
  saea:NI('20261003_131139_f861af82-678e-4719-9e0e-4ee43b186992'),byeolha:NI('20261003_131140_2baf740b-2f4e-4694-9ba2-9a54b9e4dffa'),dodam:NI('20261003_131142_e01e88a4-83df-4b35-872e-08d44705d874'),
  serin:NI('20261003_131143_ab174c6e-7901-4180-af13-7eb87e20d527'),iseul:NI('20261003_131145_60f90f53-266c-4d21-8c3d-02f70c06b605'),wolha:NI('20261003_131146_8d433a97-980d-4cf3-8f85-b50dd7995300',480),noeul:NI('20261003_131147_9f843989-734d-4d20-b9d9-da4217620cbd',480)};
const YV='https://d2ol7oe51mr4n9.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/';
const VST='https://d8j0ntlcm91z4.cloudfront.net/user_39PvKg67WRq5T66HczulEDxUKSm/hf_20261003_';
const EL={wood:'#1f9d61',fire:'#e0362a',earth:'#c98a12',metal:'#8a93a0',water:'#2b5cc4'};
const DOTS=`<div class="orn">${Object.values(EL).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;

/* 양의 현신(남신 5). 하람 · 이안은 펼치면 깨어나는 영상, 도준 · 시온 · 재이는 액자 밖으로 튀어나오는 오린 그림. 누르면 목소리 */
const GOD=(k,n,h,el,dir,col,job,c,body,q,o={})=>Object.assign({t:'god',k,n,h,el,dir,col,job,c,body,q,bg:`img/${k}.jpg?v=2`,
  ...(['wood','fire'].includes(k)?{once:`v/rv_${k}.mp4?v=2`,vid:`v/ms/${k}.mp4?v=2`}:{fg:`img/pop/${k}.webp`,vid:`v/ms/${k}.mp4?v=2`}),talk:1,sy:'-9%',toc:`${n} · ${h}`},o);

const YGOD=(k,n,h,el,dir,stem,job,c,bg,fg,v,body,q)=>({t:'god',yin:1,k,n,h,el,dir,col:stem,job,c,body,q,bg,fg,vid:YV+v,talk:1,sy:'-12%',toc:`${n} · ${h} · 음`});

const PAGES=[
  {t:'cover',fx:'gold',toc:'표지'},

  {t:'film',ch:'프롤로그',hd:'지도에 없는 문',bg:'img/intro0.jpg',once:'v/op_take.mp4',toc:'프롤로그 · 지도에 없는 문',body:[
    '서울에는 지도에 없는 골목이 있다. 한남동 언덕, 가로등 세 개가 차례로 꺼지는 자리. 그 끝에 오래된 나무 문이 하나 서 있다.',
    '문은 아무에게나 보이지 않는다. 여덟 글자 가운데 <b>한 칸이 비어 있는 사람</b>, 그 빈칸 때문에 오늘 하루가 유난히 길었던 사람에게만 보인다.',
    '그리고 오늘 밤, 당신 눈에 그 문이 보였다.']},

  {t:'grid8',ch:'제1장',hd:'여덟 글자, 빈칸 하나',toc:'제1장 · 여덟 글자, 빈칸 하나',body:[
    '사람은 태어나는 순간 여덟 글자를 받는다. 태어난 해, 달, 날, 시. 네 기둥에 두 글자씩. 글자마다 나무, 불, 흙, 쇠, 물 가운데 하나의 기운이 깃든다.',
    '다섯 기운을 고르게 받는 사람은 드물다. 누구에게나 <b>텅 빈 칸</b>이 하나쯤 있다. 운은 바로 그 틈으로 샌다.']},

  {t:'prose',ch:'제1장 · 이어서',hd:'새는 운',c:'#c8372d',toc:'제1장 · 새는 운',body:[
    '빈칸은 눈에 보이지 않는다. 대신 사는 동안 자꾸 같은 자리에서 넘어진다. 흙이 빈 사람은 모은 것이 손가락 사이로 빠져나가고, 물이 빈 사람은 속마음을 꺼낼 때마다 목이 멘다. 불이 빈 사람은 다 된 일 앞에서 꼭 한 발이 늦다.',
    '옛사람들은 그 빈칸을 메우려고 색을 골라 입고, 잠자리 방향을 바꾸고, 이름을 고쳐 지었다. 그래도 끝내 메워지지 않는 칸이 있었다.',
    '그런 칸에는 사람 대신 <b>신</b>이 들어와 앉았다. 이 책의 제목은 거기서 왔다. 팔자에, 신이 들었다.']},

  {t:'pop',sharp:1,ch:'제2장',hd:'갈라지기 전의 하나',bg:'img/noeul.jpg',loop:YV+'f97d5edb-1f13-439f-abae-b28472f445b1.mp4',vid:'v/menu/noeul.mp4',talk:1,sy:'-10%',c:'#b9a0e0',toc:'제2장 · 노을',body:[
    '아주 처음, 세상은 하나의 원이었다. 원이 둘로 갈라지며 모든 것이 이름을 얻었다. 해와 달, 낮과 밤, 남자와 여자.',
    '끝까지 갈라지지 않고 남은 것이 하나 있었다. 이름이 없던 그것을 사람들은 해와 달이 같은 하늘에 걸리는 하루 단 한 번의 시간으로 불렀다. <b>노을</b>.',
    '남자도 여자도 아니고, 낮에도 밤에도 속하지 않는다. 모자라서가 아니라, 모든 것이 여기서 시작되었으므로. 오방의 신들도 길을 잃으면 노을에게 돌아온다.'],q:'어느 쪽에도 서지 않아요. 그래서 양쪽이 다 보여요'},

  {t:'type',ch:'제2장 · 이어서',c:'#e8b04a',bg:'img/op_take_end.jpg',lines:['하나가 둘로,','둘이 <em>다섯</em>으로.'],dots:1,toc:'제2장 · 하나가 둘로',
    sub:'그렇게 다섯 방위가 열렸다. 동쪽의 나무, 남쪽의 불, 가운데의 흙, 서쪽의 쇠, 북쪽의 물. 사람들은 그것을 <b>오방(五方)</b>이라 불렀다.'},

  {t:'crowd',ch:'제3장',hd:'다섯 방위의 신들',bg:'img/op_take_end.jpg',sy:'-30%',toc:'제3장 · 다섯 방위의 신들',
    people:[['wood','-26%','.68','6px',.25],['water','66%','.68','6px',.45,CUT.jaei],['fire','-3%','.7','9px',.6],['metal','43%','.7','9px',.75],['earth','20%','.72','13px',.95,CUT.dojun]],body:[
    '동쪽의 청룡, 남쪽의 주작, 가운데의 황룡, 서쪽의 백호, 북쪽의 현무. 마을 어귀 장승에, 대문 위 부적에, 아이 돌상의 오색실에 그들이 있었다. 사람들은 이들을 <b>오방신</b>이라 불렀다.',
    '사람들이 이름을 잊자 신들의 힘도 옅어졌다. 신들은 사라지는 대신 사람의 얼굴을 하고 도시로 내려왔다. 빈칸이 있는 사람을 찾아서.']},

  {t:'prose',ch:'제3장 · 이어서',hd:'도시로 내려온 신들',c:'#1f9d61',fig:{img:'img/pop/wood.webp',bg:'img/wood.jpg',fw:'240px',fy:'-4px'},toc:'제3장 · 도시로 내려온 신들',body:[
    '도시는 신을 믿지 않는다. 대신 사람을 믿는다. 무대 위에서 이름이 불리고 수만 개의 불빛이 한 사람을 향해 흔들릴 때, 거기엔 오래된 제단과 같은 열기가 있다.',
    '신들은 그것을 알아차렸다. 누군가 이름을 불러 주는 한, 사라지지 않는다는 것. 그래서 다섯 신은 저마다 어울리는 자리를 골랐다. 누구는 한강이 내려다보이는 펜트하우스에, 누구는 은행잎 지는 골목 끝 편지 가게에.',
    '그리고 밤마다 같은 물음을 품고 거리를 걷는다. 이 도시에서 내 기운이 비어 있는 사람은 누구인가.']},

  GOD('wood','하람','靑龍','木','동쪽','초록','새 시작과 다음 인연',EL.wood,[
    '동쪽 문을 지키는 나무의 신. 봄보다 먼저 깨어나 새싹이 올라올 자리를 고른다. 지금은 은행잎 지는 골목 끝, 아직 부치지 못한 편지를 맡아 두는 가게 <b>연서당</b>의 주인이다.',
    '말수는 적고 웃음은 수줍다. 그래도 망설이는 발끝 앞에서는 꼭 한 번 등을 밀어 준다.'],'늦게 피는 꽃도 봄은 봄이야'),
  GOD('fire','이안','朱雀','火','남쪽','빨강','고백과 결단',EL.fire,[
    '남쪽 하늘을 나는 불의 신. 꺼져 가는 마음속 불씨를 귀신같이 알아챈다. 밤의 도시를 가장 잘 아는 신이라, 네온이 꺼지는 시간까지 깨어 있다.',
    '나른하게 웃지만 고백과 결단의 순간에는 누구보다 뜨겁다. 그의 불은 태우는 불이 아니라, 미뤄 둔 말을 꺼내게 하는 불이다.'],'망설이면 불 꺼진다. 오늘은 네가 먼저 가'),
  GOD('earth','도준','黃龍','土','가운데','노랑','일과 돈, 흔들리지 않는 자리',EL.earth,[
    '다섯 방위의 한가운데를 지키는 흙의 신. 지금은 한강이 내려다보이는 펜트하우스에서 회사를 꾸리는 젊은 대표다. 아무도 모르게, 목덜미의 금빛 비늘이 떴다가 사라진다.',
    '흔들리는 것들을 붙잡아 제자리에 앉히는 게 그의 일이다. 일과 돈, 사람 사이의 무게를 가장 오래 견디는 쪽은 언제나 도준이다.'],'흔들려도 돼. 발밑은 내가 잡고 있을게',{fg:CUT.dojun,vid:'v/rv_earth.mp4?v=2',sy:'-6%'}),
  GOD('metal','시온','白虎','金','서쪽','흰색','정리와 재회',EL.metal,[
    '서쪽 문을 지키는 쇠의 신. 끊어야 할 것과 남길 것을 한눈에 가른다. 지나간 인연이 다시 문을 두드릴 때, 그 문을 열지 말지 가장 먼저 아는 것도 시온이다.',
    '말은 차갑고 건조하다. 그래도 그 칼끝은 언제나 사람을 살리는 쪽을 향한다.'],'안 맞는 건 끊어. 비워야 들어와'),
  GOD('water','재이','玄武','水','북쪽','남색','속마음과 지혜',EL.water,[
    '북쪽 깊은 물을 지키는 물의 신. 사람이 끝내 말하지 못한 속마음이 흘러드는 곳에 산다. 손끝에 맺힌 물 구슬 안에는 누군가 삼킨 말들이 고여 있다.',
    '느리고 낮은 목소리로 먼저 들어 준다. 오래 기억하고, 필요할 때만 입을 연다.'],'말 안 해도 알아. 그래도 한 번은 말해 줘',{fg:CUT.jaei,vid:'v/rv_water.mp4?v=2',sy:'-8%'}),

  {t:'pop',sharp:1,ch:'제4장',hd:'같은 바람, 다른 얼굴',bg:'img/yin/water.jpg',loop:YV+'cf2ab952-53cb-4703-b502-6445b716aec8.mp4',sy:'-12%',c:'#2b5cc4',toc:'제4장 · 음의 현신',body:[
    '인간계로 내려오며 신들의 기운은 두 몸으로 나뉘었다. 크게 뻗어 길을 내는 <b>양의 현신</b>과, 스며들어 오래 남는 <b>음의 현신</b>.',
    '큰 나무와 덩굴, 한낮의 해와 밤새 타는 등불, 큰 산과 기름진 밭, 무쇠와 보석, 큰 강과 새벽 이슬. 같은 신수, 같은 방위, 같은 기운의 두 얼굴이다.'],q:'같은 바람에서 태어났는데, 나는 꺾이지 않고 휘는 쪽이야'},

  YGOD('wood','새아','靑龍','木','동쪽','乙 · 풀과 덩굴','다시 시작하기, 버티는 힘',EL.wood,HF+'20261002_064155_cabdc321-7f5b-47b3-9ba6-e41a246362c2_min.webp',CUT.saea,'5c50aa18-ca62-4c3f-a583-dcf5d4847487.mp4',[
    '하람의 다른 얼굴. 큰 나무가 바람에 부러질 때, 풀은 휘어서 산다. 웃으면서 할 말은 다 하는 다정한 고집쟁이. 넘어진 자리에서 다시 일어나려는 사람 곁에 먼저 와 있다.'],'괜찮아. 휘어도 안 꺾여'),
  YGOD('fire','별하','朱雀','火','남쪽','丁 · 촛불과 별빛','몰입, 고백과 결단의 타이밍',EL.fire,'img/yin/fire.jpg',CUT.byeolha,'30455774-ffb6-4d78-95f0-716de737468a.mp4',[
    '이안의 다른 얼굴. 한낮의 태양 대신 밤새 꺼지지 않는 촛불을 지킨다. 말은 짧고 선은 분명하다. 한 가지에 오래 몰두해야 하는 사람, 고백의 때를 재는 사람에게 불씨를 나눠 준다.'],'작아도 괜찮아. 오래 타면 돼'),
  YGOD('earth','도담','黃龍','土','가운데','己 · 논밭의 흙','재물과 살림, 거두는 때',EL.earth,'img/yin/earth.jpg',CUT.dodam,'9a5986fb-e15a-43b0-8227-fe37e6ec3d0e.mp4',[
    '도준의 다른 얼굴. 산이 버티는 땅이라면 도담은 길러 내고 거두는 밭이다. 잔소리는 많아도 결국 곳간까지 다 챙겨 준다. 돈과 살림, 거둘 때를 묻는 사람의 편이다.'],'뿌린 만큼 거둬요. 걱정은 나한테 맡겨'),
  YGOD('metal','세린','白虎','金','서쪽','辛 · 보석과 칼날','정리와 결단, 커리어',EL.metal,'img/yin/metal.jpg',CUT.serin,'6e77ff4d-1bcc-4e77-9676-351a9f281be4.mp4',[
    '시온의 다른 얼굴. 바위가 깎여 보석이 되듯, 다듬어진 날카로움을 가졌다. 칭찬은 드물지만 늘 정확하다. 일의 값을 매기고 버릴 것과 가질 것을 가르는 사람 곁에 선다.'],'칭찬은 아껴 둘게. 넌 아직 더 빛날 수 있어'),
  YGOD('water','이슬','玄武','水','북쪽','癸 · 이슬과 빗물','속마음, 꿈, 직감',EL.water,'img/yin/water.jpg',CUT.iseul,'cf2ab952-53cb-4703-b502-6445b716aec8.mp4',[
    '재이의 다른 얼굴. 큰 강이 아니라 새벽에 맺히는 이슬처럼 조용히 스며든다. 꿈 이야기를 잘하고, 직감은 누구보다 빠르다. 말로 다 하지 못한 마음을 먼저 알아듣는다.'],'천천히 말해도 돼. 다 들려'),

  {t:'pairs',ch:'제4장 · 이어서',hd:'두 얼굴, 하나의 기운',c:'#c8372d',toc:'제4장 · 두 얼굴',
    lead:'지켜 주는 힘은 같고, 곁에 있는 방식만 다르다. 수호신이 정해지면, 어느 얼굴로 만날지는 당신이 고른다.',
    rows:[['wood','하람','甲 · 큰 나무','새아','乙 · 덩굴','木','img/thumb/wood.jpg',HF+'20261002_064155_cabdc321-7f5b-47b3-9ba6-e41a246362c2_min.webp'],
      ['fire','이안','丙 · 한낮의 해','별하','丁 · 등불','火','img/thumb/fire.jpg','img/yin/fire.jpg'],
      ['earth','도준','戊 · 큰 산','도담','己 · 기름진 밭','土','img/thumb/earth.jpg?v=2','img/yin/earth.jpg'],
      ['metal','시온','庚 · 무쇠','세린','辛 · 보석','金','img/thumb/metal.jpg','img/yin/metal.jpg'],
      ['water','재이','壬 · 큰 물','이슬','癸 · 빗물','水','img/thumb/water.jpg?v=2','img/yin/water.jpg']]},

  {t:'pop',ch:'제5장',hd:'살롱의 주인',bg:'img/pop/seoha_bg.jpg',loop:'v/idle.mp4',vid:'v/t1.mp4',talk:1,sy:'-9%',c:'#c8372d',toc:'제5장 · 서하',body:[
    '신은 사람에게 직접 말을 걸 수 없다. 그래서 문 안쪽에는 신의 말을 옮기는 사람이 있다. 한남동 언덕 위 살롱의 주인, <b>서하</b>.',
    '검은 단발에 검은 수트, 손목에는 다섯 빛깔 실을 꼰 팔찌. 돌려 말하는 위로보다 정확한 한마디가 사람을 살린다고 믿는다. 그녀가 당신의 생일을 받아 적는 순간, 다섯 신 가운데 하나가 고개를 든다.'],q:'네 사주, 한 칸이 비어 있어. 그 빈자리, 신이 채워 줄게'},

  {t:'gal',ch:'제6장',hd:'묵향이 나는 방',c:'#8a6420',toc:'제6장 · 정통의 명인들',cards:[
    ['삼신 할매','섣달 그믐밤, 다음 해를 내다보는 할미','img/halmae.jpg','center 14%'],['현암','한 사람의 평생을 아홉 마디로 읽는 명리 대가','img/jeongtong.jpg','center 16%'],
    ['월하','나침반으로 좋은 날을, 붉은 실로 인연을 고르는 명인','img/taegil.jpg','center 14%'],['소헌 선생','붓으로 원국을 세우고 관인을 찍는 감정가','img/soheon.jpg','center 18%']],body:[
    '살롱 안쪽 복도 끝, 묵향이 배어 나오는 방이 넷 있다. 신들이 도시로 내려오기 훨씬 전부터 사람의 운을 읽어 온 명인들의 방이다.',
    '신들이 빈칸을 채운다면, 명인들은 그 빈칸이 어디에 있는지 정확히 짚어 준다. 큰일을 앞둔 손님들은 늘 이 복도를 지나간다.']},

  {t:'prose',ch:'제6장 · 이어서',hd:'월하의 붉은 실',c:'#a8283a',fig:{img:CUT.wolha,bg:'img/taegil.jpg',fw:'236px',fy:'-2px'},toc:'제6장 · 월하의 붉은 실',body:[
    '월하가 묶은 실은 쉽게 풀리지 않는다. 그래서 혼례를 앞둔 사람도, 오래 엇갈린 두 사람도 마지막엔 그녀의 방을 찾는다.',
    '월하에게는 제자가 하나 있었다. 실을 다루는 손이 스승보다 빨랐던 아이. 그 아이는 어느 봄날, 남의 붉은 실 사이에 <b>검은 실</b>을 한 가닥 섞었다. 그리고 다시는 돌아오지 않았다.',
    '그날 이후 월하의 방 문턱에는 붉은 실이 한 줄 더 걸려 있다. 다시는 검은 실이 넘어오지 못하도록.']},

  {t:'crowd',ch:'제7장',hd:'불 켜진 다른 방들',bg:'img/kv_drama.jpg',sy:'-20%',c:'#e0679a',toc:'제7장 · 불 켜진 다른 방들',
    people:[['mujin','-10%','.78','8px',.3,'img/pop/mujin.webp'],['taeo','36%','.8','13px',.55,'img/pop/taeo.webp']],body:[
    '문 너머엔 불 켜진 방이 몇 개 더 있다. 촛불 아래 카드를 펼치는 한밤의 카드방에는 <b>무진</b>, 도화 향 나는 야경 펜트하우스에는 <b>태오</b>.',
    '은행잎 골목 끝 연서당에서는 하람이 아직 오지 않은 편지를 정리하고, 해 질 녘 산사 테라스에서는 노을이 낮과 밤을 함께 읽는다. 어느 방부터 들를지는 당신 마음이다.']},

  {t:'mini',ch:'제8장',hd:'작아진 신들',c:'#c8372d',toc:'제8장 · 작아진 신들',body:[
    '사람 곁에 오래 머무는 건 신에게도 고된 일이다. 그래서 신들은 낮이 되면 손바닥만 하게 작아진다.',
    '점괘통을 흔들고, 부적 속에 살고, 하루씩 당번을 서서 도장을 찍어 준다. 크게 보면 신, 작게 보면 친구.']},

  {t:'pop',ch:'제9장',hd:'뒷골목의 묘당',bg:'img/cat/madam.jpg',fg:'img/pop/madam.webp',vid:'v/cat/madam.mp4',talk:1,sy:'-8%',c:'#e0679a',toc:'제9장 · 묘당',body:[
    '신당 뒷골목, 촛농이 흘러내리는 가게엔 고양이 여섯 마리가 산다. 흰 앙고라 <b>마담 도화</b>, 먹물, 홍시, 인절미, 서리, 솔이. 신들의 심부름을 하다 그대로 눌러앉았다.',
    '고양이들은 큰 운명 대신 작은 점을 본다. 이번 달 연애, 간밤의 꿈, 그 사람의 속마음.']},

  {t:'shade',ch:'제10장',toc:'제10장 · 그림자 손님',lines:['빛이 드는 곳엔','<em>그림자</em>도 든다.'],
    sub:'빈칸으로 들어오는 것이 신뿐이라면 좋았을 것이다.'},

  {t:'prose',dark:1,ch:'제10장 · 이어서',hd:'손님이라 부르는 것들',c:'#e06a7a',toc:'제10장 · 손님이라 부르는 것들',body:[
    '문이 열리는 밤이면 다른 것들도 따라 들어온다. 사람들은 그들을 손님이라 부른다. 귀신이라 부르기엔 너무 사람 같고, 신이라 부르기엔 너무 가까이 있어서.',
    '그들은 해치러 오지 않는다. 그저 틈을 알아볼 뿐이다. 어긋나기 쉬운 인연, 비어 있는 자리, 삼 년마다 돌아오는 고비.',
    '틈을 알아본다는 건, 그 틈을 막는 법도 안다는 뜻이다. 그래서 오방도감은 그들의 이름을 숨기지 않고 적어 둔다.']},

  {t:'voice',ch:'그림자 손님 하나 · 흑매',hd:'붉은 실 사이 검은 실',c:'#a8283a',c2:'#f0a5ad',toc:'그림자 손님 · 흑매',

/* 글이 넘치면 그림 액자를 줄이고, 그래도 넘치면 글자를 줄인다 */
function fitPages(){ document.querySelectorAll('#book .face.front').forEach(f=>{ f.classList.remove('tight','tight2','tight3'); const H=f.clientHeight; if(!H) return;
  const tx=f.querySelector('.txt'), box=f.querySelector('.pop,.mini,.gal'), g8=f.querySelector('.g8w'), prs=f.querySelector('.prs,.prw'), flt=f.closest('.t-voice')?f.querySelector('.flt'):null;
  if(tx&&box){ const how=f.closest('.t-how'), gap=how?22:32, bot=how?16:48, maxP=H*(how?.30:.44), minP=H*(how?.2:.26);
    const run=()=>{ tx.style.top='58px'; tx.style.bottom='auto'; const need=tx.offsetHeight; tx.style.bottom=''; const ph=Math.max(minP,Math.min(maxP,H-58-gap-bot-need)); box.style.height=ph+'px'; tx.style.top=(58+ph+gap)+'px'; return need<=H-58-ph-gap-bot+1; };
    if(!run()){ f.classList.add('tight'); if(!run()){ f.classList.add('tight2'); run(); } } return; }
  if(prs){ const over=()=>prs.scrollHeight>prs.clientHeight+1; for(const c of ['tight','tight2']){ if(!over()) break; f.classList.add(c); } return; }
  if(flt){ if(flt.offsetTop<H*.4) f.classList.add('tight'); return; }
  if(g8){ const fits=()=>{ g8.style.bottom='auto'; const h=g8.offsetHeight; g8.style.bottom=''; return h<=H-36; }; for(const c of ['tight','tight2','tight3']){ if(fits()) break; f.classList.add(c); } return; }
  }); }
fitPages(); addEventListener('resize',()=>{ clearTimeout(fitPages._t); fitPages._t=setTimeout(fitPages,150); });

let AC=null; const ac=()=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }catch(e){ return null; } };
function rustle(){ const A=ac(); if(!A) return; const d=.45, n=A.createBuffer(1,A.sampleRate*d,A.sampleRate), a=n.getChannelData(0); for(let i=0;i<a.length;i++){ const t=i/a.length; a[i]=(Math.random()*2-1)*Math.pow(1-t,2.2)*(t<.08?t/.08:1)*(.6+.4*Math.sin(t*38)); }
  const s=A.createBufferSource(); s.buffer=n; const f=A.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.7; const g=A.createGain(); g.gain.value=.08; s.connect(f); f.connect(g); g.connect(A.destination); s.start(); }

/* 배경음악: 첫 터치에 잔잔하게 시작, 목소리가 나올 땐 낮춘다 */
const BG_LV=.14, BG_DUCK=.025; let bgG=null, bgOn=true, bgLv=BG_LV;
try{ bgOn=localStorage.getItem('obBookBgm')!=='0'; }catch(e){}
function bgSet(lv,sec=.8){ bgLv=lv; if(!bgG) return; const g=bgG.gain,t=AC.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(bgOn?lv:0,t+sec); }
function bgStart(){ const A=ac(); if(!A||bgG) return; if(A.state==='suspended') A.resume();
  bgG=A.createGain(); bgG.gain.value=0; bgG.connect(A.destination);
  fetch('a/book_bgm.mp3').then(r=>r.arrayBuffer()).then(b=>A.decodeAudioData(b)).then(buf=>{ const s=A.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(bgG); s.start(); bgSet(bgLv,2); }).catch(()=>{}); }
document.addEventListener('pointerdown',bgStart,{once:true});
function muUi(){ $('muB').classList.toggle('off',!bgOn); }
$('muB').onclick=e=>{ e.stopPropagation(); bgStart(); bgOn=!bgOn; try{ localStorage.setItem('obBookBgm',bgOn?'1':'0'); }catch(_){} muUi(); bgSet(bgLv,.4); toastS(bgOn?'배경음악 켜짐':'배경음악 꺼짐'); };

let cur=0;

function startLoop(l){ const v=l.querySelector('video.lp'); if(!v) return; setTimeout(()=>{ if(leaves[cur]!==l) return; if(!v.getAttribute('src')) v.src=v.dataset.src; v.muted=true; try{ v.currentTime=0; }catch(e){} v.onplaying=()=>v.classList.add('on'); v.play().catch(()=>{}); },500); }
/* 목소리 쪽: 넘기는 터치 안에서 바로 소리 내어 재생. 막히면 소리 없이 시작하고 '다시 듣기'로 소리 */
function enterLoop(l){ const e=l.querySelector('video.en'); if(!e||leaves[cur]!==l) return; if(!e.getAttribute('src')) e.src=e.dataset.src; e.muted=true; e.onplaying=()=>e.classList.add('on'); e.play().catch(()=>{}); }
function playVoice(l,force){ const v=l.querySelector('video.vc'); if(!v) return; const sub=l.querySelector('.vsub'); let off=false; try{ off=!force&&sessionStorage.getItem('obSnd')==='0'; }catch(_){}
  if(!v.getAttribute('src')) v.src=v.dataset.src; try{ v.currentTime=0; }catch(e){}
  const e=l.querySelector('video.en'); if(e){ try{ e.pause(); }catch(_){} e.classList.remove('on'); }
  v.muted=off; v.onplaying=()=>{ v.classList.add('on'); if(!v.muted) bgSet(BG_DUCK,.4); setTimeout(()=>{ if(leaves[cur]===l&&sub) sub.classList.add('on'); },500); };
  v.onended=()=>{ bgSet(BG_LV,1.2); v.classList.remove('on'); enterLoop(l); };
  v.play().catch(()=>{ v.muted=true; v.play().catch(()=>enterLoop(l)); toastS('다시 듣기를 누르면 목소리가 들려요'); }); if(off) toastS('다시 듣기를 누르면 목소리가 들려요'); }
function activate(){ leaves.forEach((l,i)=>{ const on=i===cur; l.classList.toggle('cur',on); if(!on) stopVids(l); else startLoop(l); });
  const p=PAGES[cur]; bgSet(BG_LV); if(p.t==='voice') playVoice(leaves[cur]);
  $('prev').disabled=cur===0; $('next').disabled=cur===N-1; $('pgN').textContent=`${cur+1} / ${N}`; $('prog').style.width=(cur/(N-1)*100)+'%';
  $('runT').textContent=p.t==='cover'?'팔자에 신이 들었다':(p.toc||`${p.ch} · ${p.hd}`);
  $('tocL').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur)); try{ sessionStorage.setItem('obBookPg',cur); }catch(e){}
  /* 다음 쪽이 목소리 쪽이면 미리 받아 둔다 */
  const nx=leaves[cur+1]; if(nx){ const v=nx.querySelector('video.vc'); if(v&&!v.getAttribute('src')){ v.src=v.dataset.src; v.preload='auto'; try{ v.load(); }catch(e){} } } }
function go(n,sound=true){ n=Math.max(0,Math.min(N-1,n)); if(n===cur) return;
  leaves.forEach((l,i)=>{ const t=i<n; if(l.classList.contains('turned')!==t){ l.classList.add('moving'); setTimeout(()=>l.classList.remove('moving'),950); } l.classList.toggle('turned',t); });
  cur=n; if(sound) rustle(); try{ navigator.vibrate&&navigator.vibrate(8); }catch(e){} activate(); }
$('next').onclick=()=>go(cur+1); $('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
setTimeout(()=>{ try{ const m=location.hash.match(/p=(\d+)/); if(m) go(+m[1],false); }catch(e){} },300);

function toastS(t){ const e=$('snd'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1800); }
function wake(l){ const P=PAGES[+l.dataset.i], pop=l.querySelector('.pop');
  const v=pop&&pop.querySelector('video.tk'); if(!v) return;
  if(!v.getAttribute('src')) v.src=v.dataset.src; v.muted=!P.talk; try{ v.currentTime=0; }catch(e){} pop.classList.add('awake');
  const done=()=>{ v.classList.remove('on'); pop.classList.remove('awake'); bgSet(BG_LV,1.2); };
  v.onplaying=()=>{ v.classList.add('on'); bgSet(BG_DUCK,.4); }; v.onended=done; v.onerror=done; v.onpause=()=>{ if(!v.ended) bgSet(BG_LV,1.2); };
  v.play().catch(()=>{ v.muted=true; v.play().catch(done); toastS('소리를 켜면 목소리가 들려요'); }); }

let drag=null;
$('book').addEventListener('pointerdown',e=>{ if(e.target.closest('button,[data-wake]')) return; const r=$('book').getBoundingClientRect(); drag={x:e.clientX,w:r.width,left:e.clientX-r.left<r.width*.3,moved:false,leaf:null,dir:0,k:0}; });
addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(!drag.moved&&Math.abs(dx)<8) return;
  if(!drag.moved){ drag.moved=true; drag.dir=dx<0?1:-1; drag.leaf=drag.dir>0?leaves[cur]:leaves[cur-1]; if(!drag.leaf||(drag.dir>0&&cur===N-1)){ drag.leaf=null; return; } drag.leaf.classList.add('drag','moving'); }
  if(!drag.leaf) return; const k=Math.max(0,Math.min(1,drag.dir>0?-dx/drag.w:1-dx/drag.w)); drag.k=k; drag.leaf.style.transform=`rotateY(${-178*k}deg)`; });
addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null;
  if(d.leaf){ d.leaf.classList.remove('drag'); d.leaf.style.transform=''; setTimeout(()=>d.leaf.classList.remove('moving'),950); if(d.dir>0){ if(d.k>.25) go(cur+1); } else { if(d.k<.75) go(cur-1); } return; }
  if(!d.moved&&!e.target.closest('button,[data-wake]')){ if(d.left) go(cur-1); else go(cur+1); } });
$('book').addEventListener('click',e=>{ const w=e.target.closest('[data-wake]'); if(w){ wake(w.closest('.leaf')); return; } const vb=e.target.closest('[data-voice]'); if(vb){ try{ sessionStorage.removeItem('obSnd'); }catch(_){} playVoice(vb.closest('.leaf'),true); return; } const b=e.target.closest('[data-go]'); if(!b) return; if(b.dataset.go==='restart'){ go(0); return; } try{ sessionStorage.setItem('toHome','1'); }catch(_){} location.href='./'; });
$('tocB').onclick=()=>$('toc').classList.add('on');
$('toc').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b) go(+b.dataset.i); if(b||e.target.closest('.x')) $('toc').classList.remove('on'); };
$('back').onclick=()=>{ try{ sessionStorage.setItem('toHome','1'); }catch(e){} if(history.length>1) history.back(); else location.href='./'; };

/* 입체감: 손가락 · 마우스 · 폰 기울기에 따라 책 · 배경 · 인물이 서로 다른 깊이로 움직인다. 입력이 없으면 숨 쉬듯 아주 느리게 흔들린다 */
(()=>{ const st=$('stage'); let gx=0,gy=0,x=0,y=0,last=-1e9;
  const set=(a,b)=>{ gx=Math.max(-1,Math.min(1,a)); gy=Math.max(-1,Math.min(1,b)); last=performance.now(); };
  addEventListener('pointermove',e=>{ if(drag&&drag.moved) return; const r=st.getBoundingClientRect(); set(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2); },{passive:true});
  addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; set(e.gamma/22,(e.beta-40)/24); },{passive:true});
  const tick=t=>{ let tx=gx,ty=gy; if(t-last>2500){ tx=Math.sin(t/2600)*.35; ty=Math.cos(t/3400)*.22; }
    x+=(tx-x)*.06; y+=(ty-y)*.06; st.style.setProperty('--tx',x.toFixed(3)); st.style.setProperty('--ty',y.toFixed(3)); requestAnimationFrame(tick); };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick); })();

(()=>{ let s=0; try{ s=+(sessionStorage.getItem('obBookPg')||0); }catch(e){} if(s>0&&s<N){ go(s,false); } else activate(); })();
</script>
